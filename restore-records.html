n年柱与命柱和身宫冲。\n卯酉冲\n\n命宫与身宫相同，丁酉\n\n年柱与胎元相合。\n丙辛合水\n卯戌合火\n\n丙丁阴阳合\n\n注意亥年：亥卯未合木。\n注意巳年：巳酉丑。\n\n己土日主，月日时强根比肩。\n精神层面，印枭，食神\n全局，印枭，比肩，食神是最强。两个七杀透出，人元司令是己土。\n1、土扛杀。\n2、七杀来自于年柱，即陌生人，场合，隔代权力人员。也就是在陌生场合中，月柱及时柱的七杀才有力量发挥作用。\n3、辛卯，是食神坐七杀。外是食神自在，内是七杀压力。\n4、食神根在命宫与身宫，很强，可以压住七杀。\n5、卯戌合火，火是印枭。丙辛合水，水是财。在陌生场合，平时卯克戌，生理上不喜欢，关往后合成火与丙火一致，也就是丙辛，卯戌都是先克后合，需要适应一段时间才行。平时合成印，冲突时合成财，生理上想合，而心理以及习惯方面又不愿意。而卯的力量弱，酉戌强，所以卯就被冲，卯戌合不成。\n\n6、卯与命酉，身酉相冲。平时陌生人，自己心不喜欢，行为也看不惯。\n7、丁酉，丁酉是自刑，酉酉就是标准的反复，丁酉就是要求高，怀疑自己。命宫与身宫一起就会触发。\n\n8、己丑，丁酉。\n\n情绪管理\n命-身，是情绪同步，丁辛，敏感，自挑。想放松自在，丁枭不允许，认为自己技术够好了，丁枭不放过自己。命身都在挑。\n\n命-时，时柱生命，是能量往回流，乙生丁，丑生酉，情绪受语言影响比较大，语言以情绪为主，表达都是要回头考虑情绪，表达不是很顺畅。\n\n时-身，时柱以身宫为主，丑生酉，乙生丁。\n\n做事，比肩-七杀。精神功能是印枭-食神\n平时，就是土金-木。大事，乙-丙丁-己-辛。\n\n正财没有，偏才中气，没有官，只有杀，只有食神无伤官。比肩多，劫财少。\n\n全局，水最弱。\n做事上，水，金，火是最弱。所以得调用精神功能才好平衡。\n\n精神功能强，硬杠力量弱，安全感足，自我要求高。\n\n朋友关系，平时同频，对方做主。\n上级关系，平时对立，对方做主。\n陌生关系，平时被控，对方为主。\n贵人关系，平时相合，对方生自，平时生自，对方阴阳合。\n\n\n\n\n\n\n\n", "note": "原始记录"}, {"key": "bz_rec_notes_苓菲|女|1992|12|31|0|12", "text": "土-金-水\n\n日柱是火克金，质是火土金的组合\n\n日柱与命宫，木火金\n\n", "note": "原始记录"}, {"key": "bz_rec_notes_谢洁|女|1984|12|20|8|20", "text": "子丑合土，子卯刑\n\n丙丁阴阳合\n\n戊己阴阳合\n\n甲己合土\n\n注意：\n寅卯辰，流年寅。\n亥子丑，流年亥\n巳酉丑，流年酉\n\n戊有时柱有强根。\n丙火没有根，在身宫有强根。\n\n水没有透。\n", "note": "原始记录"}, {"key": "bz_rec_notes_邦顺|男|1982|10|18|5|1", "text": "年月日支相同：\n\n三戌生一庚：\n\n一甲克三戌：\n\n卯戌火-戌-庚-壬-甲-丁：\n\n卯戌合：\n\n戌辰冲：\n\n寅卯辰三会：\n\n甲庚冲：\n\n丁壬合木：\n\n庚辛阴阳合：\n丑戌阴阳合：\n\n日命两甲\n\n\n\n\n", "note": "原始记录"}, {"key": "bz_rec_notes_阮宇君|女|1981|9|6|22|30", "text": "07 年丁亥年，财运很好。\n\n10 年庚寅年，买房。\n15 年乙未年，换宝马。\n25 年乙巳年，赚钱。\n\n19 年己亥年，生孩子。\n09 年己丑年，结婚，生孩子。\n11 年辛卯年 8 月 18 日新历，离婚。\n\n16 年丙申年，和何同学。\n19 年己亥年，领结婚证。\n\n08 年戊子年，股灾。\n\n申酉戌，三会火局。\n丙辛合水。\n丁壬合木\n木，火，金，水", "note": "原始记录"}, {"key": "bz_rec_notes_韦环骏|男|2020|8|31|8|0", "text": "辛巳，丙辛合水\n\n申子辰合水局，亥巳冲\n子午冲，子丑合土\n亥子丑汇水局，申巳刑\n\n注意\n未年，己午未汇火局\n酉年，巳酉丑汇金局\n寅年，寅申冲，寅亥合破\n\n甲庚冲，甲己合土，丙壬冲，乙庚合金，丙辛合水，甲乙阴阳合\n\n与平台关系\n丙申，老师生他，平时可以调用学校资源，但是申子辰合水，反过来被水克。\n申子辰合水，是输入，思考，输出合了水局，工作学习思考甲，能将水转为木，再生火。庚-水局-甲-丙火。\n\n少了土的能量，而身宫的土最强的柱，也就是行为，习惯。\n\n与贵人关系\n辛生亥，是喜欢贵人，巳亥冲，贵人说了算，乙辛冲，自己要说了算。站在了对立面。\n乙酉运，巳酉丑合金，金生亥。\n庚子年，乙庚合金，子亥为水。\n\n与朋友关系\n丙壬冲，午生辰。平时和谐，决策冲突。\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n", "note": "原始记录"}, {"key": "bz_rec_notes_龚洁|女|1992|1|18|10|29", "text": "未丑冲\n月柱与身宫上下冲，乙辛冲，未丑冲。\n\n巳亥冲\n\n时胎：丁壬合木，巳生辰。\n年月辛冲身乙。\n\n年身未冲月支丑。\n日时巳冲命支亥。\n\n日胎，癸壬阴阳合，巳生辰。也就是贵人，丁壬合木，是丁的印，是壬是食伤。\n\n大运甲辰，伤官坐官，有规则的破规，就是符合规则下的创新或约束与反抗的主题。\n\n注意年份：\n卯年，亥卯未，合木局。\n午年，巳午未，会火局。\n\n月柱与身宫对冲。\n\n煤气中毒，巳火重要性提高了。\n\n", "note": "原始记录"}];

function get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function put(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ return false; } }

function plan(){
  var rows = [];
  DATA.forEach(function(op){
    var cur = get(op.key);
    var curLen = cur == null ? -1 : cur.length;
    var want = op.text.length;
    var cls, action;
    if (cur === null) { cls = 'bad'; action = '写入（当前不存在）'; }
    else if (cur === op.text) { cls = 'ok'; action = '已一致，跳过'; }
    else if (curLen < want) { cls = 'warn'; action = '补齐 ' + curLen + ' → ' + want + ' 字'; }
    else { cls = 'muted'; action = '本地更长（' + curLen + ' 字），跳过'; }
    rows.push({op: op, cur: cur, cls: cls, action: action});
  });
  return rows;
}

  try { for (var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k&&k.indexOf('bz_rec_notes_')===0) n++; } } catch(e){}
  var d = document.getElementById('diag');
  d.innerHTML = '当前浏览器共有 <b>' + n + '</b> 条分析记录（<code>bz_rec_notes_*</code>）。'
    + (n === 0 ? ' <span class="bad">一条都没有——和诊断结论一致，需要执行下面的恢复。</span>'
               : ' 下面把每一份和历史快照逐条比对。');
}

function renderPlan(){
  var rows = plan();
  var h = '<table><tr><th>命主 / 键</th><th>动作</th><th>说明</th></tr>';
  rows.forEach(function(r){
    var k = r.op.key.replace('bz_rec_notes_','');
    h += '<tr><td><code>' + k + '</code></td><td class="' + r.cls + '">' + r.action + '</td><td class="muted">' + r.op.note + '</td></tr>';
  });
  h += '</table>';
  document.getElementById('plan').innerHTML = h;
}

function snapshot(){
  var out = {};
  DATA.forEach(function(op){
    out[op.key] = get(op.key);
  });
  var blob = new Blob([JSON.stringify({
    exportedAt: new Date().toISOString(),
    note: '分析记录恢复前备份（值为 null 表示当时不存在）',
    before: out
  }, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var t = new Date();
  a.href = url;
  a.download = '分析记录备份-' + t.getFullYear() + ('0'+(t.getMonth()+1)).slice(-2) + ('0'+t.getDate()).slice(-2)
    + '-' + ('0'+t.getHours()).slice(-2) + ('0'+t.getMinutes()).slice(-2) + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 8000);
}

document.getElementById('dl').onclick = function(){ snapshot(); };

document.getElementById('go').onclick = function(){
  snapshot();
  var rows = plan();
  var done = [], skip = [];
  rows.forEach(function(r){
    if (r.cls === 'ok' || r.cls === 'muted') { skip.push(r.op.key); return; }
    if (put(r.op.key, r.op.text)) done.push(r.op.key.replace('bz_rec_notes_','') + '（' + r.op.text.length + ' 字）');
    else skip.push(r.op.key);
  });
  document.getElementById('out').innerHTML =
    '<p class="ok">完成！写入 ' + done.length + ' 条，跳过 ' + skip.length + ' 条</p>'
    + (done.length ? '<pre>' + done.join('\n') + '</pre>' : '')
    + '<p><b>下一步：</b>回到 <a href="index.html">排盘页</a>，打开对应档案 → 分析记录，内容就在了。</p>';
  renderDiag(); renderPlan();
};

renderDiag();
renderPlan();
</script>
</body>
</html>
