<!DOCTYPE html>
<!-- 八字排盘 · 能力排盘模块 v4.0 | 2026-07-28 -->
<!-- 模式一：元能力卡片（v3保留） | 模式二：HTML表格+SVG三层连线（v4重写） -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>能力排盘</title>
<style>
:root{--bg:#f5f0e8;--card-bg:#fff;--text:#3d3226;--muted:#8b7e6a;--wood:#4a8c3f;--fire:#c83a3a;--earth:#b8933c;--metal:#9b8c6c;--water:#3a6a9b;--line-ke:#c83a3a;--line-sheng:#2e8b3d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-width:680px}
#app{max-width:1200px;margin:0 auto;padding:16px 24px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #d9cfb0;margin-bottom:20px}
header .info{text-align:center}
header .info .name{font-size:20px;font-weight:bold}
header .info .meta{font-size:13px;color:var(--muted);margin-top:2px}
.btn-back{font-size:13px;color:var(--muted);text-decoration:none;cursor:pointer;border:1px solid #c4b896;border-radius:4px;padding:4px 12px;background:#fff}
.btn-back:hover{background:#e8dfcc}
.mode-switch{display:flex;gap:0;border:1px solid #c4b896;border-radius:4px;overflow:hidden}
.mode-switch button{padding:6px 16px;font-size:14px;cursor:pointer;border:none;background:#fff;color:var(--muted)}
.mode-switch button.active{background:var(--text);color:#fff}
footer{text-align:center;padding:24px 0;font-size:12px;color:var(--muted);border-top:1px solid #d9cfb0;margin-top:20px}

/* 元能力卡片 */
#yuan-mode{padding:8px 0}
.pillar-row{display:flex;gap:12px;margin-bottom:16px;justify-content:center}
.pillar-row.sanyuan{margin-top:8px}
.pillar-card{flex:1;min-width:90px;max-width:120px;background:var(--card-bg);border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden;text-align:center}
.pillar-card .card-hd{font-size:12px;color:var(--muted);padding:4px 0;background:#f8f5ed;border-bottom:1px solid #efeadb}
.pillar-card .gan-row{padding:8px 6px 2px}
.pillar-card .gan-row .ability{font-size:20px;font-weight:bold;display:block}
.pillar-card .gan-row .ss{font-size:12px;color:var(--muted);display:block;margin-top:1px}
.pillar-card .zhi-row{padding:4px 6px 8px;border-top:1px dashed #efeadb}
.pillar-card .zhi-row .ability{font-size:20px;font-weight:bold;display:block}
.pillar-card .zhi-row .ss{font-size:12px;color:var(--muted);display:block;margin-top:1px}
.pillar-card .cg-row{padding:6px;border-top:1px dashed #efeadb;background:#fdfcf8}
.pillar-card .cg-row .cg-combo{font-size:15px;font-weight:bold;display:block;margin-bottom:2px}
.pillar-card .cg-row .cg-detail{font-size:11px;line-height:1.6}

/* 五行色文字 */
.c-wood{color:var(--wood)} .c-fire{color:var(--fire)} .c-earth{color:var(--earth)} .c-metal{color:var(--metal)} .c-water{color:var(--water)}

/* ===== 模式二：表格 + SVG 覆盖（v4 新增） ===== */
#zuhe-mode{padding:8px 0;overflow-x:auto}
.chart-container{position:relative;display:inline-block;min-width:100%}

/* 表格骨架 */
.ability-table{border-collapse:collapse;margin:0 auto;position:relative;z-index:1}
.ability-table td{text-align:center;vertical-align:middle;padding:8px 12px;min-width:100px;border:1px solid #e0d8c0}
.ability-table td:first-child{border-left:2px solid #c4b896}
.ability-table td:last-child{border-right:2px solid #c4b896}

/* R1: 生命域 */
.row-domain td{font-size:13px;color:var(--muted);padding:6px 12px;background:#faf8f2;border-bottom:1px dashed #d9cfb0}

/* R2: 十神 */
.row-shishen td{font-size:14px;color:#333;padding:10px 12px;border-bottom:1px solid #e0d8c0}

/* R3: 天干 */
.row-tiangan td{padding:14px 12px 6px;border-bottom:1px solid #e0d8c0}
.tg-char{font-size:28px;font-weight:bold;line-height:1.2;display:block}
.tg-ability{font-size:13px;margin-top:2px;display:block}
.ri-zhu .tg-char{border:2px solid #c83a3a;border-radius:50%;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;margin:0 auto;line-height:1}

/* R4: 地支 */
.row-dizhi td{padding:10px 12px 6px;border-bottom:1px solid #e0d8c0}
.dz-char{font-size:28px;font-weight:bold;line-height:1.2;display:block}
.dz-ability{font-size:13px;margin-top:2px;display:block}

/* R5: 藏干 */
.row-canggan td{font-size:12px;padding:10px 12px;line-height:1.7;border-bottom:2px solid #c4b896;background:#fdfcf8}
.row-canggan td:first-child{border-left:2px solid #c4b896}
.row-canggan td:last-child{border-right:2px solid #c4b896}

/* SVG 连线层 */
.lines-overlay{position:absolute;top:0;left:0;pointer-events:none;z-index:2;width:100%;height:100%}

/* 空状态 */
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state p{font-size:16px;margin-bottom:12px}
.empty-state a{color:var(--water)}

@media print{
  .btn-back,.mode-switch{display:none}
  body{background:#fff}
  #app{padding:0}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="btn-back" href="javascript:window.close()">← 返回排盘</a>
    <div class="info" id="header-info"></div>
    <div class="mode-switch">
      <button id="btn-yuan" class="active" onclick="switchMode('yuan')">元能力</button>
      <button id="btn-zuhe" onclick="switchMode('zuhe')">组合能力</button>
    </div>
  </header>
  <div id="yuan-mode"></div>
  <div id="zuhe-mode" style="display:none"></div>
  <div id="empty-state" class="empty-state" style="display:none">
    <p>未收到命盘数据</p>
    <p>请从<a href="standalone.html">排盘页面</a>打开</p>
  </div>
</div>
<footer>八字排盘 · 能力视图 · v4.0</footer>

<script>
// ===== 常量映射表 =====
const TG=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const DZ=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const WU_XING={甲:'木',乙:'木',丙:'火',丁:'火',戊:'土',己:'土',庚:'金',辛:'金',壬:'水',癸:'水',子:'水',丑:'土',寅:'木',卯:'木',辰:'土',巳:'火',午:'火',未:'土',申:'金',酉:'金',戌:'土',亥:'水'};
const GAN_TO_ABILITY={甲:'联想力',乙:'联想力',丙:'概括力',丁:'概括力',戊:'整合力',己:'整合力',庚:'分析力',辛:'分析力',壬:'推理力',癸:'推理力'};
const ZHI_TO_ABILITY={子:'推理力',丑:'整合力',寅:'联想力',卯:'联想力',辰:'整合力',巳:'概括力',午:'概括力',未:'整合力',申:'分析力',酉:'分析力',戌:'整合力',亥:'推理力'};
const WX_KE_COMBO={木土:'破框力',土水:'限流力',水火:'纠错力',火金:'验真力',金木:'辨异力'};
const WX_SHENG_COMBO={木火:'领悟力',火土:'吸纳力',土金:'理解力',金水:'运用力',水木:'创意力'};
const WX_SAME_COMBO={木:'强联想力',火:'强概括力',土:'强整合力',金:'强分析力',水:'强推理力'};
const WX_TRIPLE_COMBO={木火土:'构建力',火土金:'提炼力',土金水:'解决力',金水木:'探究力',水木火:'创想力'};
const WX_SHENG_NEXT={木:'火',火:'土',土:'金',金:'水',水:'木'};
const WX_KE_NEXT={木:'土',土:'水',水:'火',火:'金',金:'木'};
const CANG_GAN={子:['癸'],丑:['己','癸','辛'],寅:['甲','丙','戊'],卯:['乙'],辰:['戊','乙','癸'],巳:['丙','庚','戊'],午:['丁','己'],未:['己','丁','乙'],申:['庚','壬','戊'],酉:['辛'],戌:['戊','辛','丁'],亥:['壬','甲']};
const SHI_SHEN_SHORT={比肩:'比',劫财:'劫',食神:'食',伤官:'伤',偏印:'枭',正印:'印',偏财:'才',正财:'财',七杀:'杀',正官:'官',枭神:'枭'};
const WX_COLORS={木:'c-wood',火:'c-fire',土:'c-earth',金:'c-metal',水:'c-water'};
const WX_HEX={木:'#4a8c3f',火:'#c83a3a',土:'#b8933c',金:'#9b8c6c',水:'#3a6a9b'};
const PILLAR_LABELS={nian:'年',yue:'月',ri:'日',shi:'时',daYun:'大运',liuNian:'流年',tai:'胎',ming:'命',shen:'身'};
const MAIN_PILLARS=['nian','yue','ri','shi','daYun','liuNian'];
const SAN_PILLARS=['tai','ming','shen'];

// v4 新增：生命域静态映射
const PILLAR_TO_DOMAIN={nian:'公共/观摩',yue:'学校/协作',ri:'独处/自由',shi:'日常/独创'};

// ===== 工具函数 =====
function wxClass(gz){return WU_XING[gz]||''}
function wxColorCss(gz){return WX_COLORS[WU_XING[gz]]||''}
function wxColorHex(gz){return WX_HEX[WU_XING[gz]]||'#8b7e6a'}
function debounce(fn,ms){var t;return function(){clearTimeout(t);t=setTimeout(fn,ms)}}

// ===== 十神计算 =====
function shiShen(riGan,gan){
  if(riGan===gan) return '比肩';
  var dw=WU_XING[riGan],tw=WU_XING[gan];
  if(!dw||!tw) return '?';
  var yy=('甲丙戊庚壬'.indexOf(riGan)>=0)===('甲丙戊庚壬'.indexOf(gan)>=0);
  if(dw===tw) return yy?'比肩':'劫财';
  var s={木:'火',火:'土',土:'金',金:'水',水:'木'};
  var k={木:'土',土:'水',水:'火',火:'金',金:'木'};
  if(s[dw]===tw) return yy?'食神':'伤官';
  if(s[tw]===dw) return yy?'枭神':'正印';
  if(k[dw]===tw) return yy?'偏财':'正财';
  if(k[tw]===dw) return yy?'七杀':'正官';
  return '?';
}

// ===== 藏干综合能力名 =====
function computeComboFromLayers(layers){
  if(!layers||layers.length===0) return '';
  if(layers.length===1) return GAN_TO_ABILITY[layers[0]]||'';
  var w0=WU_XING[layers[0]],w1=WU_XING[layers[1]];
  if(!w0||!w1) return '';
  if(layers.length===2){
    if(w0===w1) return WX_SAME_COMBO[w0]||'';
    if(WX_KE_NEXT[w0]===w1) return WX_KE_COMBO[w0+w1]||'';
    if(WX_SHENG_NEXT[w0]===w1) return WX_SHENG_COMBO[w0+w1]||'';
    if(WX_KE_NEXT[w1]===w0) return WX_KE_COMBO[w1+w0]||'';
    if(WX_SHENG_NEXT[w1]===w0) return WX_SHENG_COMBO[w1+w0]||'';
    return '';
  }
  var w2=WU_XING[layers[2]];
  if(!w2) return '';
  if(WX_SHENG_NEXT[w0]===w1&&WX_SHENG_NEXT[w1]===w2) return WX_TRIPLE_COMBO[w0+w1+w2]||'';
  var parts=[];
  function pair(a,b){
    if(a===b) return WX_SAME_COMBO[a];
    if(WX_KE_NEXT[a]===b) return WX_KE_COMBO[a+b];
    if(WX_SHENG_NEXT[a]===b) return WX_SHENG_COMBO[a+b];
    if(WX_KE_NEXT[b]===a) return WX_KE_COMBO[b+a];
    if(WX_SHENG_NEXT[b]===a) return WX_SHENG_COMBO[b+a];
    return'';
  }
  parts.push(pair(w0,w1));parts.push(pair(w1,w2));
  return parts.filter(Boolean).join(' / ');
}

// ===== 关系判定 =====
function resolveRelation(wxA,wxB,isInverse){
  var prefix=isInverse?'反':'';
  if(wxA===wxB) return (isInverse?'强':'')+(WX_SAME_COMBO[wxA]||'');
  if(WX_KE_NEXT[wxA]===wxB) return prefix+(WX_KE_COMBO[wxA+wxB]||'');
  if(WX_SHENG_NEXT[wxA]===wxB) return prefix+(WX_SHENG_COMBO[wxA+wxB]||'');
  if(WX_KE_NEXT[wxB]===wxA) return prefix+(WX_KE_COMBO[wxB+wxA]||'');
  if(WX_SHENG_NEXT[wxB]===wxA) return prefix+(WX_SHENG_COMBO[wxB+wxA]||'');
  return '';
}

function lineColor(wxA,wxB){
  if(wxA===wxB) return WX_HEX[wxA];
  if(WX_KE_NEXT[wxA]===wxB||WX_KE_NEXT[wxB]===wxA) return '#c83a3a';
  if(WX_SHENG_NEXT[wxA]===wxB||WX_SHENG_NEXT[wxB]===wxA) return '#2e8b3d';
  return '#8b7e6a';
}

function lineDash(wxA,wxB){
  return (wxA===wxB)?'6,3':'none';
}

// ===== 箭头 marker 生成 =====
function createLineMarkers(svg){
  var defs=document.createElementNS('http://www.w3.org/2000/svg','defs');
  var markers=[
    {id:'arrow-red',color:'#c83a3a'},
    {id:'arrow-green',color:'#2e8b3d'},
    {id:'arrow-gray',color:'#9b8c6c'}
  ];
  markers.forEach(function(m){
    var mk=document.createElementNS('http://www.w3.org/2000/svg','marker');
    mk.setAttribute('id',m.id);
    mk.setAttribute('viewBox','0 0 6 6');
    mk.setAttribute('refX','6');
    mk.setAttribute('refY','3');
    mk.setAttribute('markerWidth','6');
    mk.setAttribute('markerHeight','6');
    mk.setAttribute('orient','auto');
    var p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d','M0,0 L6,3 L0,6 Z');
    p.setAttribute('fill',m.color);
    mk.appendChild(p);
    defs.appendChild(mk);
  });
  svg.appendChild(defs);
}

function arrowId(col){
  if(col==='#c83a3a') return 'url(#arrow-red)';
  if(col==='#2e8b3d') return 'url(#arrow-green)';
  return 'url(#arrow-gray)';
}

// ===== 数据解析 =====
var gData=null;
var gIsZuHeRendered=false;

function parseData(){
  var hash=window.location.hash;
  if(hash&&hash.indexOf('#data=')===0){
    try{ var json=decodeURIComponent(escape(atob(hash.slice(6)))); return JSON.parse(json); }catch(e){}
  }
  try{ var ls=localStorage.getItem('ability-chart-data');
    if(ls){localStorage.removeItem('ability-chart-data');return JSON.parse(ls);}
  }catch(e){}
  return null;
}

// ===== 获取有效数据（处理双胞胎主盘） =====
function getActiveData(){
  if(!gData) return null;
  if(gData.twin&&gData.main) return gData.main;
  return gData;
}

// ===== 初始化 =====
function init(){
  gData=parseData();
  if(!gData){document.getElementById('empty-state').style.display='block';return}
  document.getElementById('empty-state').style.display='none';
  renderHeader();
  renderYuanNengLi();
}

function switchMode(m){
  var y=document.getElementById('yuan-mode'),z=document.getElementById('zuhe-mode');
  var by=document.getElementById('btn-yuan'),bz=document.getElementById('btn-zuhe');
  if(m==='yuan'){
    y.style.display='';z.style.display='none';
    by.classList.add('active');bz.classList.remove('active');
  }else{
    y.style.display='none';z.style.display='';
    by.classList.remove('active');bz.classList.add('active');
    if(!gIsZuHeRendered){renderZuHeNengLi();gIsZuHeRendered=true}
    else{redrawAllLines()}
  }
}

function renderHeader(){
  var d=gData,n=d.name||'',g=d.gender||'';
  var sl=g==='男'?'乾造':'坤造',rg=d.ri?d.ri.gan:'?';
  var nn=d.nian?d.nian.gan+d.nian.zhi:'',y=d.y||'',m=d.m||'',dd=d.d||'',h=d.h||'',mi=d.mi||'';
  function p(n){return n<10?'0'+n:''+n}
  document.getElementById('header-info').innerHTML=
    '<div class="name">'+n+' · '+sl+' · '+rg+'日主</div>'+
    '<div class="meta">'+nn+'年 '+y+'年'+m+'月'+dd+'日 '+p(h)+':'+p(mi)+'</div>';
}

// ===== 模式一：元能力（v3 保持不变） =====
function renderYuanNengLi(){
  var c=document.getElementById('yuan-mode');c.innerHTML='';
  var d=gData,rg=d.ri?d.ri.gan:'?';
  function pd(k){
    var s=d[k];if(!s)return null;
    if(Array.isArray(s)){
      var qy=d.qiYun||{},now=new Date().getFullYear();
      var idx=s.length-1;
      for(var i=s.length-1;i>=0;i--){if(s[i].startYear<=now){idx=i;break}}
      if(idx<0)idx=0;
      s=s[idx]||null;
      if(!s)return null;
    }
    var lg=CANG_GAN[s.zhi]||[],combo=computeComboFromLayers(lg);
    var det=lg.map(function(g){return '<span class="'+wxColorCss(g)+'">'+g+':'+(GAN_TO_ABILITY[g]||'')+'</span>'}).join('<br>');
    return{gan:s.gan,zhi:s.zhi,key:k,label:PILLAR_LABELS[k]||k,combo:combo,detail:det};
  }
  var all=[];
  MAIN_PILLARS.forEach(function(k){var p=pd(k);if(p)all.push(p)});
  SAN_PILLARS.forEach(function(k){var p=pd(k);if(p)all.push(p)});
  function ch(p){
    var g=p.gan,z=p.zhi;
    return '<div class="pillar-card">'+
      '<div class="card-hd">'+p.label+'</div>'+
      '<div class="gan-row"><span class="ability '+wxColorCss(g)+'">'+(GAN_TO_ABILITY[g]||'')+'</span><span class="ss">'+shiShen(rg,g)+'</span></div>'+
      '<div class="zhi-row"><span class="ability '+wxColorCss(z)+'">'+(ZHI_TO_ABILITY[z]||'')+'</span><span class="ss">'+shiShen(rg,z)+'</span></div>'+
      '<div class="cg-row"><span class="cg-combo '+wxColorCss(z)+'">'+p.combo+'</span><div class="cg-detail">'+p.detail+'</div></div></div>';
  }
  var mp=all.filter(function(p){return MAIN_PILLARS.indexOf(p.key)>=0});
  var sp=all.filter(function(p){return SAN_PILLARS.indexOf(p.key)>=0});
  var h='<div class="pillar-row">'+mp.map(ch).join('')+'</div>';
  if(sp.length) h+='<div class="pillar-row sanyuan">'+sp.map(ch).join('')+'</div>';
  c.innerHTML=h;
}

// ===== 模式二：组合能力（v4 重写 - 表格骨架 + SVG 覆盖） =====

function renderZuHeNengLi(){
  var d=getActiveData();
  if(!d) return;
  var container=document.getElementById('zuhe-mode');
  var riGan=d.ri?d.ri.gan:'?';
  var pillars=['nian','yue','ri','shi'];
  var cols=pillars.map(function(key){
    var col=d[key];
    if(!col) return null;
    var cg=CANG_GAN[col.zhi]||[];
    return{
      gan:col.gan,zhi:col.zhi,key:key,
      wg:WU_XING[col.gan]||'',wz:WU_XING[col.zhi]||'',
      ga:GAN_TO_ABILITY[col.gan]||'',za:ZHI_TO_ABILITY[col.zhi]||'',
      ssGan:shiShen(riGan,col.gan),ssZhi:shiShen(riGan,col.zhi),
      cg:cg,combo:computeComboFromLayers(cg),
      isRi:(key==='ri')
    };
  });

  // 构建表格 HTML
  var h='<div class="chart-container" id="chart-container">';
  h+='<table class="ability-table" id="ability-table">';

  // R1: 生命域
  h+='<tr class="row-domain">';
  pillars.forEach(function(key){h+='<td>'+PILLAR_TO_DOMAIN[key]+'</td>'});
  h+='</tr>';

  // R2: 十神
  h+='<tr class="row-shishen">';
  cols.forEach(function(c){
    if(!c){h+='<td></td>';return}
    if(c.isRi){h+='<td>日主◎</td>'}
    else{h+='<td>'+c.ssGan+'</td>'}
  });
  h+='</tr>';

  // R3: 天干
  h+='<tr class="row-tiangan">';
  cols.forEach(function(c){
    if(!c){h+='<td></td>';return}
    var cls=c.isRi?' ri-zhu':'';
    h+='<td class="tg-cell'+cls+'"><span class="tg-char '+wxColorCss(c.gan)+'">'+c.gan+'</span><span class="tg-ability '+wxColorCss(c.gan)+'">'+c.ga+'</span></td>';
  });
  h+='</tr>';

  // R4: 地支
  h+='<tr class="row-dizhi">';
  cols.forEach(function(c){
    if(!c){h+='<td></td>';return}
    h+='<td class="dz-cell"><span class="dz-char '+wxColorCss(c.zhi)+'">'+c.zhi+'</span><span class="dz-ability '+wxColorCss(c.zhi)+'">'+c.za+'</span></td>';
  });
  h+='</tr>';

  // R5: 藏干
  h+='<tr class="row-canggan">';
  cols.forEach(function(c){
    if(!c){h+='<td></td>';return}
    h+='<td>';
    var cg=c.cg;
    cg.forEach(function(g){
      var ss=shiShen(riGan,g);
      var ab=GAN_TO_ABILITY[g]||'';
      h+='<div class="'+wxColorCss(g)+'">'+g+SHI_SHEN_SHORT[ss]+'→'+ab+'</div>';
    });
    h+='<div><strong class="'+wxColorCss(c.zhi)+'">→ '+c.combo+'</strong></div>';
    h+='</td>';
  });
  h+='</tr>';

  h+='</table>';
  h+='<svg class="lines-overlay" id="lines-overlay"></svg>';
  h+='</div>';

  container.innerHTML=h;

  // 等待布局完成，计算坐标并绘制连线
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      drawAllLines(cols);
    });
  });
}

function drawAllLines(cols){
  var chart=document.getElementById('chart-container');
  var table=document.getElementById('ability-table');
  var svg=document.getElementById('lines-overlay');
  if(!chart||!table||!svg) return;

  var chartRect=chart.getBoundingClientRect();
  var W=chartRect.width,H=chartRect.height;

  // 设置 SVG 尺寸
  svg.setAttribute('width',W);
  svg.setAttribute('height',H);
  svg.style.width=W+'px';
  svg.style.height=H+'px';
  svg.innerHTML='';

  // 创建箭头 marker
  createLineMarkers(svg);

  // 读取各单元格坐标
  var tgCells=table.querySelectorAll('.row-tiangan td');
  var dzCells=table.querySelectorAll('.row-dizhi td');

  if(tgCells.length<4||dzCells.length<4) return;

  var tgRects=[],dzRects=[];
  for(var i=0;i<4;i++){
    tgRects.push(tgCells[i].getBoundingClientRect());
    dzRects.push(dzCells[i].getBoundingClientRect());
  }

  function rx(r){return r.left-chartRect.left}
  function ry(r){return r.top-chartRect.top}
  function cx(r){return r.left-chartRect.left+r.width/2}
  function cy(r){return r.top-chartRect.top+r.height/2}

  var el=[];

  // ===== L1: 天干间横箭头 (3条: 指向克方/生方→被克方/被生方) =====
  var l1Y=ry(tgRects[0])-28;
  for(var i=0;i<3;i++){
    var a=cols[i],b=cols[i+1];
    if(!a||!b) continue;
    // 判断方向：箭头从克方/生方出发。若克方/生方在右，画右→左
    var aToB=true;
    if(WX_KE_NEXT[b.wg]===a.wg) aToB=false;
    else if(WX_SHENG_NEXT[b.wg]===a.wg) aToB=false;
    var x1=aToB?cx(tgRects[i]):cx(tgRects[i+1]);
    var x2=aToB?cx(tgRects[i+1]):cx(tgRects[i]);
    var col=lineColor(a.wg,b.wg),dash=lineDash(a.wg,b.wg);
    var rel=resolveRelation(a.wg,b.wg,false);
    if(a.wg===b.wg){col=WX_HEX[a.wg]}
    el.push('<line x1="'+x1+'" y1="'+l1Y+'" x2="'+x2+'" y2="'+l1Y+'" stroke="'+col+'" stroke-width="2" stroke-dasharray="'+dash+'" marker-end="'+arrowId(col)+'"/>');
    if(rel){
      var mx=(cx(tgRects[i])+cx(tgRects[i+1]))/2;
      el.push('<text x="'+mx+'" y="'+(l1Y-4)+'" text-anchor="middle" font-size="12" fill="#8b7e6a">'+rel+'</text>');
    }
  }

  // ===== L2: 地支间横箭头 (3条: 指向克方/生方→被克方/被生方) =====
  var l2Y=ry(dzRects[0])-12;
  for(var i=0;i<3;i++){
    var a=cols[i],b=cols[i+1];
    if(!a||!b) continue;
    // 判断方向：箭头从克方/生方出发。若克方/生方在右，画右→左
    var aToB=true;
    if(WX_KE_NEXT[b.wz]===a.wz) aToB=false;
    else if(WX_SHENG_NEXT[b.wz]===a.wz) aToB=false;
    var x1=aToB?cx(dzRects[i]):cx(dzRects[i+1]);
    var x2=aToB?cx(dzRects[i+1]):cx(dzRects[i]);
    var col=lineColor(a.wz,b.wz),dash=lineDash(a.wz,b.wz);
    var rel=resolveRelation(a.wz,b.wz,false);
    if(a.wz===b.wz){col=WX_HEX[a.wz]}
    el.push('<line x1="'+x1+'" y1="'+l2Y+'" x2="'+x2+'" y2="'+l2Y+'" stroke="'+col+'" stroke-width="2" stroke-dasharray="'+dash+'" marker-end="'+arrowId(col)+'"/>');
    if(rel){
      var mx=(cx(dzRects[i])+cx(dzRects[i+1]))/2;
      el.push('<text x="'+mx+'" y="'+(l2Y+16)+'" text-anchor="middle" font-size="11" fill="#8b7e6a">'+rel+'</text>');
    }
  }

  // ===== L3: 柱内纵向贝塞尔弧线 (4条) =====
  for(var i=0;i<4;i++){
    var c=cols[i];
    if(!c) continue;
    var tgy=cy(tgRects[i]),dzY=cy(dzRects[i]);
    var arcX=rx(tgRects[i])-4; // 柱左边缘-4px
    var ctrlX=arcX-18;         // 控制点左偏18px
    var ctrlY=(tgy+dzY)/2;

    // 反前缀：仅支克干加反
    var isKe=WX_KE_NEXT[c.wz]===c.wg;
    var rel=resolveRelation(c.wz,c.wg,isKe);
    var col=lineColor(c.wg,c.wz);
    if(c.wg===c.wz){col=WX_HEX[c.wg]}

    el.push('<path d="M '+arcX+' '+tgy+' Q '+ctrlX+' '+ctrlY+' '+arcX+' '+dzY+'" fill="none" stroke="'+col+'" stroke-width="2.5"/>');
    if(rel){
      el.push('<text x="'+(ctrlX-6)+'" y="'+(ctrlY+5)+'" text-anchor="end" font-size="13" font-weight="bold" fill="'+col+'">'+rel+'</text>');
    }
  }

  svg.innerHTML=el.join('\n');
}

function redrawAllLines(){
  if(!gIsZuHeRendered) return;
  var d=getActiveData();
  if(!d) return;
  var riGan=d.ri?d.ri.gan:'?';
  var pillars=['nian','yue','ri','shi'];
  var cols=pillars.map(function(key){
    var col=d[key];
    if(!col) return null;
    var cg=CANG_GAN[col.zhi]||[];
    return{
      gan:col.gan,zhi:col.zhi,key:key,
      wg:WU_XING[col.gan]||'',wz:WU_XING[col.zhi]||'',
      ga:GAN_TO_ABILITY[col.gan]||'',za:ZHI_TO_ABILITY[col.zhi]||'',
      ssGan:shiShen(riGan,col.gan),ssZhi:shiShen(riGan,col.zhi),
      cg:cg,combo:computeComboFromLayers(cg),
      isRi:(key==='ri')
    };
  });
  drawAllLines(cols);
}

// resize 重绘
window.addEventListener('resize',debounce(redrawAllLines,150));

window.addEventListener('DOMContentLoaded',init);

</script>
</body>
