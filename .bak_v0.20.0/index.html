// ============ v0.6.1 卡片内大运表（luck-table 样式，替代 v0.6.0 pill）============
function buildCardLuckHTML(daYun, qiYun, data, options) {
  options = options || {};
  var identClass = options.identClass || 'twin-1';
  var shunLabel = options.shunLabel || '顺排';
  var riGan = data.ri.gan;
  var h = data.h, mi = data.mi;

  var nowYear = new Date().getFullYear();
  var curDyIdx = 0;
  for (var i = daYun.length - 1; i >= 0; i--) {
    if (daYun[i].startYear <= nowYear) { curDyIdx = i; break; }
  }

  var joy = qiYun.years, jom = qiYun.months, jod = qiYun.days;
  var qiyunText = '出生后 ' + joy + ' 年 ' + jom + ' 月 ' + jod + ' 天 ' + h + ' 小时 ' + mi + ' 分';
  var jyText = '';
  (function() {
    var y = data.y, startYear = y + joy;
    for (var j = 0; j < 20; j++) {
      var tY = startYear + j;
      if ('己甲'.indexOf(TG[(tY - 4) % 10]) >= 0) { jyText = '逢己、甲年白露后 ' + (jod + jom * 30) + ' 天'; return; }
    }
  })();

  // luck-table 三行：大运头、干支、流年
  var luckRows = [];
  luckRows.push('<div class="luck-row hd"><div class="cell rtag">大运</div>');
  // 运前列：qyYears > 0 时渲染
  if (joy > 0) {
    luckRows.push('<div class="cell pre-qy"><span class="year">运前</span><span class="age">'+joy+'岁前</span></div>');
  }
  for (var l = 0; l < daYun.length; l++) {
    var dy = daYun[l], cls = l === curDyIdx ? ' cell cc' : ' cell';
    luckRows.push('<div class="'+cls+'"><span class="year">'+dy.startYear+'</span><span class="age">'+dy.startAge+'岁</span></div>');
  }
  luckRows.push('</div>');

  luckRows.push('<div class="luck-row"><div class="cell rtag">大运</div>');
  // 运前列：--占位，无 data-dy
  if (joy > 0) {
    luckRows.push('<div class="cell pre-qy"><div class="dy-stem" style="color:var(--c-gray)">--</div><div class="dy-branch" style="color:var(--c-gray)">--</div></div>');
  }
  for (var l = 0; l < daYun.length; l++) {
    var dy = daYun[l], cls = l === curDyIdx ? ' cell cc' : ' cell';
    var ss = shiShen(riGan, dy.gan), sb = zhiShiShen(riGan, dy.zhi);
    luckRows.push('<div class="'+cls+'" data-dy="'+l+'"><div class="dy-stem '+wxClass(dy.gan)+'">'+dy.gan+'<span>'+ss.substr(0,1)+'</span></div><div class="dy-branch '+wxClass(dy.zhi)+'">'+dy.zhi+'<span>'+sb.substr(0,1)+'</span></div></div>');
  }
  luckRows.push('</div>');

  luckRows.push('<div class="luck-row liu-row"><div class="cell rtag">流年</div>');
  // 运前列：出生年至起运前一年的流年干支（无 data-di/data-li）
  if (joy > 0) {
    var preLis = '';
    for (var py = data.y; py < data.y + joy; py++) {
      var gz = liuNianJZ(py);
      preLis += '<span class="li"><span class="'+wxClass(gz[0])+'">'+gz[0]+'</span><span class="'+wxClass(gz[1])+'">'+gz[1]+'</span></span>';
    }
    luckRows.push('<div class="cell pre-qy">'+preLis+'</div>');
  }
  for (var l = 0; l < daYun.length; l++) {
    var dy = daYun[l], cls = l === curDyIdx ? ' cell cc' : ' cell';
    var lis = '';
    for (var j = 0; j < 10; j++) {
      var lnY = dy.startYear + j;
      var gz = liuNianJZ(lnY);
      var curCls = (l === curDyIdx && lnY === nowYear) ? 'li cur' : 'li';
      lis += '<span class="'+curCls+'" data-di="'+l+'" data-li="'+j+'"><span class="'+wxClass(gz[0])+'">'+gz[0]+'</span><span class="'+wxClass(gz[1])+'">'+gz[1]+'</span></span>';
    }
    luckRows.push('<div class="'+cls+'">'+lis+'</div>');
  }
  luckRows.push('</div>');

  return '<div class="bz-card-luck '+identClass+'">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">'
    + '<div class="info-row" style="margin-bottom:0;padding-bottom:0;border-bottom:none;flex:1">'
    + '<div><span class="label">起运</span>' + qiyunText + ' &nbsp; <span class="label">交运</span>' + jyText + '</div>'
    + '</div>'
    + '<button class="btn-back" onclick="scrollToNow()" title="定位今年">📍 今年</button>'
    + '</div>'
    + '<div class="luck-section" style="border:none;">'
    + '<div class="luck-table">'+luckRows.join('\n')+'</div>'
    + '</div>'
    + '</div>';
}

// ============ 入口辅助：注入当前大运/流年信息 ============
function injectCurDaYunLiuNian(data) {
  var nowYear = new Date().getFullYear();
  var daYun = data.daYun;
  if (!daYun || !daYun.length) return;
  var curDyIdx = 0;
  for (var i = daYun.length - 1; i >= 0; i--) {
    if (daYun[i].startYear <= nowYear) { curDyIdx = i; break; }
  }
  var curDy = daYun[curDyIdx];
  data.cur_da_yun = { gan: curDy.gan, zhi: curDy.zhi };
  var curLnGz = liuNianJZ(nowYear);
  data.cur_liu_nian = { gan: curLnGz[0], zhi: curLnGz[1] };
}

// ============ 入口 ============
function doPaipan() {
  const name = document.getElementById('inName').value || '未命名';
  const gender = document.getElementById('inGender').value;
  const y = parseInt(document.getElementById('inYear').value);
  const m = parseInt(calendarType === 'lunar'
    ? document.getElementById('inMonthSelect').value
    : document.getElementById('inMonth').value);
  const d = parseInt(document.getElementById('inDay').value);
  const h = parseInt(document.getElementById('inHour').value);
  const mi = parseInt(document.getElementById('inMin').value) || 0;

  if (isNaN(y) || isNaN(m) || isNaN(d) || isNaN(h)) {
    document.getElementById('output').innerHTML = '<div class="loading" style="color:var(--c-red)">请填写完整的出生时间</div>';
    return;
  }

  // v0.8.0 农历→公历转换（在真太阳时修正之前）
  var solarY = y, solarM = m, solarD = d;
  if (calendarType === 'lunar') {
    var isLeap = document.getElementById('inLeap').checked;
    var solar = lunarToSolar(y, m, d, isLeap);
    if (!solar) {
      document.getElementById('output').innerHTML = '<div class="loading" style="color:var(--c-red)">日期超出支持范围（1900-2100）</div>';
      return;
    }
    solarY = solar.y; solarM = solar.m; solarD = solar.d;
  }

  // 真太阳时修正：仅当用户勾选了真太阳时且地址已选（基于转换后的公历日期）
  let tst = null;
  const useSolar = document.getElementById('useSolar').checked;
  if (useSolar) {
    const lng = getLng();
    tst = lng !== null ? trueSolarTime(solarY, solarM, solarD, h, mi, lng) : null;
  }

  const ey = tst ? tst.y : solarY, em = tst ? tst.m : solarM, ed = tst ? tst.d : solarD, eh = tst ? tst.h : h, emi = tst ? tst.mi : mi;

  try {
    // v0.10.0 排盘前保存宫位选中状态
    var savedGongWei = selectedGongWei.slice();
    const twin = document.getElementById('inTwin').value;
    const output = document.getElementById('output');

    if (twin === '2') {
      // 龙凤胎：两次 paipan，不同 gender
      const g1 = document.getElementById('inGender').value;
      const g2 = document.getElementById('inGender2').value;
      const d1 = paipan(name, g1, ey, em, ed, eh, emi);
      d1.trueSolar = tst;
      d1.renYuan = renYuanSiLing(solarY, solarM, solarD);
      injectCurDaYunLiuNian(d1);
      const d2 = paipan(name, g2, ey, em, ed, eh, emi);
      d2.trueSolar = tst;
      d2.renYuan = renYuanSiLing(solarY, solarM, solarD);
      injectCurDaYunLiuNian(d2);
      output.innerHTML = '';
      renderLongFengCardsHtml(d1, d2, 'output');
      setCurrentBaziResult(extractBaziFromPaipan(d1));
    } else if (twin === '1') {
      const data = paipan(name, gender, ey, em, ed, eh, emi);
      data.trueSolar = tst;
      data.renYuan = renYuanSiLing(solarY, solarM, solarD);
      output.innerHTML = '';
      renderTwinCardsHtml(data, 'output');
      setCurrentBaziResult(extractBaziFromPaipan(data));
    } else {
      const data = paipan(name, gender, ey, em, ed, eh, emi);
      data.trueSolar = tst;
      data.renYuan = renYuanSiLing(solarY, solarM, solarD);
      output.innerHTML = '';
      renderChart(data);
      setCurrentBaziResult(extractBaziFromPaipan(data));
    }
    // v0.10.0 恢复宫位选中状态并重新渲染标签行
    selectedGongWei = savedGongWei;
    updateGongWeiTags();
    autoSaveArchive();
  } catch(e) {
    document.getElementById('output').innerHTML = '<div class="loading" style="color:var(--c-red)">排盘出错：' + e.message + '</div>';
    console.error(e);
  }
}

// 滚动并定位到当前大运/流年
function scrollToNow(scope) {
  scope = scope || document;
  const d = scope._paipanData || window._paipanData;
  if (!d) return;
  const nowYear = new Date().getFullYear();
  // 找当前大运索引
  let curDyIdx = 0;
  for (let i = d.daYun.length - 1; i >= 0; i--) {
    if (d.daYun[i].startYear <= nowYear) { curDyIdx = i; break; }
  }
  const curLi = nowYear - d.daYun[curDyIdx].startYear;
  // 先切高亮
  hiDy(curDyIdx, scope);
  hiLn(curDyIdx, curLi, scope);
  // 再滚动
  const sec = scope.querySelector('.luck-section');
  const cc = sec && sec.querySelector('.cc');
  if (cc && sec) {
    const sl = cc.offsetLeft - sec.offsetLeft - 40;
    sec.scrollTo({ left: Math.max(0, sl), behavior: 'smooth' });
  }
}

function migrateFromV1() {
  try {
    var oldArch = localStorage.getItem(ARCH_KEY_OLD);
    var newArch = localStorage.getItem(ARCH_KEY);
    if (oldArch && !newArch) {
      var oldData = JSON.parse(oldArch);
      if (Array.isArray(oldData) && oldData.length > 0) {
        localStorage.setItem(ARCH_BACKUP_KEY, oldArch);
        var now = new Date().toISOString();
        var migrated = oldData.map(function(a) {
          return {
            id: a.id || Date.now() + Math.random(),
            nickname: a.nickname || a.name || '',
            name: a.name || '未命名',
            gender: a.gender || '男',
            year: a.year, month: a.month, day: a.day,
            hour: a.hour || 0, min: a.min || 0,
            prov: a.prov || '', city: a.city || '', dist: a.dist || '',
            useSolar: a.useSolar || false,
            calendarType: a.calendarType || 'solar',
            isLeap: a.isLeap || false,
            lunarMonth: a.lunarMonth || null,
            bazi: null, sanyuan: null, extras: null,
            gongWeiType: null,
            createdAt: a.createdAt || now,
            updatedAt: a.updatedAt || now,
            isPreset: false
          };
        });
        localStorage.setItem(ARCH_KEY, JSON.stringify(migrated));
      }
    }
    var oldTrash = localStorage.getItem(TRASH_KEY_OLD);
    var newTrash = localStorage.getItem(TRASH_KEY);
    if (oldTrash && !newTrash) {
      localStorage.setItem(TRASH_KEY, oldTrash);
    }
  } catch(e) { console.warn('v0.9.0迁移失败:', e); }
}

// ===== v0.9.0 预置数据初始化 =====
function initPresetArchives() {
  var existing = getArchives();
  // 检测是否已存在预置数据（而非检测是否为空），避免用户已有旧档案时预置数据不写入
  var hasPreset = existing.some(function(a) { return a.isPreset === true; });
  if (!hasPreset) {
    var now = new Date().toISOString();
    var presets = PRESET_ARCHIVES.map(function(a, i) {
      return {
        id: Date.now() + i,
        nickname: a.nickname, name: a.name, gender: a.gender,
        year: a.year, month: a.month, day: a.day,
        hour: a.hour, min: a.min,
        prov: a.prov, city: a.city, dist: a.dist,
        useSolar: a.useSolar,
        calendarType: a.calendarType,
        isLeap: a.isLeap, lunarMonth: a.lunarMonth,
        bazi: null, sanyuan: null, extras: null,
        gongWeiType: null,
        createdAt: now, updatedAt: now,
        isPreset: true
      };
    });
    // 追加预置数据到现有档案（不替换用户自建档案）
    var merged = existing.concat(presets);
    saveArchivesRaw(merged);
  }
}

function setFormData(d) {
  // v0.8.0 先切换历法模式（会重建月控件），再回填值
  var calType = d.calendarType || 'solar';
  if (calType !== calendarType) {
    toggleCalendar(calType);
  }
  document.getElementById('inNickname').value = d.nickname || '';
  document.getElementById('inName').value = d.name;
  document.getElementById('inGender').value = d.gender;
  document.getElementById('inYear').value = d.year;
  if (calType === 'lunar') {
    document.getElementById('inMonthSelect').value = d.lunarMonth || d.month;
    document.getElementById('inLeap').checked = !!d.isLeap;
  } else {
    document.getElementById('inMonth').value = d.month;
  }
  document.getElementById('inDay').value = d.day;
  document.getElementById('inHour').value = d.hour;
  document.getElementById('inMin').value = d.min || 0;
  document.getElementById('useSolar').checked = d.useSolar;
  toggleSolar();

    setTimeout(() => {
      if (d.city) { document.getElementById('inCity').value = d.city; onCityChange(); }
      setTimeout(() => {
        if (d.dist) document.getElementById('inDist').value = d.dist;
      }, 50);
    }, 50);

}

function autoSaveArchive() {

  var archives = getArchives();
  var ts = new Date().toISOString();
  // 附加当前排盘计算结果

  d.sanyuan = baziData.sanyuan;
  d.extras = baziData.extras;
  d.gongWeiType = baziData.gongWeiType;
  var existIdx = archives.findIndex(function(a) { return a.name === d.name && a.gender === d.gender; });
  if (existIdx >= 0) {
    archives[existIdx] = Object.assign({}, archives[existIdx], d, {updatedAt: ts});
  } else {
    archives.push(Object.assign({}, d, {id: Date.now(), createdAt: ts, updatedAt: ts, isPreset: false}));
  }
  saveArchives(archives);
  refreshArchiveModalIfOpen();
  refreshArchiveModalIfOpen();
}

function saveArchive() {
  var d = getFormData();
  if (!d.name) { alert('请填写姓名'); return; }
  var archives = getArchives();
  var ts = new Date().toISOString();
  // 附加当前排盘计算结果
  var baziData = getCurrentBaziResult();

  d.sanyuan = baziData.sanyuan;
  d.extras = baziData.extras;

// ---- 回收站 ----
function showTrash() {
  renderTrash();
  document.getElementById('trashOverlay').classList.add('show');
}

function hideTrash() {
  document.getElementById('trashOverlay').classList.remove('show');
}

function renderTrash() {
  const list = document.getElementById('trashList');
  const trash = getTrash();
  if (!trash.length) {
    list.innerHTML = '<div style="color:var(--c-gray);text-align:center;padding:20px;">回收站为空</div>';
    return;
  }
  list.innerHTML = trash.map((a, i) => {
    const solar = a.useSolar ? '☀' : '';
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-bottom:1px solid rgba(128,128,128,.15);">
      <span>${a.name} ${a.gender === '男' ? '♂' : '♀'} ${a.year}/${a.month}/${a.day} ${a.hour}:${String(a.min||0).padStart(2,'0')} ${solar}</span>
      <button class="btn-arch" onclick="restoreFromTrash(${i})" title="恢复">↩️</button>
    </div>`;
  }).join('');
}

function restoreFromTrash(idx) {
  const trash = getTrash();
  if (!trash[idx]) return;
  const item = trash[idx];
  const { deletedAt, ...arch } = item;
  const archives = getArchives();
  const existIdx = archives.findIndex(a => a.name === arch.name && a.gender === arch.gender);
  if (existIdx >= 0) {
    if (!confirm('「' + arch.name + '」已存在，覆盖恢复？')) return;
    archives[existIdx] = { ...arch, updatedAt: new Date().toISOString() };
  } else {
    archives.push({ ...arch, updatedAt: new Date().toISOString() });
  }
  saveArchives(archives);
  trash.splice(idx, 1);
  saveTrash(trash);
  refreshArchiveModalIfOpen();
  renderTrash();
}

function emptyTrash() {
  const trash = getTrash();
  if (!trash.length) return;
  if (!confirm('确定清空回收站？此操作不可恢复。')) return;
  saveTrash([]);
  hideTrash();
}

// 从档案数据构建 renderChart 所需的完整 paipan 数据对象
function buildChartDataFromArchive(arch) {
  // 若 bazi 为空，先计算
  if (!arch.bazi) {
    var p = paipan(arch.name, arch.gender, arch.year, arch.month, arch.day, arch.hour, arch.min || 0);
    arch.bazi = {
      nian: { gan: p.nian.gan, zhi: p.nian.zhi },
      yue:  { gan: p.yue.gan, zhi: p.yue.zhi },
      ri:   { gan: p.ri.gan, zhi: p.ri.zhi },
      shi:  { gan: p.shi.gan, zhi: p.shi.zhi }
    };
    arch.sanyuan = {
      tai:  { gan: p.tai.gan, zhi: p.tai.zhi },
      ming: { gan: p.ming.gan, zhi: p.ming.zhi },
      shen: { gan: p.shen.gan, zhi: p.shen.zhi }
    };
    arch.extras = {
      shengXiao: p.shengXiao,
      qiYun: { year: p.qiYun.years, month: p.qiYun.months, day: p.qiYun.days, hour: p.qiYun.hours, shun: p.qiYun.shun },
      daYun: p.daYun.map(function(dy) { return { gan: dy.gan, zhi: dy.zhi, startAge: dy.startAge, endAge: dy.endAge, startYear: dy.startYear }; })
    };
    // Save back to localStorage
    saveArchives(getArchives());
  }
  // Rebuild paipan-style data object
  var p = paipan(arch.name, arch.gender, arch.year, arch.month, arch.day, arch.hour, arch.min || 0);
  // Ensure bazi fields match (paipan recalculates, but we want consistent results)
  p.nian.gan = arch.bazi.nian.gan; p.nian.zhi = arch.bazi.nian.zhi;
  p.yue.gan = arch.bazi.yue.gan; p.yue.zhi = arch.bazi.yue.zhi;
  p.ri.gan = arch.bazi.ri.gan; p.ri.zhi = arch.bazi.ri.zhi;
  p.shi.gan = arch.bazi.shi.gan; p.shi.zhi = arch.bazi.shi.zhi;
  p.tai.gan = arch.sanyuan.tai.gan; p.tai.zhi = arch.sanyuan.tai.zhi;
  p.ming.gan = arch.sanyuan.ming.gan; p.ming.zhi = arch.sanyuan.ming.zhi;
  p.shen.gan = arch.sanyuan.shen.gan; p.shen.zhi = arch.sanyuan.shen.zhi;
  return p;
}

// 在卡片展开区渲染排盘（复用 renderChart，输出到临时容器）
function renderExpandedChart(arch, containerEl) {

  var tmpId = 'archive-expanded-tmp';

  var tmp = document.createElement('div');
  tmp.id = tmpId;
  tmp.style.display = 'none';
  document.body.appendChild(tmp);
  // Temporarily set output to tmp
  var origOutput = document.getElementById('output');
  tmp.innerHTML = '<div id="output"></div>';

}

// 生成只读排盘HTML（精简版，四柱+三垣）
function renderChartToHtml(data, arch) {
  var riGan = data.ri.gan, riZhi = data.ri.zhi;
  function pillar(gan, zhi) {
    return {
      gan: gan, zhi: zhi,

      rs: shiShen(riGan, gan),
      ny: NAYIN[gan + zhi] || '',

      kw: gan + zhi === riGan + riZhi ? kongWang(riGan, riZhi) : kongWang(gan, zhi),
      cg: cangGanText(zhi, riGan, 1),
      sh: gan + zhi === riGan + riZhi ? shenSha(riGan, riZhi, data.nian.zhi, data.yue.zhi) : ''

  rows.push('<tr class="rg">' + rl('') + td(pNian.wg,pNian.gan) + td(pYue.wg,pYue.gan) + td(pRi.wg,pRi.gan) + td(pShi.wg,pShi.gan) + emp() + td(pTai.wg,pTai.gan) + td(pMing.wg,pMing.gan) + td(pShen.wg,pShen.gan) + '</tr>');
  // 地支
  rows.push('<tr class="rg">' + rl('') + td(pNian.wz,pNian.zhi) + td(pYue.wz,pYue.zhi) + td(pRi.wz,pRi.zhi) + td(pShi.wz,pShi.zhi) + emp() + td(pTai.wz,pTai.zhi) + td(pMing.wz,pMing.zhi) + td(pShen.wz,pShen.zhi) + '</tr>');
  // 藏气
  rows.push('<tr class="rh">' + rl('藏气') + td('',pNian.cg) + td('',pYue.cg) + td('',pRi.cg) + td('',pShi.cg) + emp() + td('',pTai.cg) + td('',pMing.cg) + td('',pShen.cg) + '</tr>');
  // 纳音
  rows.push('<tr class="rn">' + rl('纳音') + td('',pNian.ny) + td('',pYue.ny) + td('',pRi.ny) + td('',pShi.ny) + emp() + td('',pTai.ny) + td('',pMing.ny) + td('',pShen.ny) + '</tr>');
  // 星运
  rows.push('<tr class="rm">' + rl('星运') + td('',pNian.xy) + td('',pYue.xy) + td('',pRi.xy) + td('',pShi.xy) + emp() + td('',pTai.xy) + td('',pMing.xy) + td('',pShen.xy) + '</tr>');
  // 自坐

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function openArchivePanel() {
  renderArchiveModal();
  document.getElementById('archiveOverlay').classList.add('show');
  document.getElementById('archive-search-modal').value = '';
  setTimeout(function() { document.getElementById('archive-search-modal').focus(); }, 100);
}

function closeArchivePanel() {
  document.getElementById('archiveOverlay').classList.remove('show');
}

function renderArchiveModal() {
  var listEl = document.getElementById('archive-modal-list');
  var archives = getArchives();
  if (!listEl) return;

  if (archives.length === 0) {
    listEl.innerHTML = '<div class="archive-modal-empty">暂无档案，排盘后自动保存</div>';
    return;
  }

  // Sort by updatedAt desc
  archives.sort(function(a, b) {
    return (b.updatedAt || '').localeCompare(a.updatedAt || '');
  });
  saveArchives(archives);

  var html = '';
  for (var i = 0; i < archives.length; i++) {
    var a = archives[i];
    var genderIcon = a.gender === '男' ? '♂' : '♀';
    var genderCls = a.gender === '男' ? 'male' : 'female';
    var displayName = (a.nickname || '') ? (a.nickname + ' / ' + a.name) : a.name;
    var dateStr = a.year + '年' + a.month + '月' + a.day + '日 ' + pad(a.hour) + ':' + pad(a.min || 0);
    html += '<div class="archive-modal-row">'
      + '<div class="archive-row-info">'
      + '<span class="archive-row-name">' + escHtml(displayName) + '</span>'
      + '<span class="archive-row-gender ' + genderCls + '">' + genderIcon + '</span>'
      + '<span class="archive-row-date">' + escHtml(dateStr) + '</span>'
      + '</div>'
      + '<button class="archive-row-btn" onclick="loadFromArchive(' + i + ')">排盘</button>'
      + '</div>';
  }
  listEl.innerHTML = html;
}

// P1：搜索防抖 150ms，减少输入过程中的中间态渲染
var _filterTimer = null;
function onArchiveSearch(val) {
  clearTimeout(_filterTimer);
  _filterTimer = setTimeout(function() { filterArchives(val); }, 150);
}

function filterArchives(keyword) {
  var k = (keyword || '').trim().toLowerCase();
  var archives = getArchives();
  var listEl = document.getElementById('archive-modal-list');
  if (!listEl) return;

  if (!k) {
    renderArchiveModal();
    return;
  }

  var filtered = [];
  for (var i = 0; i < archives.length; i++) {
    var a = archives[i];
    var match = (a.nickname || '').toLowerCase().indexOf(k) >= 0
      || (a.name || '').toLowerCase().indexOf(k) >= 0;
    if (match) filtered.push({arch: a, idx: i});
  }

  if (filtered.length === 0) {
    listEl.innerHTML = '<div class="archive-modal-empty">未找到匹配档案</div>';
    return;
  }

  var html = '';
  for (var j = 0; j < filtered.length; j++) {
    var a = filtered[j].arch;

      + '<div class="archive-row-info">'
      + '<span class="archive-row-name">' + escHtml(displayName) + '</span>'
      + '<span class="archive-row-gender ' + genderCls + '">' + genderIcon + '</span>'
      + '<span class="archive-row-date">' + escHtml(dateStr) + '</span>'

      + '<button class="archive-row-btn" onclick="loadFromArchive(' + idx + ')">排盘</button>'

function loadFromArchive(idx) {
  var archives = getArchives();

// 时间修饰词→小时偏移
const TIME_MOD = {
  '凌晨':0, '半夜':0, '早晨':0, '早上':0, '上午':0,
  '中午':12, '下午':12, '傍晚':12, '黄昏':12, '晚上':12, '夜里':12
};

function parseNaturalInput(text) {
  const result = { name:'', gender:'男', year:null, month:null, day:null, hour:null, min:0, prov:'', city:'', dist:'' };
  let t = text.trim();
  if (!t) return result;

  // 1. 提取性别
  const genderM = t.match(/[男女]/);
  if (genderM) { result.gender = genderM[0]; t = t.replace(genderM[0], ' '); }

  // 2. 提取日期 — 中文格式
  const dateCN = t.match(/(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]/);
  if (dateCN) {
    result.year = parseInt(dateCN[1]);
    result.month = parseInt(dateCN[2]);
    result.day = parseInt(dateCN[3]);
    t = t.replace(dateCN[0], ' ');
  }
  // 数字格式 1982-10-18 / 1982.10.18 / 1982/10/18
  if (!result.year) {
    const dateNum = t.match(/(\d{4})\s*[-./]\s*(\d{1,2})\s*[-./]\s*(\d{1,2})/);
    if (dateNum) {
      result.year = parseInt(dateNum[1]);
      result.month = parseInt(dateNum[2]);
      result.day = parseInt(dateNum[3]);
      t = t.replace(dateNum[0], ' ');
    }
  }

  // 3. 提取时间
  // 先匹配带修饰词的：早上5点、下午3点、晚上8点01分
  const timeMod = t.match(/(凌晨|半夜|早晨|早上|上午|中午|下午|傍晚|黄昏|晚上|夜里)\s*(\d{1,2})\s*[点时:：]\s*(\d{1,2})?\s*[分]?/);
  if (timeMod) {
    let h = parseInt(timeMod[2]);
    const m = timeMod[3] ? parseInt(timeMod[3]) : 0;
    const mod = TIME_MOD[timeMod[1]];
    if (mod === 12) {
      if (h < 12) h += 12;
      if (h === 12 && timeMod[1] === '中午') h = 12;
    }
    result.hour = h;
    result.min = m;
    t = t.replace(timeMod[0], ' ');
  }
  // 纯数字时间 5:01 / 05:01 / 5时01分
  if (result.hour === null) {
    const timeNum = t.match(/(\d{1,2})\s*[:：时点]\s*(\d{1,2})?\s*[分]?/);
    if (timeNum) {
      result.hour = parseInt(timeNum[1]);
      result.min = timeNum[2] ? parseInt(timeNum[2]) : 0;
      t = t.replace(timeNum[0], ' ');
    }
  }
  // 只有小时：5点
  if (result.hour === null) {
    const hourOnly = t.match(/(\d{1,2})\s*点/);
    if (hourOnly) {
      result.hour = parseInt(hourOnly[1]);
      result.min = 0;
      t = t.replace(hourOnly[0], ' ');
    }
  }

  // 4. 提取地址
  const provList = Object.keys(LOC_DATA);
  // 按长度降序匹配，防止"广西"匹配到"广西省"
  const sortedProv = [...provList].sort((a,b) => b.length - a.length);
  for (const p of sortedProv) {
    if (t.includes(p)) {
      result.prov = p;
      t = t.replace(p, ' ');
      // 提取城市
      const cities = Object.keys(LOC_DATA[p].cities);
      const sortedCities = [...cities].sort((a,b) => b.length - a.length);
      for (const c of sortedCities) {
        const shortC = c.replace(/[市县区]$/, '');
        if (t.includes(c) || t.includes(shortC)) {
          result.city = c;
          t = t.replace(c, ' ').replace(shortC, ' ');
          // 提取区县
          const dists = LOC_DATA[p].cities[c]?.dist || [];
          for (const d of dists) {
            if (t.includes(d)) { result.dist = d; t = t.replace(d, ' '); break; }
          }
          break;
        }
      }
      break;
    }
  }

  // 5. 提取姓名 — 剩余文本中取2-4个连续汉字
  const nameM = t.match(/[\u4e00-\u9fa5]{2,4}/);
  if (nameM) result.name = nameM[0];

  return result;
}

function doAiParse() {
  const text = document.getElementById('aiInput').value.trim();
  if (!text) return;
  const r = parseNaturalInput(text);
  
  // 构建预览
  let preview = '';
  if (r.name) preview += '姓名：' + r.name + '  ';
  preview += '性别：' + r.gender + '  ';
  if (r.year) preview += r.year + '年' + r.month + '月' + r.day + '日  ';
  if (r.hour !== null) preview += r.hour + ':' + String(r.min).padStart(2,'0') + '  ';
  if (r.prov) preview += r.prov + (r.city||'') + (r.dist||'');
  
  if (!r.year) {
    document.getElementById('aiPreview').textContent = '⚠ 未能识别完整日期，请补充';
    return;
  }

  document.getElementById('aiPreview').textContent = '✅ 识别：' + preview;

  // 填表
  if (r.name) document.getElementById('inName').value = r.name;
  document.getElementById('inGender').value = r.gender;
  document.getElementById('inYear').value = r.year;
  document.getElementById('inMonth').value = r.month;
  document.getElementById('inDay').value = r.day;
  if (r.hour !== null) document.getElementById('inHour').value = r.hour;
  document.getElementById('inMin').value = r.min;
  
  // 地址
  if (r.prov) {
    document.getElementById('useSolar').checked = true;
    toggleSolar();
    document.getElementById('inProv').value = r.prov;
    onProvChange();
    setTimeout(() => {
      if (r.city) { document.getElementById('inCity').value = r.city; onCityChange(); }
      setTimeout(() => {
        if (r.dist) document.getElementById('inDist').value = r.dist;
        hideAiInput();
        doPaipan();
      }, 100);
    }, 100);
  } else {
    document.getElementById('useSolar').checked = false;
    toggleSolar();
    hideAiInput();
    doPaipan();
  }
}
