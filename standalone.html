  // 藏气: 单行合并（用 cg 而非 ly），删中气余气
  mainRows[3] = '<tr class="rh" data-row-type="ln2">'+rl('藏气')+td('',pNian.cg)+td('',pYue.cg)+td('',pRi.cg)+td('',pShi.cg)+td('sep col-dy',pDy.cg)+td('col-ln',pLn.cg)+'</tr>';
  mainRows.splice(4, 2); // 删中气、余气 — 单人排盘只保留合并藏气行
  // 纳音 — splice 后索引从 6 偏移至 4
  mainRows[4] = '<tr class="rn" data-row-type="nayin dy3">'+rl('纳音')+td('',pNian.ny)+td('',pYue.ny)+td('',pRi.ny)+td('',pShi.ny)+td('sep col-dy',pDy.ny)+td('col-ln',pLn.ny)+'</tr>';
  // 纳运 ← v0.17.0 从自坐下移至纳音下
  mainRows[5] = '<tr class="rm" data-row-type="nayun dy4">'+rl('纳运')+td('',pNian.nayun)+td('',pYue.nayun)+td('',pRi.nayun)+td('',pShi.nayun)+td('sep col-dy',pDy.nayun)+td('col-ln',pLn.nayun)+'</tr>';
  // 星运
  mainRows[6] = '<tr class="rm" data-row-type="xingyun ln3">'+rl('星运')+td('',pNian.xy)+td('',pYue.xy)+td('',pRi.xy)+td('',pShi.xy)+td('sep col-dy',pDy.xy)+td('col-ln',pLn.xy)+'</tr>';
  // 自坐 ← v0.17.0 dy4→dy5
  mainRows[7] = '<tr class="rm" data-row-type="zizuo dy5">'+rl('自坐')+td('',pNian.zz)+td('',pYue.zz)+td('',pRi.zz)+td('',pShi.zz)+td('sep col-dy',pDy.zz)+td('col-ln',pLn.zz)+'</tr>';
  // 空亡
  mainRows[8] = '<tr class="rm" data-row-type="kongwang ln4">'+rl('空亡')+td('',pNian.kw)+td('',pYue.kw)+td('',pRi.kw)+td('',pShi.kw)+td('sep col-dy',pDy.kw)+td('col-ln',pLn.kw)+'</tr>';
  // 神煞
  mainRows[9] = '<tr class="rm" data-row-type="shensha dy6">'+rl('神煞')+td('',pNian.sh)+td('',pYue.sh)+td('',pRi.sh)+td('',pShi.sh)+td('sep col-dy',pDy.sh)+td('col-ln',pLn.sh)+'</tr>';
  // 其他行（藏干4,5 等）使用 buildPillarRows 的 + suffix
  for (var fixI = 0; fixI < mainRows.length; fixI++) {
    if (mainRows[fixI] && mainRows[fixI].indexOf('sep col-dy') === -1) {
      mainRows[fixI] = insSuffix(mainRows[fixI], suffixMain);
    }
  }
  chartRows.push.apply(chartRows, mainRows);

  // 四柱-三垣分隔行
  chartRows.push('<tr class="sanyuan-sep"><td colspan="7"></td></tr>');

  // 三垣行
  var syRows = [];
  // v0.10.0 三垣宫位标签行由 updateGongWeiTags() 动态生成
  syRows.push('<tr class="hd">'+th('rl','三垣')+emp('')+th('','胎元')+th('','命宫')+th('','身宫')+emp('sep')+emp('col-ln')+'</tr>');
  // 用原始 data 生成三垣（不依赖 buildPillarRows 的 level-based 结构）
  syRows.push('<tr class="rs">'+rl('主星')+emp('')+td('',pTai.rs)+td('',pMing.rs)+td('',pShen.rs)+emp('sep')+emp('col-ln')+'</tr>');
  syRows.push('<tr class="rg">'+rl('')+emp('')+td(pTai.wg,pTai.gan)+td(pMing.wg,pMing.gan)+td(pShen.wg,pShen.gan)+emp('sep')+emp('col-ln')+'</tr>');
  syRows.push('<tr class="rg">'+rl('')+emp('')+td(pTai.wz,pTai.zhi)+td(pMing.wz,pMing.zhi)+td(pShen.wz,pShen.zhi)+emp('sep')+emp('col-ln')+'</tr>');
  syRows.push('<tr class="rh">'+rl('藏气')+emp('')+td('',pTai.cg)+td('',pMing.cg)+td('',pShen.cg)+emp('sep')+emp('col-ln')+'</tr>');
  syRows.push('<tr class="rn" data-row-type="nayin">'+rl('纳音')+emp('')+td('',pTai.ny)+td('',pMing.ny)+td('',pShen.ny)+emp('sep')+emp('col-ln')+'</tr>');
  syRows.push('<tr class="rm" data-row-type="nayun">'+rl('纳运')+emp('')+td('',pTai.nayun)+td('',pMing.nayun)+td('',pShen.nayun)+emp('sep')+emp('col-ln')+'</tr>');
  syRows.push('<tr class="rm" data-row-type="xingyun">'+rl('星运')+emp('')+td('',pTai.xy)+td('',pMing.xy)+td('',pShen.xy)+emp('sep')+emp('col-ln')+'</tr>');
  syRows.push('<tr class="rm" data-row-type="zizuo">'+rl('自坐')+emp('')+td('',pTai.zz)+td('',pMing.zz)+td('',pShen.zz)+emp('sep')+emp('col-ln')+'</tr>');
  syRows.push('<tr class="rm" data-row-type="kongwang">'+rl('空亡')+emp('')+td('',pTai.kw)+td('',pMing.kw)+td('',pShen.kw)+emp('sep')+emp('col-ln')+'</tr>');
  syRows.push('<tr class="rm" data-row-type="shensha">'+rl('神煞')+emp('')+td('',pTai.sh)+td('',pMing.sh)+td('',pShen.sh)+emp('sep')+emp('col-ln')+'</tr>');
  chartRows.push.apply(chartRows, syRows);

  // ---- 大运流年表 HTML ----
  const luckRows = [];

  // 表头：年份/岁数
  luckRows.push('<div class="luck-row hd"><div class="cell rtag">大运</div>');
  // 运前列：qyYears > 0 时渲染
  if (preQyYears > 0) {
    luckRows.push('<div class="cell pre-qy"><span class="year">'+y+'</span><span class="age">1岁</span></div>');
  }
  for (let i = 0; i < daYun.length; i++) {
    const dy = daYun[i];
    const cls = i === curDyIdx ? ' cell cc' : ' cell';
    luckRows.push('<div class="'+cls+'"><span class="year">'+dy.startYear+'</span><span class="age">'+dy.startAge+'岁</span></div>');
  }
  luckRows.push('</div>');

  // 大运干支
  luckRows.push('<div class="luck-row"><div class="cell rtag">大运</div>');
  // 运前列：「运/前」，无 data-dy
  if (preQyYears > 0) {
    luckRows.push('<div class="cell pre-qy"><div class="dy-stem" style="color:var(--c-gray)">运</div><div class="dy-branch" style="color:var(--c-gray)">前</div></div>');
  }
  for (let i = 0; i < daYun.length; i++) {
    const dy = daYun[i];
    const ss = shiShen(riGan, dy.gan), sb = zhiShiShen(riGan, dy.zhi);
    const cls = i === curDyIdx ? ' cell cc' : ' cell';
    luckRows.push('<div class="'+cls+'" data-dy="'+i+'"><div class="dy-stem '+wxClass(dy.gan)+'">'+dy.gan+'<span>'+ss.substr(0,1)+'</span></div><div class="dy-branch '+wxClass(dy.zhi)+'">'+dy.zhi+'<span>'+sb.substr(0,1)+'</span></div></div>');
  }
  luckRows.push('</div>');

  // 始于
  luckRows.push('<div class="luck-row start-row"><div class="cell rtag">始于</div>');
  if (preQyYears > 0) {
    luckRows.push('<div class="cell pre-qy">'+y+'</div>');
  }
  for (let i = 0; i < daYun.length; i++) {
    luckRows.push('<div class="cell'+(i===curDyIdx?' cc':'')+'">'+daYun[i].startYear+'</div>');
  }
  luckRows.push('</div>');

  // 流年
  luckRows.push('<div class="luck-row liu-row"><div class="cell rtag">流年</div>');
  // 运前列：出生年至起运前一年的流年干支
  if (preQyYears > 0) {
    let preLis = '';
    for (let py = y, liIdx = 0; py < y + preQyYears; py++, liIdx++) {
      const gz = liuNianJZ(py);
      const gzCol = '<span class="'+wxClass(gz[0])+'">'+gz[0]+'</span><span class="'+wxClass(gz[1])+'">'+gz[1]+'</span>';
      preLis += '<span class="li" data-di="-1" data-li="'+liIdx+'">'+gzCol+'</span>';
    }
    luckRows.push('<div class="cell pre-qy">'+preLis+'</div>');
  }
  for (let i = 0; i < daYun.length; i++) {
    const dy = daYun[i];
    const cls = i === curDyIdx ? ' cell cc' : ' cell';
    let lis = '';
    for (let j = 0; j < 10; j++) {
      const lnY = dy.startYear + j;
      const gz = liuNianJZ(lnY);
      const gzCol = '<span class="'+wxClass(gz[0])+'">'+gz[0]+'</span><span class="'+wxClass(gz[1])+'">'+gz[1]+'</span>';
      const curCls = (i === curDyIdx && lnY === nowYear) ? 'li cur' : 'li';
      lis += '<span class="'+curCls+'" data-di="'+i+'" data-li="'+j+'">'+gzCol+'</span>';
    }
    luckRows.push('<div class="'+cls+'">'+lis+'</div>');
  }
  luckRows.push('</div>');

  // 止于
  luckRows.push('<div class="luck-row end-row"><div class="cell rtag">止于</div>');
  if (preQyYears > 0) {
    luckRows.push('<div class="cell pre-qy">'+(y + preQyYears - 1)+'</div>');
  }
  for (let i = 0; i < daYun.length; i++) {
    luckRows.push('<div class="cell'+(i===curDyIdx?' cc':'')+'">'+(daYun[i].startYear + 9)+'</div>');
  }
  luckRows.push('</div>');

  // ---- 额外信息标签 ----
  let tstTag = '', ryTag = '';
  if (data.trueSolar) {
    tstTag = '<span class="meta-tag true-solar">☀ 真太阳时 ' + pad(data.trueSolar.h)+':'+pad(data.trueSolar.mi)+' ('+(data.trueSolar.offsetMin>=0?'+':'')+Math.round(data.trueSolar.offsetMin)+'分)</span>';
  }
  if (renYuan) {
    ryTag = '<span class="meta-tag">'+renYuan+'</span>';
  }

  // ---- 组装完整 HTML ----
  const nowYearCn = '（当前 ' + nowYear + ' 年）';
  const shunLabel = data.qiYun ? buildShunLabel(data.qiYun.shun, data.gender, data.nian.gan) : '';
  const html = `
    <div class="top-bar">
      <div class="person-info"><b>${data.displayName || data.name}</b><span class="sex-tag">${gender === '男' ? '乾造' : '坤造'}</span><span class="meta">${gender} · ${y}年${m}月${d}日 ${pad(h)}:${pad(mi)}</span>${tstTag}${ryTag}${shunLabel}</div>
      <div style="display:flex;align-items:baseline;gap:8px;"><button class="btn-simple active" onclick="RENDER.toggleLevel()" title="简分级别：仅四柱干支骨架（点击展开）">极简</button>${renderGongWeiPanel()}<div class="person-info meta">${nian.gan}${nian.zhi}年生 · 属${shengXiao} ${nowYearCn}</div></div>
    </div>

    <div class="body-cols">
      <div class="main-col">
        <div class="chart-wrap">
        <table class="chart level-0">${chartRows.join('\n')}</table>
        </div>
      </div>

      <div class="luck-col">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <div class="info-row" style="margin-bottom:0;padding-bottom:0;border-bottom:none;flex:1">
            <div><span class="label">起运</span>${qiyunText} &nbsp; <span class="label">交运</span>${jyText}</div>
          </div>
          <button class="btn-back" onclick="RENDER.scrollToNow()" title="定位今年">📍 今年</button>
        </div>
        <div class="luck-section">
          <div class="luck-table">${luckRows.join('\n')}</div>
        </div>
      </div>
    </div>`;

  // 存储数据用于交互
  const container = typeof targetId === 'string' ? document.getElementById(targetId) : targetId;
  container.innerHTML = html;
  container._paipanData = data;
  if (targetId === 'output' || (typeof targetId === 'object' && targetId.id === 'output')) {
    window._paipanData = data;
  }
  window._getSolarTerm = getSolarTerm;

  // 绑定交互
  container._paipanData = data;
  bindEvents(data, container);
}

function bindEvents(data, container) {
  const { daYun, ri, y } = data;
  const riGan = ri.gan;
  container = container || document;

  // 大运点击
  container.querySelectorAll('[data-dy]').forEach(c => {
    c.addEventListener('click', () => {
      const i = parseInt(c.dataset.dy);
      var cardEl = c.closest('.bz-twin-card');
      // 龙凤胎: 大运行在 .bz-card-luck 中, 按 data-card-index 找对应卡片
      if (!cardEl) {
        var luckScope2 = c.closest('.bz-card-luck');
        if (luckScope2) {
          var cardIdx2 = parseInt(luckScope2.dataset.cardIndex);
          if (!isNaN(cardIdx2)) {
            var allCards2 = container.querySelectorAll('.bz-twin-card');
            cardEl = allCards2[cardIdx2];
          }
        }
      }
      var daYunSrc = (cardEl && cardEl._cardData) ? cardEl._cardData.daYun : daYun;
      const dy = daYunSrc[i];
      var scope = c.closest('.bz-card-luck') || container;
      hiDy(i, scope);
      hiLn(i, 0, scope);
      updateCardDyLnColumns(container, cardEl || c, i, 0);
      setTimeout(function(){ redrawZuHeSVG(cardEl || container); }, 80);
    });
  });

  // 流年点击
  container.querySelectorAll('.liu-row .li').forEach(li => {
    li.addEventListener('click', e => {
      e.stopPropagation();
      const di = parseInt(li.dataset.di);
      const liIdx = parseInt(li.dataset.li);
      var cardEl2 = li.closest('.bz-twin-card');
      // 龙凤胎: 流年在 .bz-card-luck 中, 按 data-card-index 找对应卡片
      if (!cardEl2) {
        var luckScope = li.closest('.bz-card-luck');
        if (luckScope) {
          var cardIdx = parseInt(luckScope.dataset.cardIndex);
          if (!isNaN(cardIdx)) {
            var allCards = container.querySelectorAll('.bz-twin-card');
            cardEl2 = allCards[cardIdx];
          }
        }
      }
      var daYunSrc2 = (cardEl2 && cardEl2._cardData) ? cardEl2._cardData.daYun : daYun;
      var scope2 = li.closest('.bz-card-luck') || container;
      // 运前流年(di=-1): 只高亮流年, 不高亮大运列
      if (di === -1) {
        hiLn(-1, liIdx, scope2);
      } else {
        hiDy(di, scope2); hiLn(di, liIdx, scope2);
      }
      // 龙凤胎: 传递卡片元素确保只更新对应卡片的图表列
      updateCardDyLnColumns(container, cardEl2 || li, di, liIdx);
      setTimeout(function(){ redrawZuHeSVG(cardEl2 || container); }, 80);
    });
  });
}

function hiDy(i, scope) {
  scope.querySelectorAll('.luck-table').forEach(function(table) {
    table.querySelectorAll('[data-dy]').forEach(c => c.classList.remove('cc'));
    const t = table.querySelector('[data-dy="'+i+'"]');
    if (t) t.classList.add('cc');
    // 检测运前列是否存在（qyYears=0时不渲染），动态决定偏移量
    const hasPreQy = table.querySelector('.luck-row.hd .cell.pre-qy') !== null;
    const off = hasPreQy ? 2 : 1;
    // 高亮年龄头行
    const hd = table.querySelectorAll('.luck-row.hd .cell');
    hd.forEach(c => c.classList.remove('cc'));
    if (hd[i + off]) hd[i + off].classList.add('cc');
    // 高亮流年列
    const lc = table.querySelectorAll('.liu-row .cell');
    lc.forEach(c => c.classList.remove('cc'));
    if (lc[i + off]) lc[i + off].classList.add('cc');
    // 高亮始于行
    const sr = table.querySelectorAll('.start-row .cell');
    sr.forEach(c => c.classList.remove('cc'));
    if (sr[i + off]) sr[i + off].classList.add('cc');
    // 高亮止于行
    const er = table.querySelectorAll('.end-row .cell');
    er.forEach(c => c.classList.remove('cc'));
    if (er[i + off]) er[i + off].classList.add('cc');
  });
}

function hiLn(di, li, scope) {
  scope.querySelectorAll('.luck-table').forEach(function(table) {
    table.querySelectorAll('.liu-row .li').forEach(c => c.classList.remove('cur'));
    // 检测运前列是否存在（qyYears=0时不渲染），动态决定偏移量
    const hasPreQy = table.querySelector('.liu-row .cell.pre-qy') !== null;
    const off = hasPreQy ? 2 : 1;
    const cells = table.querySelectorAll('.liu-row .cell');
    const col = cells[di + off];
    if (col) {
      const lis = col.querySelectorAll('.li');
      if (lis[li]) lis[li].classList.add('cur');
    }
  });
}

// ============ v0.6.7 卡片大运流年列互动更新 ============
// 点击流年时同步更新卡片图表中的大运/流年列
function updateCardDyLnColumns(container, clickedEl, dyIdx, lnIdx) {
  // 确定用哪个卡的数据：从点击元素向上找 .bz-twin-card
  var card = clickedEl.closest('.bz-twin-card');
  var cardData;
  if (card && card._cardData) {
    cardData = card._cardData;
  } else {
    cardData = container._paipanData;
  }
  if (!cardData || !cardData.daYun) return;
  var daYun = cardData.daYun;
  var riGan = cardData.ri.gan, riZhi = cardData.ri.zhi;
  var nianZhi = cardData.nian.zhi, yueZhi = cardData.yue.zhi;

  function pill(gan, zhi) {
    var cgLayers = cangGanLayers(zhi, riGan, 1, 'dayun');
    return {
      rs: shiShen(riGan, gan),
      wg: wxClass(gan), wz: wxClass(zhi),
      gan: gan, zhi: zhi,
      ny: NAYIN[gan + zhi] || '',
      xy: changSheng(riGan, zhi),
      zz: changSheng(gan, zhi),
      kw: gan + zhi === riGan + riZhi ? kongWang(riGan, riZhi) : kongWang(gan, zhi),
      ly: cgLayers,
      cg: cangGanText(zhi, riGan, 1, 'dayun'),
      sh: gan + zhi === riGan + riZhi ? shenSha(riGan, riZhi, nianZhi, yueZhi) : ''
    };
  }

  // 空大运对象（运前流年无对应大运时使用）
  function emptyPill() {
    return { rs:'', wg:'', wz:'', gan:'', zhi:'', ny:'', xy:'', zz:'', kw:'', ly:[], cg:'', sh:'', nayun:'' };
  }

  var pDy, pLn;
  if (dyIdx === -1) {
    // 运前流年(di=-1): 无对应大运，通过出生年+偏移计算流年
    var lnYear = cardData.y + lnIdx;
    var lnGz = liuNianJZ(lnYear);
    pDy = pill(cardData.yue.gan, cardData.yue.zhi);
    pLn = pill(lnGz[0], lnGz[1]);
  } else {
    var dy = daYun[dyIdx];
    if (!dy) return;
    var lnYear = dy.startYear + lnIdx;
    var lnGz = liuNianJZ(lnYear);
    pDy = pill(dy.gan, dy.zhi);
    pLn = pill(lnGz[0], lnGz[1]);
  }

  // 更新目标卡片：如果点击来自具体卡片，只更新该卡片；否则更新所有卡片
  var cards = card ? [card] : Array.from(container.querySelectorAll('.bz-twin-card'));

  // v0.6.6: 单人模式回退 —— 无 .bz-twin-card 时直接更新主 chart 表格
  if (cards.length === 0) {
    var mainChart = container.querySelector('table.chart');
    if (mainChart) _applyDLUpdates(mainChart, pDy, pLn, true);
    return;
  }

  cards.forEach(function(c) {
    var ct = c.querySelector('.chart-wrap table.chart');
    if (ct) _applyDLUpdates(ct, pDy, pLn, false);
  });
}



// ============ v0.6.6 通用大运/流年列更新函数 ============
// 双模式行映射：isSingle=true → 9行（藏气合并），isSingle=false → 11行（藏干分层）
function _applyDLUpdates(tableEl, pDy, pLn, isSingle) {
  // v0.10.4: 语义选择器替代硬编码行索引，宫位标签行不再影响数据定位
  var getRow = function(type) { return tableEl.querySelector('[data-row-type~="' + type + '"]'); };
  var updates;

  if (isSingle) {
    // 单人模式：藏气合并
    // v0.17.0: 纳运 dy4(namespace) 匹配 data-row-type nayun dy4, 自坐 dy5 匹配 zizuo dy5
    updates = [
      ['dy1', pDy.rs, pLn.rs],
      ['ln1', pDy.gan, pLn.gan, pDy.wg, pLn.wg],
      ['dy2', pDy.zhi, pLn.zhi, pDy.wz, pLn.wz],
      ['ln2', pDy.cg, pLn.cg],
      ['dy3', pDy.ny, pLn.ny],
      ['dy4', pDy.nayun, pLn.nayun],
      ['ln3', pDy.xy, pLn.xy],
      ['dy5', pDy.zz, pLn.zz],
      ['ln4', pDy.kw, pLn.kw],
      ['dy6', pDy.sh, pLn.sh]
    ];
  } else {
    // 双胞胎模式：藏干分层
    // v0.17.0: dy5→nayun, dy6→zizuo
    updates = [
      ['dy1', pDy.rs, pLn.rs],
      ['ln1', pDy.gan, pLn.gan, pDy.wg, pLn.wg],
      ['dy2', pDy.zhi, pLn.zhi, pDy.wz, pLn.wz],
      ['ln2', fmtCGLayer((pDy.ly||[])[0]), fmtCGLayer((pLn.ly||[])[0])],
      ['dy3', fmtCGLayer((pDy.ly||[])[1]), fmtCGLayer((pLn.ly||[])[1])],
      ['ln3', fmtCGLayer((pDy.ly||[])[2]), fmtCGLayer((pLn.ly||[])[2])],
      ['dy4', pDy.ny, pLn.ny],
      ['dy5', pDy.nayun, pLn.nayun],
      ['ln4', pDy.xy, pLn.xy],
      ['dy6', pDy.zz, pLn.zz],
      ['ln5', pDy.kw, pLn.kw],
      ['dy7', pDy.sh, pLn.sh]
    ];
  }

  updates.forEach(function(u) {
    var row = getRow(u[0]);
    if (!row) return;
    var tds = row.querySelectorAll('td');
    if (tds.length < 7) return;
    if (u[3] !== undefined) {
      tds[5].className = 'sep col-dy ' + u[3];
      tds[6].className = 'col-ln ' + u[4];
    }
    tds[5].innerHTML = u[1] || '';
    tds[6].innerHTML = u[2] || '';
  });
}


// ============ v0.5.0 差异高亮 ============
// 逐 cell 比对双胞胎两个盘式的同字段，返回 diffMap
function buildDiffMap(p1, p2) {
  var map = {};
  var fields = ['rs','gan','zhi','na_yin','xing_yun','zi_zuo','kong_wang','shen_sha'];
  // 这些字段被 pillar() 映射为：rs, gan, zhi, ny, xy, zz, kw, sh
  var mapped = ['rs','gan','zhi','ny','xy','zz','kw','sh'];
  var pillars = ['nian','yue','ri','shi','tai','ming','shen'];

  pillars.forEach(function(p) {
    mapped.forEach(function(f, i) {
      var v1 = p1[p] ? p1[p][f] : undefined;
      var v2 = p2[p] ? p2[p][f] : undefined;
      if (v1 !== v2) {
        map[p + '.' + f] = true;
      }
    });
    // 藏干分层逐层比对
    var ly1 = p1[p] ? p1[p].ly : [];
    var ly2 = p2[p] ? p2[p].ly : [];
    [0,1,2].forEach(function(li) {
      var l1 = ly1[li], l2 = ly2[li];
      var g1 = l1 ? l1.gan : '', g2 = l2 ? l2.gan : '';
      if (g1 !== g2) {
        map[p + '.cg.' + li] = true;
      }
    });
  });

  return map;
}

// ============ v0.6.0 抽取：单张卡片骨架 builder ============
// 返回完整卡片 HTML（含四柱+三垣，可选大运尾缀）
// options: { twin, label, relation, identClass, diffMap, luckHTML? }
function buildCardHTML(data, options) {
  options = options || {};
  var twin = options.twin || 1;
  var label = options.label || '老大';
  var relation = options.relation || '';
  var identClass = options.identClass || 'twin-1';
  var diffMap = options.diffMap || {};
  var luckHTML = options.luckHTML || '';
  var includeLuckCols = options.includeLuckCols || false;
  var curDaYun = options.curDaYun;
  var curLiuNian = options.curLiuNian;
  var meta = options.meta || '';

  var riGan = data.ri.gan, riZhi = data.ri.zhi;
  var nian = data.nian, yue = data.yue, ri = data.ri, shi = data.shi;
  var tai = data.tai, ming = data.ming, shen = data.shen;

  function pillar(gan, zhi, type) {
    return {
      gan: gan, zhi: zhi,
      wg: wxClass(gan), wz: wxClass(zhi),
      rs: (gan === riGan && type === 'ri') ? '日主' : shiShen(riGan, gan, false),
      ny: NAYIN[gan + zhi] || '',
      nayun: nayunChangSheng(NAYIN[gan + zhi], yue.zhi),
      xy: changSheng(riGan, zhi),
      zz: changSheng(gan, zhi),
      kw: gan + zhi === riGan + riZhi ? kongWang(riGan, riZhi) : kongWang(gan, zhi),
      ly: cangGanLayers(zhi, riGan, twin, type),
      sh: gan + zhi === riGan + riZhi ? shenSha(riGan, riZhi, nian.zhi, yue.zhi) : ''
    };
  }
  var p = {
    nian: pillar(nian.gan, nian.zhi, 'nian'),
    yue:  pillar(yue.gan,  yue.zhi,  'yue'),
    ri:   pillar(ri.gan,   ri.zhi,   'ri'),
    shi:  pillar(shi.gan,  shi.zhi,  'shi'),
    tai:  pillar(tai.gan,  tai.zhi,  'tai'),
    ming: pillar(ming.gan, ming.zhi, 'ming'),
    shen: pillar(shen.gan, shen.zhi, 'shen')
  };

  // 行内辅助
  function td(cls, txt, ext) { return '<td class="'+(cls||'')+'"'+(ext||'')+'>'+(txt||'')+'</td>'; }
  function rl(lbl) { return '<td class="rl">'+lbl+'</td>'; }
  function emp(cls) { return '<td class="'+(cls||'')+'"></td>'; }
  function dm(key, cls) { return diffMap[key] ? (cls ? cls+' bz-diff' : 'bz-diff') : (cls||''); }

  var rows = buildPillarRows(p, { diffMap: diffMap });
  var hdr = '<tr class="hd"><th class="rl">盘式</th><th>年柱</th><th>月柱</th><th>日柱</th><th>时柱</th></tr>';

  // v0.10.0 宫位标签行由 updateGongWeiTags() 动态生成

  // v0.6.1: 龙凤胎卡片四柱表扩展7列（+大运+流年）
  if (includeLuckCols && curDaYun && curLiuNian) {
    var pDy = pillar(curDaYun.gan, curDaYun.zhi, 'dayun');
    var pLn = pillar(curLiuNian.gan, curLiuNian.zhi, 'liunian');
    hdr = '<tr class="hd"><th class="rl">盘式</th><th>年柱</th><th>月柱</th><th>日柱</th><th>时柱</th><th class="sep">大运</th><th class="col-ln">流年</th></tr>';
    // v0.10.0 宫位标签行由 updateGongWeiTags() 动态生成
    // 主星(0)
    rows.main[0] = '<tr class="rs" data-row-type="dy1">'+rl('主星')+td(dm('nian.rs'),p.nian.rs)+td(dm('yue.rs'),p.yue.rs)+td(dm('ri.rs'),p.ri.rs)+td(dm('shi.rs'),p.shi.rs)+td('sep col-dy',pDy.rs)+td('col-ln',pLn.rs)+'</tr>';
    // 天干(1)
    rows.main[1] = '<tr class="rg" data-row-type="ln1">'+rl('')+td(dm('nian.gan',p.nian.wg),p.nian.gan)+td(dm('yue.gan',p.yue.wg),p.yue.gan)+td(dm('ri.gan',p.ri.wg),p.ri.gan)+td(dm('shi.gan',p.shi.wg),p.shi.gan)+td('sep col-dy '+pDy.wg,pDy.gan)+td('col-ln '+pLn.wg,pLn.gan)+'</tr>';
    // 地支(2)
    rows.main[2] = '<tr class="rg" data-row-type="dy2">'+rl('')+td(dm('nian.zhi',p.nian.wz),p.nian.zhi)+td(dm('yue.zhi',p.yue.wz),p.yue.zhi)+td(dm('ri.zhi',p.ri.wz),p.ri.zhi)+td(dm('shi.zhi',p.shi.wz),p.shi.zhi)+td('sep col-dy '+pDy.wz,pDy.zhi)+td('col-ln '+pLn.wz,pLn.zhi)+'</tr>';
    // 本气(3)
    rows.main[3] = '<tr class="rh" data-row-type="ln2">'+rl('本气')+td(dm('nian.cg.0'),fmtCGLayer((p.nian.ly||[])[0]))+td(dm('yue.cg.0'),fmtCGLayer((p.yue.ly||[])[0]))+td(dm('ri.cg.0'),fmtCGLayer((p.ri.ly||[])[0]))+td(dm('shi.cg.0'),fmtCGLayer((p.shi.ly||[])[0]))+td('sep col-dy',fmtCGLayer((pDy.ly||[])[0]))+td('col-ln',fmtCGLayer((pLn.ly||[])[0]))+'</tr>';
    // 中气(4)
    rows.main[4] = '<tr class="rh" data-row-type="dy3">'+rl('中气')+td(dm('nian.cg.1'),fmtCGLayer((p.nian.ly||[])[1]))+td(dm('yue.cg.1'),fmtCGLayer((p.yue.ly||[])[1]))+td(dm('ri.cg.1'),fmtCGLayer((p.ri.ly||[])[1]))+td(dm('shi.cg.1'),fmtCGLayer((p.shi.ly||[])[1]))+td('sep col-dy',fmtCGLayer((pDy.ly||[])[1]))+td('col-ln',fmtCGLayer((pLn.ly||[])[1]))+'</tr>';
    // 余气(5)
    rows.main[5] = '<tr class="rh" data-row-type="ln3">'+rl('余气')+td(dm('nian.cg.2'),fmtCGLayer((p.nian.ly||[])[2]))+td(dm('yue.cg.2'),fmtCGLayer((p.yue.ly||[])[2]))+td(dm('ri.cg.2'),fmtCGLayer((p.ri.ly||[])[2]))+td(dm('shi.cg.2'),fmtCGLayer((p.shi.ly||[])[2]))+td('sep col-dy',fmtCGLayer((pDy.ly||[])[2]))+td('col-ln',fmtCGLayer((pLn.ly||[])[2]))+'</tr>';
    // 纳音(6)
    rows.main[6] = '<tr class="rn" data-row-type="nayin dy4">'+rl('纳音')+td(dm('nian.ny'),p.nian.ny)+td(dm('yue.ny'),p.yue.ny)+td(dm('ri.ny'),p.ri.ny)+td(dm('shi.ny'),p.shi.ny)+td('sep col-dy',pDy.ny)+td('col-ln',pLn.ny)+'</tr>';
    // 纳运(7) ← v0.17.0 从自坐下移至纳音下
    rows.main[7] = '<tr class="rm" data-row-type="nayun dy5">'+rl('纳运')+td(dm('nian.nayun'),p.nian.nayun)+td(dm('yue.nayun'),p.yue.nayun)+td(dm('ri.nayun'),p.ri.nayun)+td(dm('shi.nayun'),p.shi.nayun)+td('sep col-dy',pDy.nayun)+td('col-ln',pLn.nayun)+'</tr>';
    // 星运(8) ← v0.17.0 ln4 不变
    rows.main[8] = '<tr class="rm" data-row-type="xingyun ln4">'+rl('星运')+td(dm('nian.xy'),p.nian.xy)+td(dm('yue.xy'),p.yue.xy)+td(dm('ri.xy'),p.ri.xy)+td(dm('shi.xy'),p.shi.xy)+td('sep col-dy',pDy.xy)+td('col-ln',pLn.xy)+'</tr>';
    // 自坐(9) ← v0.17.0 dy5→dy6
    rows.main[9] = '<tr class="rm" data-row-type="zizuo dy6">'+rl('自坐')+td(dm('nian.zz'),p.nian.zz)+td(dm('yue.zz'),p.yue.zz)+td(dm('ri.zz'),p.ri.zz)+td(dm('shi.zz'),p.shi.zz)+td('sep col-dy',pDy.zz)+td('col-ln',pLn.zz)+'</tr>';
    // 空亡(10)
    rows.main[10] = '<tr class="rm" data-row-type="kongwang ln5">'+rl('空亡')+td(dm('nian.kw'),p.nian.kw)+td(dm('yue.kw'),p.yue.kw)+td(dm('ri.kw'),p.ri.kw)+td(dm('shi.kw'),p.shi.kw)+td('sep col-dy',pDy.kw)+td('col-ln',pLn.kw)+'</tr>';
    // 神煞(11)
    rows.main[11] = '<tr class="rm" data-row-type="shensha dy7">'+rl('神煞')+td(dm('nian.sh'),p.nian.sh)+td(dm('yue.sh'),p.yue.sh)+td(dm('ri.sh'),p.ri.sh)+td(dm('shi.sh'),p.shi.sh)+td('sep col-dy',pDy.sh)+td('col-ln',pLn.sh)+'</tr>';
    // v0.10.0 三垣扩展列：表头[0]和后续行(从1起)加空列
    rows.sanyuan[0] = '<tr class="hd">'+rl('三垣')+emp('')+td('','胎元')+td('','命宫')+td('','身宫')+emp('sep')+emp('col-ln')+'</tr>';
    for (var si = 1; si < rows.sanyuan.length; si++) {
      rows.sanyuan[si] = rows.sanyuan[si].replace('</tr>', emp('sep')+emp('col-ln')+'</tr>');
    }
  }

  var titleHtml = relation ? label+'（'+relation+'）' : label;
  var cardStyle = includeLuckCols ? ' style="min-width:420px"' : '';
  var metaHtml = meta ? '<div class="bz-card-meta">'+meta+'</div>' : '';

  return '<div class="bz-twin-card '+identClass+'" data-card="'+twin+'"'+cardStyle+'>'
    + '<div class="bz-card-accent"></div>'
    + '<div class="bz-card-title">'+titleHtml
    + '<span class="bz-sanyuan-toggle" onclick="var sa=this.parentElement.parentElement.querySelector(\'.bz-sanyuan-area\');var t=this;sa.classList.toggle(\'collapsed\');t.textContent=sa.classList.contains(\'collapsed\')?\'▼ 三垣\':\'▲ 三垣\';">▲ 三垣</span></div>'
    + metaHtml
    + '<div class="bz-card-tools" style="padding:0 16px 6px;display:flex;gap:6px;"></div>'
    + '<div class="chart-wrap"><table class="chart level-0">'+hdr+'\n'+rows.main.join('\n')+'</table></div>'
    + '<div class="bz-sanyuan-area"><table class="chart level-0" style="border-top:1px solid var(--bz-card-border);">'+rows.sanyuan.join('\n')+'</table></div>'
    + luckHTML
    + '</div>';
}

// ============ v0.6.1 卡片内大运表（luck-table 样式，替代 v0.6.0 pill）============
function buildCardLuckHTML(daYun, qiYun, data, options) {
  options = options || {};
  var identClass = options.identClass || 'twin-1';
  var shunLabel = options.shunLabel || '顺排';
  var riGan = data.ri.gan;
  var h = data.h, mi = data.mi;

  var nowYear = new Date().getFullYear();
  var curDyIdx = 0;
  for (var i = daYun.length - 1; i >= 0; i--) {
    if (daYun[i].startYear <= nowYear) { curDyIdx = i; break; }
  }

  var joy = qiYun ? qiYun.years : 0, jom = qiYun ? qiYun.months : 0, jod = qiYun ? qiYun.days : 0;
  var qiyunText = '出生后 ' + joy + ' 年 ' + jom + ' 月 ' + jod + ' 天 ' + h + ' 小时 ' + mi + ' 分';
  var jyText = '';
  (function() {
    var y = data.y, startYear = y + joy;
    for (var j = 0; j < 20; j++) {
      var tY = startYear + j;
      if ('己甲'.indexOf(TG[(tY - 4) % 10]) >= 0) { jyText = '逢己、甲年白露后 ' + (jod + jom * 30) + ' 天'; return; }
    }
  })();

  // luck-table 三行：大运头、干支、流年
  var luckRows = [];
  luckRows.push('<div class="luck-row hd"><div class="cell rtag">大运</div>');
  // 运前列：qyYears > 0 时渲染
  if (joy > 0) {
    luckRows.push('<div class="cell pre-qy"><span class="year">运前</span><span class="age">'+joy+'岁前</span></div>');
  }
  for (var l = 0; l < daYun.length; l++) {
    var dy = daYun[l], cls = l === curDyIdx ? ' cell cc' : ' cell';
    luckRows.push('<div class="'+cls+'"><span class="year">'+dy.startYear+'</span><span class="age">'+dy.startAge+'岁</span></div>');
  }
  luckRows.push('</div>');

  luckRows.push('<div class="luck-row"><div class="cell rtag">大运</div>');
  // 运前列：--占位，无 data-dy
  if (joy > 0) {
    luckRows.push('<div class="cell pre-qy"><div class="dy-stem" style="color:var(--c-gray)">--</div><div class="dy-branch" style="color:var(--c-gray)">--</div></div>');
  }
  for (var l = 0; l < daYun.length; l++) {
    var dy = daYun[l], cls = l === curDyIdx ? ' cell cc' : ' cell';
    var ss = shiShen(riGan, dy.gan), sb = zhiShiShen(riGan, dy.zhi);
    luckRows.push('<div class="'+cls+'" data-dy="'+l+'"><div class="dy-stem '+wxClass(dy.gan)+'">'+dy.gan+'<span>'+ss.substr(0,1)+'</span></div><div class="dy-branch '+wxClass(dy.zhi)+'">'+dy.zhi+'<span>'+sb.substr(0,1)+'</span></div></div>');
  }
  luckRows.push('</div>');

  luckRows.push('<div class="luck-row liu-row"><div class="cell rtag">流年</div>');
  // 运前列：出生年至起运前一年的流年干支（无 data-di/data-li）
  if (joy > 0) {
    var preLis = '';
    for (var py = data.y; py < data.y + joy; py++) {
      var gz = liuNianJZ(py);
      preLis += '<span class="li"><span class="'+wxClass(gz[0])+'">'+gz[0]+'</span><span class="'+wxClass(gz[1])+'">'+gz[1]+'</span></span>';
    }
    luckRows.push('<div class="cell pre-qy">'+preLis+'</div>');
  }
  for (var l = 0; l < daYun.length; l++) {
    var dy = daYun[l], cls = l === curDyIdx ? ' cell cc' : ' cell';
    var lis = '';
    for (var j = 0; j < 10; j++) {
      var lnY = dy.startYear + j;
      var gz = liuNianJZ(lnY);
      var curCls = (l === curDyIdx && lnY === nowYear) ? 'li cur' : 'li';
      lis += '<span class="'+curCls+'" data-di="'+l+'" data-li="'+j+'"><span class="'+wxClass(gz[0])+'">'+gz[0]+'</span><span class="'+wxClass(gz[1])+'">'+gz[1]+'</span></span>';
    }
    luckRows.push('<div class="'+cls+'">'+lis+'</div>');
  }
  luckRows.push('</div>');

  return '<div class="bz-card-luck '+identClass+'">'

// ============ 入口辅助：注入当前大运/流年信息 ============
function injectCurDaYunLiuNian(data) {
  var nowYear = new Date().getFullYear();
  var daYun = data.daYun;
  if (!daYun || !daYun.length) return;
  var curDyIdx = 0;
  for (var i = daYun.length - 1; i >= 0; i--) {
    if (daYun[i].startYear <= nowYear) { curDyIdx = i; break; }
  }
  var curDy = daYun[curDyIdx];
  data.cur_da_yun = { gan: curDy.gan, zhi: curDy.zhi };
  var curLnGz = liuNianJZ(nowYear);
  data.cur_liu_nian = { gan: curLnGz[0], zhi: curLnGz[1] };
}

// ============ 入口 ============
function doPaipan() {
  const name = document.getElementById('inName').value || '未命名';
  // v0.19.0 隐私模式：构造显示名（data.name 保持真名不动，仅显示层替换）
  const displayName = ARCHIVE.getDisplayName({
    name: name,
    nickname: document.getElementById('inNickname').value,
    yiming: document.getElementById('inYiming').value
  });
  const gender = document.getElementById('inGender').value;
  const y = parseInt(document.getElementById('inYear').value);
  const m = parseInt(APP.calendarType === 'lunar'
    ? document.getElementById('inMonthSelect').value
    : document.getElementById('inMonth').value);
  const d = parseInt(document.getElementById('inDay').value);
  const h = parseInt(document.getElementById('inHour').value);
  const mi = parseInt(document.getElementById('inMin').value) || 0;

  if (isNaN(y) || isNaN(m) || isNaN(d) || isNaN(h)) {
    document.getElementById('output').innerHTML = '<div class="loading" style="color:var(--c-red)">请填写完整的出生时间</div>';
    return;
  }

  // v0.8.0 农历→公历转换（在真太阳时修正之前）
  var solarY = y, solarM = m, solarD = d;
  if (APP.calendarType === 'lunar') {
    var isLeap = document.getElementById('inLeap').checked;
    var solar = lunarToSolar(y, m, d, isLeap);
    if (!solar) {
      document.getElementById('output').innerHTML = '<div class="loading" style="color:var(--c-red)">日期超出支持范围（1000-2100）</div>';
      return;
    }
    solarY = solar.y; solarM = solar.m; solarD = solar.d;
  }

  // 真太阳时修正：仅当用户勾选了真太阳时且地址已选（基于转换后的公历日期）
  let tst = null;
  const useSolar = document.getElementById('useSolar').checked;
  if (useSolar) {
    const lng = getLng();
    tst = lng !== null ? trueSolarTime(solarY, solarM, solarD, h, mi, lng) : null;
  }

  const ey = tst ? tst.y : solarY, em = tst ? tst.m : solarM, ed = tst ? tst.d : solarD, eh = tst ? tst.h : h, emi = tst ? tst.mi : mi;

  try {
    // v0.10.0 排盘前保存宫位选中状态
    var savedGongWei = selectedGongWei.slice();
    const twin = document.getElementById('inTwin').value;
    const output = document.getElementById('output');

    if (twin === '2') {
      // 龙凤胎：两次 paipan，不同 gender
      const g1 = document.getElementById('inGender').value;
      const g2 = document.getElementById('inGender2').value;
      const d1 = paipan(name, g1, ey, em, ed, eh, emi);
      d1.displayName = displayName;
      d1.trueSolar = tst;
      d1.renYuan = renYuanSiLing(ey, em, ed, eh, emi);
      injectCurDaYunLiuNian(d1);
      const d2 = paipan(name, g2, ey, em, ed, eh, emi);
      d2.displayName = displayName;
      d2.trueSolar = tst;
      d2.renYuan = renYuanSiLing(ey, em, ed, eh, emi);
      injectCurDaYunLiuNian(d2);
      output.innerHTML = '';
      renderLongFengCardsHtml(d1, d2, 'output');
      setCurrentBaziResult(extractBaziFromPaipan(d1));
    } else if (twin === '1') {
      const data = paipan(name, gender, ey, em, ed, eh, emi);
      data.displayName = displayName;
      data.trueSolar = tst;
      data.renYuan = renYuanSiLing(ey, em, ed, eh, emi);
      output.innerHTML = '';
      renderTwinCardsHtml(data, 'output');
      setCurrentBaziResult(extractBaziFromPaipan(data));
    } else {
      const data = paipan(name, gender, ey, em, ed, eh, emi);
      data.displayName = displayName;
      data.trueSolar = tst;
      data.renYuan = renYuanSiLing(ey, em, ed, eh, emi);
      output.innerHTML = '';
      renderChart(data);
      setCurrentBaziResult(extractBaziFromPaipan(data));
    }
    // v0.10.0 恢复宫位选中状态并重新渲染标签行
    GONGWEI.selectedGongWei = savedGongWei;
    updateGongWeiTags();
    autoSaveArchive();
  } catch(e) {
    document.getElementById('output').innerHTML = '<div class="loading" style="color:var(--c-red)">排盘出错：' + e.message + '</div>';
    console.error(e);
  }
}

// 滚动并定位到当前大运/流年
function scrollToNow(scope) {
  scope = scope || document;
  const d = scope._paipanData || window._paipanData;
  if (!d) return;
  const nowYear = new Date().getFullYear();
  // 找当前大运索引
  let curDyIdx = 0;
  for (let i = d.daYun.length - 1; i >= 0; i--) {
    if (d.daYun[i].startYear <= nowYear) { curDyIdx = i; break; }
  }
  const curLi = nowYear - d.daYun[curDyIdx].startYear;
  // 先切高亮
  hiDy(curDyIdx, scope);
  hiLn(curDyIdx, curLi, scope);
  // 更新图表大运流年列
  var container = scope.querySelector('.bz-result') || scope.querySelector('#output') || scope;
  updateCardDyLnColumns(container, container, curDyIdx, curLi);
  // 再滚动
  const sec = scope.querySelector('.luck-section');
  const cc = sec && sec.querySelector('.cc');
  if (cc && sec) {
    const sl = cc.offsetLeft - sec.offsetLeft - 40;
    sec.scrollTo({ left: Math.max(0, sl), behavior: 'smooth' });
  }
}

function extractBaziFromPaipan(p) {
  return {

      nian: { gan: p.nian.gan, zhi: p.nian.zhi },
      yue:  { gan: p.yue.gan, zhi: p.yue.zhi },

      shi:  { gan: p.shi.gan, zhi: p.shi.zhi }
    },
    sanyuan: {
      tai:  { gan: p.tai.gan, zhi: p.tai.zhi },
      ming: { gan: p.ming.gan, zhi: p.ming.zhi },
      shen: { gan: p.shen.gan, zhi: p.shen.zhi }
    },
    extras: {
      shengXiao: p.shengXiao,
      qiYun: p.qiYun ? { year: p.qiYun.years, month: p.qiYun.months, day: p.qiYun.days, hour: p.qiYun.hours, shun: p.qiYun.shun } : null,
      daYun: p.daYun.map(function(dy) { return { gan: dy.gan, zhi: dy.zhi, startAge: dy.startAge, endAge: dy.endAge, startYear: dy.startYear }; })
    },
    gongWeiType: null
  };
}

// 从档案数据构建 renderChart 所需的完整 paipan 数据对象
function buildChartDataFromArchive(arch) {
  // 若 bazi 为空，先计算
  if (!arch.bazi) {
    var p = paipan(arch.name, arch.gender, arch.year, arch.month, arch.day, arch.hour, arch.min || 0);
    arch.bazi = {
      nian: { gan: p.nian.gan, zhi: p.nian.zhi },
      yue:  { gan: p.yue.gan, zhi: p.yue.zhi },
      ri:   { gan: p.ri.gan, zhi: p.ri.zhi },
      shi:  { gan: p.shi.gan, zhi: p.shi.zhi }
    };
    arch.sanyuan = {
      tai:  { gan: p.tai.gan, zhi: p.tai.zhi },
      ming: { gan: p.ming.gan, zhi: p.ming.zhi },
      shen: { gan: p.shen.gan, zhi: p.shen.zhi }
    };
    arch.extras = {
      shengXiao: p.shengXiao,
      qiYun: p.qiYun ? { year: p.qiYun.years, month: p.qiYun.months, day: p.qiYun.days, hour: p.qiYun.hours, shun: p.qiYun.shun } : null,
      daYun: p.daYun.map(function(dy) { return { gan: dy.gan, zhi: dy.zhi, startAge: dy.startAge, endAge: dy.endAge, startYear: dy.startYear }; })
    };
    // Save back to localStorage
    saveArchives(getArchives());
  }
  // Rebuild paipan-style data object
  var p = paipan(arch.name, arch.gender, arch.year, arch.month, arch.day, arch.hour, arch.min || 0);
  // Ensure bazi fields match (paipan recalculates, but we want consistent results)
  p.nian.gan = arch.bazi.nian.gan; p.nian.zhi = arch.bazi.nian.zhi;
  p.yue.gan = arch.bazi.yue.gan; p.yue.zhi = arch.bazi.yue.zhi;
  p.ri.gan = arch.bazi.ri.gan; p.ri.zhi = arch.bazi.ri.zhi;
  p.shi.gan = arch.bazi.shi.gan; p.shi.zhi = arch.bazi.shi.zhi;
  p.tai.gan = arch.sanyuan.tai.gan; p.tai.zhi = arch.sanyuan.tai.zhi;
  p.ming.gan = arch.sanyuan.ming.gan; p.ming.zhi = arch.sanyuan.ming.zhi;
  p.shen.gan = arch.sanyuan.shen.gan; p.shen.zhi = arch.sanyuan.shen.zhi;
  return p;
}

// 在卡片展开区渲染排盘（复用 renderChart，输出到临时容器）
function renderExpandedChart(arch, containerEl) {
  var data = buildChartDataFromArchive(arch);
  // Create a temporary div, render into it, then move to container
  var tmpId = 'archive-expanded-tmp';
  var existingTmp = document.getElementById(tmpId);
  if (existingTmp) existingTmp.parentNode.removeChild(existingTmp);
  var tmp = document.createElement('div');
  tmp.id = tmpId;
  tmp.style.display = 'none';
  document.body.appendChild(tmp);
  // Temporarily set output to tmp
  var origOutput = document.getElementById('output');
  tmp.innerHTML = '<div id="output"></div>';
  // Re-render: simplified approach — build HTML directly
  try {
    var html = renderChartToHtml(data, arch);

  } catch(e) {
    containerEl.innerHTML = '<div style="color:var(--c-red);padding:10px;">排盘渲染出错: ' + e.message + '</div>';
  }
  if (tmp.parentNode) tmp.parentNode.removeChild(tmp);
}

// 生成只读排盘HTML（精简版，四柱+三垣）
function renderChartToHtml(data, arch) {
  var riGan = data.ri.gan, riZhi = data.ri.zhi;
  function pillar(gan, zhi) {
    return {
      gan: gan, zhi: zhi,
      wg: wxClass(gan), wz: wxClass(zhi),
      rs: shiShen(riGan, gan),
      ny: NAYIN[gan + zhi] || '',
      xy: changSheng(riGan, zhi),
      zz: changSheng(gan, zhi),
      kw: gan + zhi === riGan + riZhi ? kongWang(riGan, riZhi) : kongWang(gan, zhi),
      cg: cangGanText(zhi, riGan, 1),
      sh: gan + zhi === riGan + riZhi ? shenSha(riGan, riZhi, data.nian.zhi, data.yue.zhi) : ''
    };
  }
  var pNian = pillar(data.nian.gan, data.nian.zhi);
  var pYue = pillar(data.yue.gan, data.yue.zhi);
  var pRi = pillar(data.ri.gan, data.ri.zhi);
  var pShi = pillar(data.shi.gan, data.shi.zhi);
  var pTai = pillar(data.tai.gan, data.tai.zhi);
  var pMing = pillar(data.ming.gan, data.ming.zhi);
  var pShen = pillar(data.shen.gan, data.shen.zhi);

  function td(cls, txt) { return '<td class="' + (cls||'') + '">' + (txt||'') + '</td>'; }
  function rl(lbl) { return '<td class="rl">' + lbl + '</td>'; }
  function emp() { return '<td></td>'; }
  function th(cls, txt) { return '<th class="' + (cls||'') + '">' + txt + '</th>'; }

  var rows = [];
  // Header
  rows.push('<tr class="hd">' + rl('') + th('','年柱') + th('','月柱') + th('','日柱') + th('','时柱') + emp() + th('','胎元') + th('','命宫') + th('','身宫') + '</tr>');
  // 主星
  rows.push('<tr class="rs">' + rl('主星') + td('',pNian.rs) + td('',pYue.rs) + td('',pRi.rs) + td('',pShi.rs) + emp() + td('',pTai.rs) + td('',pMing.rs) + td('',pShen.rs) + '</tr>');
  // 天干
  rows.push('<tr class="rg">' + rl('') + td(pNian.wg,pNian.gan) + td(pYue.wg,pYue.gan) + td(pRi.wg,pRi.gan) + td(pShi.wg,pShi.gan) + emp() + td(pTai.wg,pTai.gan) + td(pMing.wg,pMing.gan) + td(pShen.wg,pShen.gan) + '</tr>');
  // 地支
  rows.push('<tr class="rg">' + rl('') + td(pNian.wz,pNian.zhi) + td(pYue.wz,pYue.zhi) + td(pRi.wz,pRi.zhi) + td(pShi.wz,pShi.zhi) + emp() + td(pTai.wz,pTai.zhi) + td(pMing.wz,pMing.zhi) + td(pShen.wz,pShen.zhi) + '</tr>');
  // 藏气
  rows.push('<tr class="rh">' + rl('藏气') + td('',pNian.cg) + td('',pYue.cg) + td('',pRi.cg) + td('',pShi.cg) + emp() + td('',pTai.cg) + td('',pMing.cg) + td('',pShen.cg) + '</tr>');
  // 纳音
  rows.push('<tr class="rn">' + rl('纳音') + td('',pNian.ny) + td('',pYue.ny) + td('',pRi.ny) + td('',pShi.ny) + emp() + td('',pTai.ny) + td('',pMing.ny) + td('',pShen.ny) + '</tr>');
  // 星运
  rows.push('<tr class="rm">' + rl('星运') + td('',pNian.xy) + td('',pYue.xy) + td('',pRi.xy) + td('',pShi.xy) + emp() + td('',pTai.xy) + td('',pMing.xy) + td('',pShen.xy) + '</tr>');
  // 自坐
  rows.push('<tr class="rm">' + rl('自坐') + td('',pNian.zz) + td('',pYue.zz) + td('',pRi.zz) + td('',pShi.zz) + emp() + td('',pTai.zz) + td('',pMing.zz) + td('',pShen.zz) + '</tr>');
  // 空亡
  rows.push('<tr class="rm">' + rl('空亡') + td('',pNian.kw) + td('',pYue.kw) + td('',pRi.kw) + td('',pShi.kw) + emp() + td('',pTai.kw) + td('',pMing.kw) + td('',pShen.kw) + '</tr>');

  // Info line
  var nowYear = new Date().getFullYear();
  var sx = data.shengXiao;
  var info = '<div style="font-family:var(--font-display);font-size:14px;color:var(--c-ink);margin-bottom:6px;">'
    + '<b>' + ARCHIVE.getDisplayName(arch) + '</b> '
    + '<span class="sex-tag" style="font-family:var(--font-display);font-size:14px;color:var(--c-red);margin-left:4px;">' + (arch.gender === '男' ? '乾造' : '坤造') + '</span>'
    + ' <span style="color:var(--c-gray);font-size:13px;">' + arch.gender + ' · ' + arch.year + '年' + arch.month + '月' + arch.day + '日 ' + pad(arch.hour) + ':' + pad(arch.min||0) + '</span>'
    + ' <span style="color:var(--c-gray);font-size:13px;">' + data.nian.gan + data.nian.zhi + '年生 · 属' + sx + '</span>'
    + '</div>';

  return info + '<div class="chart-wrap" style="overflow-x:auto;"><table class="chart level-0" style="min-width:640px;width:100%;">' + rows.join('\n') + '</table></div>';
}

function onProvChange() {
  const prov = document.getElementById('inProv').value;
  const cSel = document.getElementById('inCity');
  const dSel = document.getElementById('inDist');
  cSel.innerHTML = '<option value="">—</option>';
  dSel.innerHTML = '<option value="">—</option>';
  if (!prov || !LOC_DATA[prov]) return;
  const cities = Object.keys(LOC_DATA[prov].cities).sort((a,b)=>a.localeCompare(b,'zh'));
  cities.forEach(c => { const o=document.createElement('option'); o.value=c; o.textContent=c; cSel.appendChild(o); });
  // 智能默认省会
  let defCity = null;
  const capitals = { '四川省':'成都市','河北省':'石家庄市','江苏省':'南京市','浙江省':'杭州市',
    '广东省':'广州市','福建省':'福州市','安徽省':'合肥市','江西省':'南昌市','山东省':'济南市',
    '河南省':'郑州市','湖北省':'武汉市','湖南省':'长沙市','辽宁省':'沈阳市','吉林省':'长春市',
    '黑龙江省':'哈尔滨市','山西省':'太原市','陕西省':'西安市','甘肃省':'兰州市','青海省':'西宁市',
    '贵州省':'贵阳市','云南省':'昆明市','海南省':'海口市','内蒙古':'呼和浩特市','广西':'南宁市',
    '西藏':'拉萨市','宁夏':'银川市','新疆':'乌鲁木齐市','台湾':'台北市' };
  defCity = capitals[prov];
  if (!defCity) {
    // fallback：省份名与城市名匹配（如北京市、上海市等直辖）
    const bareProv = prov.replace(/[省市]$/,'');
    for (const c of cities) {
      const bareC = c.replace(/[市州]$/,'');
      if (bareC === bareProv || bareC.includes(bareProv) || bareProv.includes(bareC)) { defCity = c; break; }
    }
  }
  if (!defCity) defCity = cities[0];
  if (defCity) { cSel.value = defCity; onCityChange(); }
}

function onCityChange() {
  const prov = document.getElementById('inProv').value;
  const city = document.getElementById('inCity').value;

  const el = document.getElementById('liveSolar');
  if (!el) return;
  const lng = getLng();
  const y = parseInt(document.getElementById('inYear').value);
  // v0.23.1 农历模式 inMonth 被替换为 inMonthSelect，DOM 自适应取值
  const m = parseInt((document.getElementById('inMonthSelect') || document.getElementById('inMonth')).value);
  const d = parseInt(document.getElementById('inDay').value);
  const h = parseInt(document.getElementById('inHour').value);
  const mi = parseInt(document.getElementById('inMin').value) || 0;
  if (lng === null || isNaN(y) || isNaN(m) || isNaN(d) || isNaN(h)) {
    el.innerHTML = '';
    return;
  }
  try {
    const tst = trueSolarTime(y, m, d, h, mi, lng);
    const off = Math.round(tst.offsetMin);
    el.innerHTML = '<span style="color:var(--c-red);">☀</span> 真太阳时 ' + pad(tst.h)+':'+pad(tst.mi)+' ('+(off>=0?'+':'')+off+'分)';
  } catch(e) { el.innerHTML = ''; }
}

// 时间修饰词→小时偏移
const TIME_MOD = {
  '凌晨':0, '半夜':0, '早晨':0, '早上':0, '上午':0,
  '中午':12, '下午':12, '傍晚':12, '黄昏':12, '晚上':12, '夜里':12
};

function parseNaturalInput(text) {
  const result = { name:'', gender:'男', year:null, month:null, day:null, hour:null, min:0, prov:'', city:'', dist:'', calendarType:'solar' };
  let t = text.trim();
  if (!t) return result;
  // v0.23.3 地址匹配基准：保留原始文本，避免省=市（如北京市）替换后城市/区县失配
  const t0 = t;

  // 1. 提取性别
  const genderM = t.match(/[男女]/);
  if (genderM) { result.gender = genderM[0]; t = t.replace(genderM[0], ' '); }

  // 2. 提取日期 — 中文格式（"日/号"后缀可省略，如"1986年7月26（农历）"）
  const dateCN = t.match(/(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]?/);
  if (dateCN) {
    result.year = parseInt(dateCN[1]);
    result.month = parseInt(dateCN[2]);
    result.day = parseInt(dateCN[3]);
    t = t.replace(dateCN[0], ' ');
  }
  // v0.23.3 农历标志识别：农历/阴历/旧历/老历（含括号写法）
  if (/农历|阴历|旧历|老历/.test(text)) result.calendarType = 'lunar';
  // 数字格式 1982-10-18 / 1982.10.18 / 1982/10/18
  if (!result.year) {
    const dateNum = t.match(/(\d{4})\s*[-./]\s*(\d{1,2})\s*[-./]\s*(\d{1,2})/);
    if (dateNum) {
      result.year = parseInt(dateNum[1]);
      result.month = parseInt(dateNum[2]);
      result.day = parseInt(dateNum[3]);
      t = t.replace(dateNum[0], ' ');
    }
  }

  // 3. 提取时间
  // 先匹配带修饰词的：早上5点、下午3点、晚上8点01分
  const timeMod = t.match(/(凌晨|半夜|早晨|早上|上午|中午|下午|傍晚|黄昏|晚上|夜里)\s*(\d{1,2})\s*[点时:：]\s*(\d{1,2})?\s*[分]?/);
  if (timeMod) {
    let h = parseInt(timeMod[2]);
    const m = timeMod[3] ? parseInt(timeMod[3]) : 0;
    const mod = TIME_MOD[timeMod[1]];
    if (mod === 12) {
      if (h < 12) h += 12;
      if (h === 12 && timeMod[1] === '中午') h = 12;
    }
    result.hour = h;
    result.min = m;
    t = t.replace(timeMod[0], ' ');
  }
  // 纯数字时间 5:01 / 05:01 / 5时01分
  if (result.hour === null) {
    const timeNum = t.match(/(\d{1,2})\s*[:：时点]\s*(\d{1,2})?\s*[分]?/);
    if (timeNum) {
      result.hour = parseInt(timeNum[1]);
      result.min = timeNum[2] ? parseInt(timeNum[2]) : 0;
      t = t.replace(timeNum[0], ' ');
    }
  }
  // 只有小时：5点
  if (result.hour === null) {
    const hourOnly = t.match(/(\d{1,2})\s*点/);
    if (hourOnly) {
      result.hour = parseInt(hourOnly[1]);
      result.min = 0;
      t = t.replace(hourOnly[0], ' ');
    }
  }

  // 4. 提取地址
  const provList = Object.keys(LOC_DATA);
  // 按长度降序匹配，防止"广西"匹配到"广西省"
  const sortedProv = [...provList].sort((a,b) => b.length - a.length);
  for (const p of sortedProv) {
    const shortP = p.replace(/[省市区]$/, '');
    if (t0.includes(p) || t0.includes(shortP)) {
      result.prov = p;
      t = t.replace(p, ' ').replace(shortP, ' ');
      // 提取城市
      const cities = Object.keys(LOC_DATA[p].cities);
      const sortedCities = [...cities].sort((a,b) => b.length - a.length);
      for (const c of sortedCities) {
        const shortC = c.replace(/[市县区]$/, '');
        if (t0.includes(c) || t0.includes(shortC)) {
          result.city = c;
          t = t.replace(c, ' ').replace(shortC, ' ');
          // 提取区县（支持省县写法：输入"南丹"匹配"南丹县"）
          const dists = LOC_DATA[p].cities[c]?.dist || [];
          for (const d of dists) {
            const shortD = d.replace(/[县区市]$/, '');
            if (t0.includes(d) || t0.includes(shortD)) { result.dist = d; t = t.replace(d, ' ').replace(shortD, ' '); break; }
          }
          break;
        }
      }
      break;
    }
  }

  // 5. 提取姓名 — 剩余文本中取2-4个连续汉字
  const nameM = t.match(/[\u4e00-\u9fa5]{2,4}/);
  if (nameM) result.name = nameM[0];

  return result;
}

function doAiParse() {
  const text = document.getElementById('aiInput').value.trim();
  if (!text) return;
  const r = parseNaturalInput(text);
  
  // 构建预览
  let preview = '';
  if (r.name) preview += '姓名：' + (ARCHIVE.getPrivacyMode() ? '已隐藏' : r.name) + '  ';
  preview += '性别：' + r.gender + '  ';
  if (r.year) preview += r.year + '年' + r.month + '月' + r.day + '日' + (r.calendarType === 'lunar' ? '（农历）' : '') + '  ';
  if (r.hour !== null) preview += r.hour + ':' + String(r.min).padStart(2,'0') + '  ';
  if (r.prov) preview += r.prov + (r.city||'') + (r.dist||'');
  
  if (!r.year) {
    document.getElementById('aiPreview').textContent = '⚠ 未能识别完整日期，请补充';
    return;
  }

  document.getElementById('aiPreview').textContent = '✅ 识别：' + preview;

  // 填表
  if (r.name) document.getElementById('inName').value = r.name;

// ============================================================
// v0.23.0 盘面截图 — #output 一键导出 PNG 长图
// 引擎：html2canvas@1.4.1 CDN 按需加载（三源降级，成功后缓存零网络）
// ============================================================
var screenshotEngineReady = false;   // 引擎加载成功标志（二次点击零网络）
var screenshotBusy = false;          // 防重入

// CDN 三源降级链（jsDelivr → BootCDN → unpkg），@1.4.1 版本锁定防隐式升级漂移
var SCREENSHOT_ENGINE_SOURCES = [
  'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js',
  'https://cdn.bootcdn.net/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
  'https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js'
];

// 逐源动态注入 <script>，每源 8 秒超时（onload/onerror 与 timer 竞态，先到先裁决）
function loadScreenshotEngine(cb) {
  if (screenshotEngineReady) { cb(true); return; }
  var idx = 0;
  var settled = false;
  function tryNext() {
    if (settled) return;
    if (idx >= SCREENSHOT_ENGINE_SOURCES.length) {
      settled = true;
      cb(false);
      return;
    }
    var url = SCREENSHOT_ENGINE_SOURCES[idx++];
    var s = document.createElement('script');
    var finished = false;
    var timer = setTimeout(function() {
      if (finished) return;
      finished = true;
      if (s.parentNode) s.parentNode.removeChild(s);
      tryNext();
    }, 8000);
    function settle() {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
    }
    s.onload = function() {
      if (finished) return;
      settle();
      if (typeof window.html2canvas === 'function') {
        screenshotEngineReady = true;
        settled = true;
        cb(true);
      } else {
        if (s.parentNode) s.parentNode.removeChild(s);
        tryNext();
      }
    };
    s.onerror = function() {
      if (finished) return;
      settle();
      if (s.parentNode) s.parentNode.removeChild(s);
      tryNext();
    };
    s.src = url;
    document.head.appendChild(s);
  }
  tryNext();
}

// 瞬时提示：绝对定位 div 浮于截图按钮上方，2.5 秒后移除（拒绝 alert：阻塞交互且挂起 T06 断言）
function notifyScreenshot(msg) {
  var old = document.getElementById('screenshotNotify');
  if (old && old.parentNode) old.parentNode.removeChild(old);
  var btn = document.getElementById('btnScreenshot');
  if (!btn || !btn.parentNode) return;
  var div = document.createElement('div');
  div.id = 'screenshotNotify';
  div.className = 'screenshot-notify';
  div.textContent = msg;
  div.style.left = (btn.offsetLeft + btn.offsetWidth / 2) + 'px';
  div.style.top = (btn.offsetTop + btn.offsetHeight + 6) + 'px';
  div.style.transform = 'translateX(-50%)';
  btn.parentNode.appendChild(div);
  setTimeout(function() {
    if (div.parentNode) div.parentNode.removeChild(div);
  }, 2500);
}

// 文件名字符清洗：/ \ : * ? " < > | 及空白字符 → '-'，清洗后为空兜底「匿名」
function sanitizeFilename(s) {
  var cleaned = String(s == null ? '' : s)
    .replace(/[\/\\:*?"<>|\s]+/g, '-')
    .replace(/^-+|-+$/g, '');
  return cleaned || '匿名';
}

// 本地日期 YYYYMMDD 手工拼接（禁 toISOString：UTC 本地晚间跨天偏移）
function localYYYYMMDD() {
  var d = new Date();
  return '' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
}

// 文件名生成：八字排盘_<显示名清洗>_<YYYYMMDD>.png
// 隐私铁律：显示名走 ARCHIVE.getDisplayName（隐私开启即脱敏降级链），绝不直读真名
function buildScreenshotFilename(person) {
  return '八字排盘_' + sanitizeFilename(ARCHIVE.getDisplayName(person || {})) + '_' + localYYYYMMDD() + '.png';
}

// 恢复按钮 + busy 复位（所有路径 finally 统一调用）
function resetScreenshotBtn() {
  screenshotBusy = false;
  var btn = document.getElementById('btnScreenshot');
  if (btn) {
    btn.disabled = false;
    btn.textContent = '📷 截图';
  }
}

// 排盘结果一键截图：克隆 #output → 离屏渲染 → PNG 长图下载
function captureScreenshot() {
  var output = document.getElementById('output');
  if (!output) return;
  // 1. 未排盘守卫（沿用现有 person-info 判定，与 togglePrivacy 重渲染判定一致）
  if (output.innerHTML.indexOf('person-info') < 0) {
    notifyScreenshot('请先排盘');
    return;
  }
  // 2. 防重入
  if (screenshotBusy) return;
  screenshotBusy = true;
  var btn = document.getElementById('btnScreenshot');
  if (btn) {
    btn.disabled = true;
    btn.textContent = '⏳ 截图中…';
  }

  // 3. 引擎加载（首次 CDN 动态注入；失败恢复按钮并提示，不阻塞排盘主流程）
  loadScreenshotEngine(function(ok) {
    if (!ok) {
      resetScreenshotBtn();
      notifyScreenshot('截图组件加载失败，请检查网络后重试');
      return;
    }
    var holder = null;
    var canvas = null;
    var url = null;
    try {
      // 4. 克隆 #output → 离屏容器（留在 document 内：CSS 变量/样式自然生效）
      //    容器显式纸色背景：克隆体脱离 .page 后无底色，不声明则截图底色漂移
      //    定位用 absolute（fixed 在 html2canvas 克隆 iframe 中会被视口裁剪 → 长图截断）
      holder = document.createElement('div');
      holder.id = 'screenshotHolder';
      var SHOT_PAD = 36; // v0.23.1: 截图左右留白，内容不贴边（holder 加宽 2*PAD 保持内容区原宽）
      holder.style.cssText = 'position:absolute;left:-9999px;top:0;z-index:-1;pointer-events:none;'
        + 'width:' + ((output.offsetWidth || 1300) + SHOT_PAD * 2) + 'px;'
        + 'background:var(--c-paper);';
      var clone = output.cloneNode(true);
      clone.style.padding = '0 ' + SHOT_PAD + 'px';
      holder.appendChild(clone);
      document.body.appendChild(holder);

      // 5. dpr 适配 + canvas 面积保护（物理像素 > 3200 万时逐级收缩 scale，优先能导出）
      var dpr = window.devicePixelRatio || 1;
      var scale = Math.min(dpr, 2);
      var width = holder.offsetWidth || output.offsetWidth || 1300;
      var height = holder.scrollHeight || output.scrollHeight || 800;
      var maxPx = 32000000;
      if ((width * scale) * (height * scale) > maxPx) {
        if ((width * 1.5) * (height * 1.5) <= maxPx) scale = 1.5;
        else if (width * height <= maxPx) scale = 1;
        else scale = Math.sqrt(maxPx / (width * height));
      }

      // 6. 渲染 holder（含纸色背景）→ Canvas → toBlob（弃 toDataURL：大图内存减半）→ a[download] 下载
      //    windowWidth/windowHeight 显式设为完整内容尺寸，防视口裁剪截断长图
      //    所有异常路径收敛到 finally 清理：移除离屏容器 + 释放 canvas + 恢复按钮
      window.html2canvas(holder, {
        scale: scale,
        useCORS: true,
        logging: false,
        backgroundColor: null,
        windowWidth: width,
        windowHeight: height
      }).then(function(c) {
        canvas = c;
        return new Promise(function(resolve, reject) {
          canvas.toBlob(function(blob) {
            if (!blob) { reject(new Error('toBlob 失败')); return; }
            url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = buildScreenshotFilename(ARCHIVE.getFormData());
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            resolve();
          }, 'image/png');
        });
      }).then(function() {
        if (url) setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
      }).catch(function(err) {
        if (window.console) console.error('[截图] 渲染失败:', err);
        notifyScreenshot('截图失败，请重试');
      }).then(function() {
        if (holder && holder.parentNode) holder.parentNode.removeChild(holder);
        if (canvas) { canvas.width = 0; canvas.height = 0; }
        resetScreenshotBtn();
      });
    } catch (err) {
      if (window.console) console.error('[截图] 异常:', err);
      if (holder && holder.parentNode) holder.parentNode.removeChild(holder);
      if (canvas) { canvas.width = 0; canvas.height = 0; }
      resetScreenshotBtn();
      notifyScreenshot('截图失败，请重试');
    }
  });
}

// auth.js/records.js 在 main 段之后加载，测试区同步渲染时其逻辑尚不可用；
// 各模块加载完成后经 __testAppend 追加断言并重算统一统计（不重排既有断言）。
window.__testAppend = function(t) {
  var results = document.getElementById('test-results');
  var summary = document.getElementById('test-summary');
  if (!results || !summary) return;
  // 解析既有统计（banner 文本：全部 N 条断言通过 / f/t 条断言失败）
  var text = summary.textContent || '';
  var mFail = text.match(/(\d+)\s*\/\s*(\d+)\s*条断言失败/);
  var mOk = text.match(/全部\s*(\d+)\s*条断言通过/);
  var total = 0, failed = 0;
  if (mFail) { total = parseInt(mFail[2], 10); failed = parseInt(mFail[1], 10); }
  else if (mOk) { total = parseInt(mOk[1], 10); failed = 0; }
  var ok = !!t.ok;
  total++; if (!ok) failed++;
  var block = document.createElement('div');
  block.setAttribute('data-ok', ok ? '1' : '0');
  block.style.cssText = 'margin-bottom:6px;padding:8px 12px;border-radius:4px;font-size:14px;font-family:monospace;background:' + (ok ? '#1b3a1b' : '#3a1b1b') + ';border-left:3px solid ' + (ok ? '#4caf50' : '#f44336');
  block.textContent = (ok ? '✅ ' : '❌ ') + t.label + (t.detail ? ' — ' + t.detail : '');
  results.appendChild(block);
  var bannerColor = failed === 0 ? '#4caf50' : '#f44336';
  var bannerBg = failed === 0 ? '#1b3a1b' : '#3a1b1b';
  var bannerIcon = failed === 0 ? '✅ 全绿' : '❌ 失败';
  var bannerText = failed === 0 ? '全部 ' + total + ' 条断言通过！' : failed + '/' + total + ' 条断言失败';
  summary.style.cssText = 'background:' + bannerBg + ';border-radius:8px;padding:20px;margin-bottom:20px;text-align:center;border:2px solid ' + bannerColor;
  summary.innerHTML = '<div style="font-size:32px;margin-bottom:8px">' + bannerIcon + '</div>'
    + '<div style="font-size:20px;font-weight:bold;color:' + bannerColor + '">' + bannerText + '</div>'
    + '<div style="color:#888;font-size:13px;margin-top:4px">含 v0.24 追加断言</div>';
  document.title = failed === 0 ? '✅ 全部通过 — 八字排盘回归测试' : '❌ ' + failed + ' 失败 — 八字排盘回归测试';

      return Promise.resolve(false);
    }
    return upsertRecord(inputData, resultData);
  }

  // ===== upsert 记录（含失败入队）=====
  function upsertRecord(inputData, resultData) {
    var user = window.AUTH.getUser();
    if (!user) return Promise.resolve(false);
    return sb.from('paipan_records').insert({
      user_id: user.id,
      input_data: inputData,
      result_data: resultData
    }).then(function(res) {
      if (res.error) {
        enqueuePending({ input_data: inputData, result_data: resultData });
        alert('保存失败（' + (res.error.message || '网络异常') + '），已加入本地队列，网络恢复后自动重试');
        return false;
      }
      alert('已保存到云端'); // P9：保存成功弹窗提示
      loadAndRenderRecords(true); // 保存成功重置到第 1 页（P2-02）
      return true;
    }).catch(function(err) {
      enqueuePending({ input_data: inputData, result_data: resultData });
      alert('保存失败，已加入本地队列，网络恢复后自动重试');
      return false;
    });
  }

  // ===== 列表（倒序，分页每页 50，P2-02 修复；ADR §4.8 range(0,49)）=====
  var __pageSize = 50;        // 每页条数（ADR 约定）
  var __pageOffset = 0;       // 当前已加载到第几条
  var __totalCount = 0;       // 云端总条数（count 模式）

  function fetchRecords(offset, limit) {
    if (!sb) return Promise.resolve({ list: [], total: 0 });
    var from = offset || 0;
    var to = from + (limit || __pageSize) - 1;
    return sb.from('paipan_records')
      .select('*', { count: 'exact' })
      .order('created_at', { ascending: false })
      .range(from, to)
      .then(function(res) {
        if (res.error) return { list: [], total: 0 };
        return { list: res.data || [], total: (res.count != null ? res.count : (res.data || []).length) };
      })
      .catch(function() { return { list: [], total: 0 }; });
  }

  // ===== 渲染列表到「我的排盘」弹层 =====
  function loadAndRenderRecords(reset) {
    if (reset) __pageOffset = 0;
    fetchRecords(__pageOffset, __pageSize).then(function(r) {
      __totalCount = r.total;
      window.RECORDS.__lastList = r.list;
      if (reset) window.RECORDS.__allLoaded = r.list.slice();
      else {
        var prev = window.RECORDS.__allLoaded || [];
        var seen = {};
        prev.concat(r.list).forEach(function(it) { seen[it.id] = it; });
        window.RECORDS.__allLoaded = Object.keys(seen).map(function(k) { return seen[k]; });
      }
      renderRecordsList(window.RECORDS.__allLoaded, r.total);
    });
  }

  // 加载更多（追加下一页）
  function loadMoreRecords() {
    __pageOffset += __pageSize;
    fetchRecords(__pageOffset, __pageSize).then(function(r) {
      __totalCount = r.total;
      var prev = window.RECORDS.__allLoaded || [];
      var seen = {};
      prev.concat(r.list).forEach(function(it) { seen[it.id] = it; });
      window.RECORDS.__allLoaded = Object.keys(seen).map(function(k) { return seen[k]; });
      renderRecordsList(window.RECORDS.__allLoaded, r.total);
    });
  }

  function renderRecordsList(list, total) {
    var box = document.getElementById('recordsList');
    if (!box) return;
    if (!list || !list.length) {
      box.innerHTML = '<div style="padding:20px;text-align:center;color:#999;">暂无排盘记录</div>';
      return;
    }
    var html = list.map(function(r) {
      var inp = r.input_data || {};
      var disp = '';
      // 隐私降级链：云端数据显示同样走 getDisplayName（L3/AC24）
      if (window.ARCHIVE && window.ARCHIVE.getDisplayName) {
        disp = window.ARCHIVE.getDisplayName(inp);
      } else {
        disp = inp.name || inp.nickname || '未命名';
      }
      var time = (r.created_at || '').replace('T', ' ').replace('Z', '');
      var birth = (inp.year || '') + '-' + (inp.month || '') + '-' + (inp.day || '') + ' ' + (inp.hour != null ? inp.hour : '') + ':' + (inp.min != null ? inp.min : '');
      return '<div class="record-item" style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--c-line,#e5e0d5);font-size:13px;">'
        + '<span style="flex:1;min-width:0;"><b>' + esc(disp) + '</b> <span style="color:#888;">' + esc(birth) + '</span><br>'
        + '<span style="color:#aaa;font-size:12px;">保存于 ' + esc(time) + '</span></span>'
        + '<button class="btn btn-sm" onclick="window.RECORDS.viewRecord(\'' + r.id + '\')" style="padding:3px 10px;border:1px solid var(--c-line,#e5e0d5);background:var(--c-paper,#fff);cursor:pointer;border-radius:2px;">查看</button>'
        + '<button class="btn btn-sm" onclick="window.RECORDS.deleteRecord(\'' + r.id + '\')" style="padding:3px 10px;border:1px solid #d8b0b0;background:#fdf5f5;cursor:pointer;border-radius:2px;color:#b04a4a;">删除</button>'
        + '</div>';
    }).join('');
    // 分页信息 + 加载更多（P2-02）
    var totalN = (total != null) ? total : list.length;
    var showN = list.length;
    if (showN < totalN) {
      html += '<div style="padding:10px;text-align:center;font-size:12px;color:#888;">'
        + '已显示 ' + showN + ' / ' + totalN + ' 条'
        + '<button onclick="window.RECORDS.loadMoreRecords()" style="margin-left:10px;padding:4px 14px;border:1px solid var(--c-line,#e5e0d5);background:var(--c-paper,#fff);cursor:pointer;border-radius:2px;font-size:12px;">加载更多</button>'
        + '</div>';
    } else {
      html += '<div style="padding:8px;text-align:center;font-size:12px;color:#aaa;">共 ' + showN + ' 条</div>';
    }
    box.innerHTML = html;
  }

  function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ===== 查看单条（AC11）=====
  function viewRecord(id) {
    if (!sb) return;
    sb.from('paipan_records').select('*').eq('id', id).single().then(function(res) {
      if (res.error || !res.data) { alert('记录不存在或无权访问'); return; }
      showRecordDetail(res.data);
    }).catch(function() { alert('加载失败'); });
  }

  function showRecordDetail(r) {
    var inp = r.input_data || {};
    var res = r.result_data || {};
    var disp = '';
    if (window.ARCHIVE && window.ARCHIVE.getDisplayName) {
      disp = window.ARCHIVE.getDisplayName(inp);
    } else {
      disp = inp.name || inp.nickname || '未命名';
    }
    var detail = document.getElementById('recordDetail');
    var overlay = document.getElementById('recordDetailOverlay');
    if (!detail) return;
    var html = '<div style="padding:16px;">'
      + '<div style="font-size:16px;font-weight:600;margin-bottom:8px;">' + esc(disp) + '</div>'
      + '<div style="font-size:13px;color:#555;margin-bottom:12px;line-height:1.7;">'
      + '性别：' + esc(inp.gender || '') + '<br>'
      + '出生：' + esc((inp.year||'') + '-' + (inp.month||'') + '-' + (inp.day||'') + ' ' + (inp.hour!=null?inp.hour:'') + ':' + (inp.min!=null?inp.min:'')) + '<br>'
      + '日历：' + esc(inp.calendarType === 'lunar' ? '农历' : '新历') + (inp.isLeap ? '（闰月）' : '') + '<br>'
      + (inp.useSolar ? '真太阳时：' + esc((inp.prov||'') + (inp.city||'') + (inp.dist||'')) + '<br>' : '')
      + '保存时间：' + esc((r.created_at || '').replace('T',' ').replace('Z','')) + '<br>'
      + '</div>'
      + '<div style="font-size:13px;border-top:1px solid var(--c-line,#e5e0d5);padding-top:10px;">';
    // 四柱简表
    if (res.bazi) {
      var bz = res.bazi;
      html += '<div style="font-family:var(--font-display,serif);letter-spacing:.1em;font-size:15px;line-height:1.8;">'
        + '年柱 ' + esc(bz.yearGan || bz.yearPillar || '') + ' ' + esc(bz.yearZhi || '') + '　'
        + '月柱 ' + esc(bz.monthGan || bz.monthPillar || '') + ' ' + esc(bz.monthZhi || '') + '　'
        + '日柱 ' + esc(bz.dayGan || bz.dayPillar || '') + ' ' + esc(bz.dayZhi || '') + '　'
        + '时柱 ' + esc(bz.hourGan || bz.hourPillar || '') + ' ' + esc(bz.hourZhi || '') + '</div>';
    }
    html += '</div></div>';
    detail.innerHTML = html;
    if (overlay) overlay.style.display = 'flex';
  }

  function closeRecordDetail() {
    var overlay = document.getElementById('recordDetailOverlay');
    if (overlay) overlay.style.display = 'none';
  }

  // ===== 删除（AC12）=====
  function deleteRecord(id) {
    if (!sb) return;
    if (!confirm('确定删除这条排盘记录？')) return;
    sb.from('paipan_records').delete().eq('id', id).then(function(res) {
      if (res.error) { alert('删除失败：' + (res.error.message || '网络异常')); return; }
      loadAndRenderRecords(true); // 删除成功后重置到第 1 页（P2-02）
      closeRecordDetail();
    }).catch(function() { alert('删除失败'); });
  }

  // ===== 打开/关闭列表 =====
  function openRecordsPanel() {
    if (!window.AUTH.isLoggedIn() || !sb) {
      alert('请先登录');
      if (window.AUTH && typeof window.AUTH.showLoginScreen === 'function') window.AUTH.showLoginScreen();
      return;
    }
    var overlay = document.getElementById('recordsOverlay');
    if (overlay) overlay.style.display = 'flex';
    loadAndRenderRecords(true); // 每次打开重置分页到第 1 页
  }
  function closeRecordsPanel() {
    var overlay = document.getElementById('recordsOverlay');
    if (overlay) overlay.style.display = 'none';
  }

  // ===== 迁移（R5/AC16-AC20）=====
  function checkAndMigrate() {
    if (!sb) return;
    var migrated = window.AUTH.getMigratedFlag();
    var hasLocal = hasLocalRecords();
    if (migrated) {
      // 已迁移过：仍检查预置模板
      checkPresetMigrate();
      return;
    }
    if (!hasLocal) {
      // 无本地数据：直接标记已迁移，避免每次弹窗
      window.AUTH.setMigratedFlag();
      checkPresetMigrate();
      return;
    }
    // 弹窗确认（本地有数据 → 迁移）
    var n = countLocalRecords();
    if (confirm('检测到本地有 ' + n + ' 条排盘记录，是否迁移到当前账号云端？\n（迁移后可在任何设备登录取回，一条不丢）')) {
      migrateLocalToCloud().then(function(r) {
        window.AUTH.setMigratedFlag();
        console.log('迁移完成：成功 ' + r.ok + ' 条' + (r.fail ? '，失败 ' + r.fail + ' 条（可稍后自动重试）' : ''));
        checkPresetMigrate();
        loadAndRenderRecords();
      });
    } else {
      // 用户取消：本次不迁移，下次登录再提示
      checkPresetMigrate();
    }
  }

  function hasLocalRecords() {
    try {
      var raw = localStorage.getItem('bz_archives_v2');
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) && arr.length > 0;
    } catch(e) { return false; }
  }

  function countLocalRecords() {
    try {
      var raw = localStorage.getItem('bz_archives_v2');
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.length : 0;
    } catch(e) { return 0; }
  }

  function getLocalArchives() {
    try {
      var raw = localStorage.getItem('bz_archives_v2');
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch(e) { return []; }
  }

  // 指纹：档案 id（若存在）或内容摘要
  function recordFingerprint(arch) {
    if (arch && arch.id) return 'arch-' + arch.id;
    if (!arch) return '';
    return 'fp-' + [arch.name, arch.gender, arch.year, arch.month, arch.day, arch.hour, arch.min].join('-');
  }

  // 内容摘要指纹（P2-03）：与 id 无关，手动保存/迁移共用，供去重比对
  function contentFingerprint(obj) {
    if (!obj) return '';
    return 'fp-' + [obj.name, obj.gender, obj.year, obj.month, obj.day, obj.hour, obj.min].join('-');
  }

  // 迁移：逐条上传（幂等 + 失败队列）
  function migrateLocalToCloud() {
    var user = window.AUTH.getUser();
    if (!user || !sb) return Promise.resolve({ ok: 0, fail: 0 });
    var archives = getLocalArchives();
    var ok = 0, fail = 0;
    var pending = [];

    // 已存在于云端的指纹集合（去重：_fp 指纹 + 内容摘要双路，P2-03 修复）
    return sb.from('paipan_records').select('input_data').then(function(res) {
      var cloudFps = new Set();
      var cloudContent = new Set();
      (res.data || []).forEach(function(r) {
        var inp = r.input_data || {};
        if (inp._fp) cloudFps.add(inp._fp);
        // 兼容手动保存（早期版本无 _fp）：用内容摘要兜底
        cloudContent.add(contentFingerprint(inp));
      });

      var chain = Promise.resolve();
      archives.forEach(function(arch) {
        chain = chain.then(function() {
          var fp = recordFingerprint(arch);
          var fpContent = contentFingerprint(arch);
          if (cloudFps.has(fp) || cloudContent.has(fpContent)) { return; } // 云端已有 → 跳过（幂等）
          // 构造 input_data（对齐档案结构 + 指纹）
          var inputData = {
            _fp: fp,
            name: arch.name || '',
            nickname: arch.nickname || '',
            yiming: arch.yiming || '',
            gender: arch.gender || '男',
            year: arch.year, month: arch.month, day: arch.day,
            hour: arch.hour, min: arch.min || 0,
            prov: arch.prov || '', city: arch.city || '', dist: arch.dist || '',
            useSolar: !!arch.useSolar,
            calendarType: arch.calendarType || 'solar',
            isLeap: !!arch.isLeap,
            lunarMonth: arch.lunarMonth || null,
            migratedFromLocal: true,
            migratedAt: new Date().toISOString()
          };
          // result_data：优先用档案里已有快照，否则现算
          var resultData = null;
          if (arch.bazi || arch.sanyuan) {
            resultData = { bazi: arch.bazi || null, sanyuan: arch.sanyuan || null, extras: arch.extras || null, gongWeiType: arch.gongWeiType || null };
          }
          if (!resultData || !resultData.bazi) {
            try {
              var r2 = window.ALGO.paipan(inputData.name, inputData.gender, inputData.year, inputData.month, inputData.day, inputData.hour, inputData.min);
              resultData = { bazi: r2, sanyuan: null, extras: null, gongWeiType: null };
            } catch(e) { resultData = { bazi: null, sanyuan: null, extras: null, gongWeiType: null }; }
          }
          return sb.from('paipan_records').insert({ user_id: user.id, input_data: inputData, result_data: resultData })
            .then(function(res2) {
              if (res2.error) { fail++; pending.push({ input_data: inputData, result_data: resultData }); }
              else { ok++; cloudFps.add(fp); cloudContent.add(fpContent); }
            })
            .catch(function() { fail++; pending.push({ input_data: inputData, result_data: resultData }); });
        });
      });
      return chain.then(function() {
        if (pending.length) savePendingQueue(pending);
        return { ok: ok, fail: fail };
      });
    });
  }

  // ===== 预置 16 孩模板（AC19）=====
  function checkPresetMigrate() {
    if (!sb) return;
    if (window.AUTH.getPresetFlag()) return;
    if (!window.ARCHIVE || !window.ARCHIVE.PRESET_ARCHIVES) { window.AUTH.setPresetFlag(); return; }
    var presets = window.ARCHIVE.PRESET_ARCHIVES || [];
    if (!presets.length) { window.AUTH.setPresetFlag(); return; }
    var user = window.AUTH.getUser();
    var ok = 0, fail = 0;
    var chain = Promise.resolve();
    presets.forEach(function(p) {
      chain = chain.then(function() {
        var fp = 'preset-' + (p.name || '') + '-' + (p.gender || '') + '-' + (p.year||'') + '-' + (p.month||'') + '-' + (p.day||'');
        var inputData = {
          _fp: fp,
          name: p.name || '', nickname: p.nickname || '', yiming: p.yiming || '',
          gender: p.gender || '男',
          year: p.year, month: p.month, day: p.day,
          hour: p.hour, min: p.min || 0,
          prov: p.prov || '', city: p.city || '', dist: p.dist || '',
          useSolar: !!p.useSolar, calendarType: p.calendarType || 'solar',
          isLeap: !!p.isLeap, lunarMonth: p.lunarMonth || null,
          isPreset: true, migratedFromLocal: true, migratedAt: new Date().toISOString()
        };
        var resultData = null;
        try {
          var r3 = window.ALGO.paipan(inputData.name, inputData.gender, inputData.year, inputData.month, inputData.day, inputData.hour, inputData.min);
          resultData = { bazi: r3, sanyuan: null, extras: null, gongWeiType: null };
        } catch(e) { resultData = { bazi: null, sanyuan: null, extras: null, gongWeiType: null }; }
        return sb.from('paipan_records').insert({ user_id: user.id, input_data: inputData, result_data: resultData })
          .then(function(res) {
            if (res.error) fail++; else ok++;
          }).catch(function() { fail++; });
      });
    });
    chain.then(function() {
      window.AUTH.setPresetFlag();
      if (ok || fail) { /* 静默完成 */ }
      loadAndRenderRecords();
    });
  }

  // ===== 失败重试队列 =====
  function loadPendingQueue() {
    try { var raw = localStorage.getItem(pendingQueueKey); return raw ? JSON.parse(raw) : []; }
    catch(e) { return []; }
  }
  function savePendingQueue(list) {
    try { localStorage.setItem(pendingQueueKey, JSON.stringify(list)); } catch(e) {}
  }
  function enqueuePending(item) {
    var q = loadPendingQueue(); q.push(item); savePendingQueue(q);
  }
  function flushPendingQueue() {
    if (!sb) return;
    var q = loadPendingQueue();
    if (!q.length) return;
    var user = window.AUTH.getUser();
    if (!user) return;
    var remain = [];
    var chain = Promise.resolve();
    q.forEach(function(item) {
      chain = chain.then(function() {
        return sb.from('paipan_records').insert({ user_id: user.id, input_data: item.input_data, result_data: item.result_data })
          .then(function(res) { if (res.error) remain.push(item); })
          .catch(function() { remain.push(item); });
      });
    });
    chain.then(function() {
      savePendingQueue(remain);
      if (remain.length === 0) loadAndRenderRecords();
    });
  }

  // ===== 挂载全局 =====
  window.RECORDS = {
    onLogin: onLogin,
    saveCurrentPaipan: saveCurrentPaipan,
    fetchRecords: fetchRecords,
    loadAndRenderRecords: loadAndRenderRecords,
    loadMoreRecords: loadMoreRecords,
    viewRecord: viewRecord,
    closeRecordDetail: closeRecordDetail,
    deleteRecord: deleteRecord,
    openRecordsPanel: openRecordsPanel,
    closeRecordsPanel: closeRecordsPanel,
    checkAndMigrate: checkAndMigrate,
    migrateLocalToCloud: migrateLocalToCloud,
    contentFingerprint: contentFingerprint,
    recordFingerprint: recordFingerprint,
    PRESET_ARCHIVES: (window.ARCHIVE && window.ARCHIVE.PRESET_ARCHIVES) || []
  };

  // ===== v0.24.0 回归测试段（?test=1，经 __testAppend 追加到统一统计）=====
  (function() {
    if (!/[\?&]test=1(&|$)/.test(location.search)) return;
    var t = function(label, ok, detail) {
      var item = { label: label, ok: !!ok, detail: detail };
      if (window.__testAppend) window.__testAppend(item);
      else console.log((ok ? '✅ ' : '❌ ') + label, detail || '');
    };
    var base = { name: '邦顺', gender: '男', year: 1982, month: 10, day: 18, hour: 5, min: 1 };
    var fp1 = contentFingerprint(base);
    var fp2 = contentFingerprint(base);
    var fp3 = contentFingerprint({ name: '邦顺', gender: '男', year: 1982, month: 10, day: 19, hour: 5, min: 1 });
    t('v0.24 T03:contentFingerprint幂等', fp1 === fp2, fp1);
    t('v0.24 T03:不同输入不同指纹', fp1 !== fp3, fp1 + ' vs ' + fp3);
    t('v0.24 T03:内容摘要前缀fp-', fp1.indexOf('fp-') === 0, fp1);
    t('v0.24 T04:含id档案用arch-id', recordFingerprint({ id: 'abc' }) === 'arch-abc', recordFingerprint({ id: 'abc' }));
    var fp4 = recordFingerprint(base);
    t('v0.24 T04:无id档案用内容摘要', fp4 === contentFingerprint(base), fp4);
    t('v0.24 T04:无id指纹前缀fp-', fp4.indexOf('fp-') === 0, fp4);
  })();
})();
</script>
