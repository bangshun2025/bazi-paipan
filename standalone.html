<!DOCTYPE html>
<!-- 八字排盘 · 从真版 v0.21.0 | 2026-08-11 -->
<!-- v0.20.0: 常用宫位分级 — 设置页双tab(全部/常用) + ☆常用标记
<!-- v0.19.0: 隐私模式（艺名）— 全局隐私开关(默认开启/持久化) + 档案艺名字段 + 显示层脱敏(降级链 艺名→小名→匿名) -->
<!-- v0.18.0: 简0级别(五层级极简→简→中→详→全) + 四柱三垣间隔 + 龙凤胎三垣间距 + 三垣冗余纳运修复 -->
<!-- v0.17.0: 行序优化 — 主星→干支→藏干→纳音→纳运→星运→自坐→空亡→神煞 -->
<!-- v0.16.0: 去除七柱标签必填校验（允许空标签），保存按钮仅需组名即可启用 -->
<!-- v0.13.3: 编辑弹窗标签行排序调整为固定顺序 年→月→日→时→胎→命→身 -->
<!-- v0.13.2: Bug A 宫位设置面板溢出(列表区加flex约束+overflow滚动) + Bug B 拖拽排序后排盘标签行与popover联动 -->
<!-- v0.12.0: 档案编辑功能 — 修改/删除/编辑弹窗/回收站增强 -->
<!-- v0.12.0: 纳运功能 — 纳音五行十二长生（金→庚/木→甲/水→壬/火→丙/土→壬） -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>八字排盘 · 从真版</title>
<style>
  :root {
    --c-wood: #2e8b3d; --c-fire: #c83a3a; --c-earth: #c8961f; --c-metal: #d97817; --c-water: #2a6ec0;
    --c-ink: #2c2416; --c-gray: #8b7e6a; --c-line: #e0d8c8; --c-paper: #f5f0e8; --c-red: #b5343a;
    --bz-accent-twin1: #c8961f; --bz-accent-twin2: #4a7fb5;
    --bz-card-bg: #ffffff; --bz-card-border: #e8e4dc; --bz-shared-bg: #f5f2ec;
    --bz-card-shadow: 0 1px 3px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.06);
    --font-display: "Songti SC","SimSun","Noto Serif CJK SC","STSong","KaiTi",serif;
    --font-body: "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;

    /* v0.10.0 14宫位颜色 */
    --gz-info:     #4a6fa5; --gz-cognition:#3d7a5c; --gz-function: #a0522d;
    --gz-zuogong:  #c8782a; --gz-qinyuan:  #b0486a; --gz-interest: #b8962a;
    --gz-scene:    #4a80a0; --gz-persona:  #7a4a8a; --gz-client:   #c07030;
    --gz-system:   #6a7a8a; --gz-relation: #c05858; --gz-circle:   #6a7a3a;
    --gz-physio:   #b04040; --gz-memory:   #3a6a8a;
    --gz-popover-bg:   var(--c-paper);
    --gz-popover-border: var(--c-line);
    --gz-popover-shadow: 0 4px 16px rgba(0,0,0,.12);
    --gz-tag-row-bg: rgba(201,169,110,.04);
  }
  * { margin:0;padding:0;box-sizing:border-box; }
  body { background:#e8e0d3; min-height:100vh; display:flex; justify-content:center; align-items:flex-start; padding:12px; font-family:var(--font-body); }
  .page { width:100%; max-width:1340px; background:var(--c-paper); border:1.5px solid var(--c-line); border-radius:2px; padding:16px 18px 20px; box-shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.08); }

  /* ===== 输入表单 ===== */
  .input-section { margin-bottom:16px; padding-bottom:14px; border-bottom:1px solid var(--c-line); }
  .input-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .input-row label { font-size:13px; color:var(--c-gray); white-space:nowrap; }
  .input-row input, .input-row select { font-family:var(--font-display); font-size:14px; padding:4px 8px; border:1px solid var(--c-line); border-radius:2px; background:var(--c-paper); color:var(--c-ink); }
  .input-row input[type=number] { width:58px; text-align:center; }
  .input-row .btn { padding:5px 16px; background:var(--c-ink); color:var(--c-paper); border:none; border-radius:2px; cursor:pointer; font-size:13px; letter-spacing:.1em; font-family:var(--font-display); }
  .input-row .btn:hover { background:var(--c-red); }
  .btn-privacy.privacy-on { background:var(--c-red); color:var(--c-paper); border-color:var(--c-red); }
  .btn-arch { font-size:14px; padding:2px 6px; border:1px solid var(--c-line); border-radius:2px; background:var(--c-paper); cursor:pointer; line-height:1; }
  .btn-arch:hover { background:var(--c-ink); }
  .btn-ai { font-size:12px; padding:4px 10px; border:1px dashed var(--c-gray); border-radius:2px; background:var(--c-paper); cursor:pointer; font-family:var(--font-body); color:var(--c-gray); white-space:nowrap; }
  .btn-ai:hover { border-color:var(--c-red); color:var(--c-red); }

  /* AI录入弹窗 */
  .ai-overlay { display:none; position:fixed; top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.35);z-index:999;justify-content:center;align-items:center; }
  .ai-overlay.show { display:flex; }
  .ai-dialog { background:var(--c-paper); border:1px solid var(--c-line); border-radius:4px; padding:20px 24px; width:90%;max-width:520px; box-shadow:0 4px 24px rgba(0,0,0,.15); }
  .ai-dialog h3 { font-family:var(--font-display); font-size:18px; margin-bottom:6px; color:var(--c-ink); }
  .ai-dialog .hint { font-size:13px; color:var(--c-gray); margin-bottom:12px; line-height:1.5; }
  .ai-dialog textarea { width:100%; height:80px; font-size:14px; font-family:var(--font-body); padding:10px; border:1px solid var(--c-line); border-radius:2px; resize:vertical; background:var(--c-paper); color:var(--c-ink); }
  .ai-dialog .ai-btns { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
  .ai-dialog .ai-btns button { font-size:14px; padding:6px 18px; border-radius:2px; cursor:pointer; font-family:var(--font-display); }
  .ai-dialog .btn-ok { background:var(--c-ink); color:var(--c-paper); border:none; }
  .ai-dialog .btn-ok:hover { background:var(--c-red); }
  .ai-dialog .btn-cancel { background:transparent; color:var(--c-gray); border:1px solid var(--c-line); }
  .ai-dialog .btn-cancel:hover { background:var(--c-line); }
  .ai-dialog .parse-result { font-size:12px; color:var(--c-gray); margin-top:8px; min-height:18px; }

  /* 双胞胎对比：三栏布局 — 盘式+大宝 | 小宝 | 大运流年 */
  .twin-wrap { display:block; overflow-x:hidden; }
  .twin-wrap .chart-wrap { margin-bottom:4px; }
  .twin-wrap .chart { width:100%; min-width:auto; table-layout:fixed; }
  .twin-wrap .chart th, .twin-wrap .chart td { padding:2px 3px; font-size:13px; }
  .twin-wrap .chart .rl { width:54px; min-width:54px; white-space:nowrap; }
  .twin-wrap .chart .twin-col-sep { width:3px; min-width:3px; padding:0; background:var(--c-line); opacity:0.35; }
  .twin-wrap .chart .sep { border-left:2px solid var(--c-red); }
  .twin-wrap .chart .col-ln { border-left:1px solid var(--c-line); }
  .twin-wrap h3 { font-family:var(--font-display); font-size:15px; text-align:center; margin:0; padding:1px 0; border-bottom:2px solid var(--c-line); letter-spacing:.08em; }
  .twin-wrap .twin-header-dabao h3 { color:var(--c-ink); }
  .twin-wrap .twin-header-xiaobao h3 { color:var(--c-red); border-bottom-color:var(--c-red); }
  .twin-wrap .twin-header-dayun h3 { color:var(--c-gray); }
  .twin-wrap .twin-sub-hd td { padding:3px 3px !important; }
  .twin-wrap .luck-section-wrap { margin-top:4px; }

  /* ===== v0.5.0 双胞胎卡片式版面 ===== */
  /* CSS 变量已在 :root 定义：--bz-accent-twin1/2, --bz-card-bg, --bz-card-border, --bz-shared-bg, --bz-card-shadow */

  /* 卡片容器 */
  .bz-twin-cards { display:flex; gap:24px; align-items:flex-start; margin-bottom:16px; }
  .bz-twin-card { flex:1; min-width:360px; background:var(--bz-card-bg); border:1px solid var(--bz-card-border);
    border-radius:4px; box-shadow:var(--bz-card-shadow); overflow:hidden; }

  /* 标识色条 */
  .bz-twin-card .bz-card-accent { height:6px; }
  .bz-twin-card.twin-1 .bz-card-accent { background:var(--bz-accent-twin1); }
  .bz-twin-card.twin-2 .bz-card-accent { background:var(--bz-accent-twin2); }

  /* 卡片标题 */
  .bz-twin-card .bz-card-title { padding:10px 16px 8px; font-family:var(--font-body); font-size:16px;
    font-weight:500; letter-spacing:.08em; }
  .bz-twin-card.twin-1 .bz-card-title { color:var(--bz-accent-twin1); }
  .bz-twin-card.twin-2 .bz-card-title { color:var(--bz-accent-twin2); }

  /* 卡片辅助信息行 */
  .bz-twin-card .bz-card-meta { padding:0 16px 8px; font-size:13px; color:#8b7e6a; font-family:var(--font-body); }

  /* 卡片内表格 */
  .bz-twin-card .chart { min-width:auto; }
  .bz-twin-card .chart th, .bz-twin-card .chart td { padding:3px 4px; }

  /* 差异高亮 */
  .bz-twin-card.twin-1 .bz-diff { background:rgba(200,150,31,.06); }
  .bz-twin-card.twin-2 .bz-diff { background:rgba(74,127,181,.06); }

  /* 共享区 */
  .bz-twin-shared { margin-top:4px; background:var(--bz-shared-bg); border-radius:4px;
    border-left:3px solid #d0c9b8; padding:14px 18px; }

  /* 共享区大运流年当前高亮 → 暖金色 */
  .bz-twin-shared .cell.cc { background:rgba(200,150,31,.08); }
  .bz-twin-shared .luck-row.hd .cell.cc { background:rgba(200,150,31,.12); }

  /* ===== v0.6.0 卡片内独立大运区 ===== */
  .bz-card-luck { border-top:1px solid #e8e4dc; background:#fafaf6; padding:12px 14px; }
  .bz-card-luck-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .bz-card-luck-label { font-family:"PingFang SC",sans-serif; font-size:13px; color:#8b7e6a; }
  .bz-card-luck-info { font-family:"PingFang SC",sans-serif; font-size:12px; color:#b0a590; }

  /* 大运导航 pills */
  .bz-dayun-nav-wrapper { position:relative; }
  .bz-dayun-nav-wrapper::after { content:''; position:absolute; right:0; top:0; bottom:0; width:24px; background:linear-gradient(to right, transparent, #fafaf6); pointer-events:none; }
  .bz-dayun-nav { display:flex; gap:6px; overflow-x:auto; scroll-behavior:smooth; -webkit-overflow-scrolling:touch; scrollbar-width:thin; scrollbar-color:#d0c8b8 transparent; padding:6px 0; }
  .bz-dayun-pill { flex-shrink:0; min-width:58px; padding:6px 8px; text-align:center; font-family:"Songti SC","SimSun",serif; font-size:18px; font-weight:700; color:#2c2416; border:1px solid #e0d8c8; border-radius:4px; background:#fff; cursor:pointer; transition:background .15s; }
  .bz-dayun-pill:hover { background:#f5f2ec; }
  .bz-dayun-pill .pill-age { display:block; font-size:12px; font-weight:400; color:#8b7e6a; margin-top:2px; }
  .bz-twin-card.twin-1 .bz-dayun-pill.selected { background:#c8961f; color:#fff; border-color:#c8961f; }
  .bz-twin-card.twin-1 .bz-dayun-pill.selected .pill-age { color:rgba(255,255,255,.7); }
  .bz-twin-card.twin-2 .bz-dayun-pill.selected { background:#4a7fb5; color:#fff; border-color:#4a7fb5; }
  .bz-twin-card.twin-2 .bz-dayun-pill.selected .pill-age { color:rgba(255,255,255,.7); }

  /* 选中大运详情 */
  .bz-dayun-detail { margin-top:10px; padding:8px 10px; background:#fff; border-radius:4px; border:1px solid #e8e4dc; }
  .bz-dy-main { font-family:"Songti SC","SimSun",serif; font-size:22px; font-weight:700; margin-bottom:4px; }
  .bz-dy-main .bz-dy-na-yin { font-size:13px; font-weight:400; color:#8b7e6a; margin-left:8px; font-family:"PingFang SC",sans-serif; }
  .bz-dy-shishen { font-size:14px; color:#2c2416; margin-bottom:10px; display:flex; gap:12px; align-items:center; }
  .bz-dy-shishen .bz-dy-age { color:#8b7e6a; font-size:12px; font-family:"PingFang SC",sans-serif; }

  /* 流年网格 */
  .bz-liunian-grid { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
  .bz-liunian-item { padding:3px 8px; font-size:14px; font-family:"Songti SC",serif; cursor:pointer; border-radius:3px; }
  .bz-liunian-item:hover { background:#f5f2ec; }

  /* 流年展开详情 */
  .bz-liunian-detail { margin-top:6px; min-height:18px; }
  .bz-ln-expand { font-size:13px; color:#8b7e6a; font-family:"PingFang SC",sans-serif; padding:4px 8px; background:rgba(201,169,110,.06); border-radius:3px; }

  /* 模式切换 tab */
  .bz-twin-tabs { display:flex; gap:0; margin-bottom:18px; }
  .bz-twin-tab { padding:6px 16px; font-size:13px; cursor:pointer; background:none;
    border:1px solid #e0d8c8; color:#8b7e6a; font-family:var(--font-body); }
  .bz-twin-tab:first-child { border-radius:3px 0 0 3px; }
  .bz-twin-tab:last-child { border-radius:0 3px 3px 0; border-left:none; }
  .bz-twin-tab.active { background:#2c2416; color:#f5f0e8; border-color:#2c2416; }

  /* 三模式切换 — 纯 CSS */
  .bz-twin-cards .bz-twin-card.twin-2 { display:block; }
  .bz-twin-cards.mode-twin1 .bz-twin-card.twin-2 { display:none; }
  .bz-twin-cards.mode-twin1 { justify-content:center; }
  .bz-twin-cards.mode-twin1 .bz-twin-card.twin-1 { flex:0 1 55%; max-width:480px; }
  .bz-twin-cards.mode-twin2 .bz-twin-card.twin-1 { display:none; }
  .bz-twin-cards.mode-twin2 { justify-content:center; }
  .bz-twin-cards.mode-twin2 .bz-twin-card.twin-2 { flex:0 1 55%; max-width:480px; }

  /* 三垣折叠 */
  .bz-twin-card .bz-sanyuan-toggle { font-size:13px; color:#8b7e6a; cursor:pointer;
    padding:6px 16px; border-top:1px solid var(--bz-card-border);
    font-family:var(--font-body); user-select:none; }
  .bz-twin-card .bz-sanyuan-toggle:hover { color:var(--c-ink); }
  .bz-twin-card .bz-sanyuan-area.collapsed { display:none; }

  /* 窄屏响应式 */
  @media (max-width:900px) {
    .bz-twin-cards { flex-direction:column; }
    .bz-twin-cards .bz-twin-card { flex:1 1 auto; min-width:auto; }
    .bz-twin-cards.mode-twin1 .bz-twin-card.twin-1,
    .bz-twin-cards.mode-twin2 .bz-twin-card.twin-2 { flex:1 1 auto; max-width:none; }
  }

  /* 顶部 */
  .top-bar { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:16px; border-bottom:1px solid var(--c-line); padding-bottom:12px; }
  .person-info { font-family:var(--font-display); font-size:22px; color:var(--c-ink); letter-spacing:.08em; }
  .person-info b { font-size:26px; margin-right:6px; }
  .person-info .meta { color:var(--c-gray); font-size:17px; }
  .person-info .sex-tag { font-family:var(--font-display); font-size:17px; color:var(--c-red); margin-left:8px; letter-spacing:.15em; }

  /* 主盘 */
  .chart-wrap { width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; margin-bottom:12px; position:relative; }
  .chart { width:100%; min-width:680px; border-collapse:collapse; table-layout:auto; }
  .chart th, .chart td { border:0.5px solid var(--c-line); text-align:center; vertical-align:middle; font-family:var(--font-display); padding:3px 5px; }
  .chart td.rl, .chart th.rl { width:54px; min-width:54px; background:rgba(201,169,110,.06); font-size:14px; color:var(--c-gray); letter-spacing:.1em; font-weight:500; padding:3px 2px; white-space:nowrap; }
  .chart tr.hd th { font-size:18px; color:var(--c-gray); font-weight:500; background:rgba(201,169,110,.04); padding:6px 3px; }
  .chart .sep { border-left:1.5px solid rgba(181,52,58,.4) !important; }
  .chart .rs td { font-size:18px; color:var(--c-ink); font-weight:500; }
  .chart .rg td { font-size:28px; font-weight:700; padding:1px 4px; line-height:1.1; }
  .chart .rh td { font-size:17px; color:var(--c-ink); line-height:1.6; padding:5px 4px; }
  .chart .rn td { font-size:17px; color:var(--c-gray); letter-spacing:.05em; }
  .chart .rm td { font-size:17px; color:var(--c-ink); padding:3px 3px; }
  .chart .rm .rl { font-size:17px; }

  /* 简分级别：五层级循环切换 L0(极简)→L1(简)→L2(中)→L3(详)→L4(全) */

  /* L0 → 极简：隐藏所有扩展信息行 */
  .chart.level-0 tr[data-row-type~="xingyun"],
  .chart.level-0 tr[data-row-type~="zizuo"],
  .chart.level-0 tr[data-row-type~="nayin"],
  .chart.level-0 tr[data-row-type~="nayun"],
  .chart.level-0 tr[data-row-type~="kongwang"],
  .chart.level-0 tr[data-row-type~="shensha"] { display:none; }

  /* L1 → 简：隐藏纳音/纳运/空亡/神煞（仅星运+自坐可见） */
  .chart.level-1 tr[data-row-type~="nayin"],
  .chart.level-1 tr[data-row-type~="nayun"],
  .chart.level-1 tr[data-row-type~="kongwang"],
  .chart.level-1 tr[data-row-type~="shensha"] { display:none; }

  /* L2 → 中：隐藏空亡+神煞 */
  .chart.level-2 tr[data-row-type~="kongwang"],
  .chart.level-2 tr[data-row-type~="shensha"] { display:none; }

  /* L3 → 详：仅隐藏神煞 */
  .chart.level-3 tr[data-row-type~="shensha"] { display:none; }

  /* L4 → 全：无隐藏（空规则块保留以便理解） */

  /* 四柱-三垣分隔行 */
  tr.sanyuan-sep { height: 0.75em; }
  tr.sanyuan-sep td { padding: 0; border-bottom: 2px solid var(--c-line); }

  /* 龙凤胎卡片三垣区间距 */
  .bz-twin-card .bz-sanyuan-area { margin-top: 0.75em; }

  .btn-simple { font-family:var(--font-display); font-size:13px; padding:4px 10px; border:1px solid var(--c-line); border-radius:2px; background:var(--c-paper); color:var(--c-ink); cursor:pointer; white-space:nowrap; margin-left:8px; letter-spacing:.08em; }
  .btn-simple.active { background:var(--c-ink); color:var(--c-paper); }

  .wood { color:var(--c-wood); } .fire { color:var(--c-fire); } .earth { color:var(--c-earth); }
  .metal { color:var(--c-metal); } .water { color:var(--c-water); }

  .col-dy { background:rgba(200,58,58,.03); }
  .col-ln { background:rgba(200,58,58,.06); }

  /* 信息行 */
  .info-row { display:flex; justify-content:space-between; align-items:center; padding:12px 0; font-family:var(--font-display); font-size:14px; color:var(--c-ink); }
  .info-row .label { color:var(--c-gray); margin-right:6px; }
  .btn-back { font-family:var(--font-display); font-size:13px; padding:4px 10px; border:1px solid var(--c-line); border-radius:2px; background:var(--c-paper); color:var(--c-ink); cursor:pointer; white-space:nowrap; }
  .btn-back:hover { background:var(--c-ink); color:var(--c-paper); }
  .meta-tag { display:inline-block; font-size:13px; padding:1px 6px; margin-left:6px; border-radius:2px; background:rgba(201,169,110,.1); color:var(--c-gray); white-space:nowrap; letter-spacing:.04em; }
  .meta-tag.true-solar { color:var(--c-red); }

  /* ===== 左右并排布局 ===== */
  .body-cols { display:flex; gap:16px; align-items:flex-start; }
  .main-col { flex:0 0 auto; min-width:0; }
  .luck-col { flex:1 1 auto; min-width:380px; position:sticky; top:12px; }
  .luck-section { border:0.5px solid var(--c-line); overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .luck-table { display:table; width:100%; min-width:620px; border-collapse:collapse; }
  .luck-row { display:table-row; }
  .luck-row .cell { display:table-cell; padding:3px 5px; text-align:center; vertical-align:middle; font-family:var(--font-display); font-size:18px; border-right:0.5px solid var(--c-line); border-bottom:0.5px solid var(--c-line); white-space:nowrap; min-width:52px; }

<div class="page">

      <span id="inMonthCell"><input type="number" id="inMonth" value="10" min="1" max="12" style="width:48px;"></span> <span style="font-size:13px;">月</span>
      <input type="number" id="inDay" value="18" min="1" max="31" style="width:48px;"> <span style="font-size:13px;">日</span>
      <span id="inLeapGroup" style="display:none;"><label style="font-size:12px;"><input type="checkbox" id="inLeap">闰月</label></span>
      <input type="number" id="inHour" value="5" min="0" max="23" style="width:48px;"> <span style="font-size:13px;">时</span>
      <input type="number" id="inMin" value="1" min="0" max="59" style="width:48px;"> <span style="font-size:13px;">分</span>

      <label>市</label><select id="inCity" onchange="APP.onCityChange()" style="width:96px;"><option value="">—</option></select>
      <label>区县</label><select id="inDist" style="width:96px;"><option value="">—</option></select>
      <span id="liveSolar" style="font-size:11px;color:var(--c-gray);margin:0 6px;white-space:nowrap;font-family:var(--font-display);"></span>
      </span>
      <button class="btn" onclick="APP.doPaipan()">排 盘</button>
      <button class="btn" onclick="ARCHIVE.openArchivePanel()" style="padding:5px 12px;background:var(--c-paper);color:var(--c-ink);border:1px solid var(--c-line);border-radius:2px;cursor:pointer;font-size:13px;letter-spacing:.05em;font-family:var(--font-display);">📋 档案</button>
      <button class="btn btn-privacy" id="btnPrivacy" onclick="ARCHIVE.togglePrivacy()" style="padding:5px 12px;background:var(--c-paper);color:var(--c-ink);border:1px solid var(--c-line);border-radius:2px;cursor:pointer;font-size:13px;letter-spacing:.05em;font-family:var(--font-display);">🔒 隐私</button>

      <button class="btn-ai" onclick="APP.showAiInput()">🤖 AI录入</button>
    </div>
  </div>

  <!-- ===== AI录入弹窗 ===== -->
  <div class="ai-overlay" id="aiOverlay">
    <div class="ai-dialog">

      <div class="hint">输入包含姓名、性别、出生日期、时间和地点的自然语句<br>例：邦顺 男 1982年10月18日早上5点 广西南宁</div>

      </div>
    </div>

        <button class="btn-cancel" onclick="ARCHIVE.hideTrash()">关闭</button>
        <button class="btn-ok" onclick="ARCHIVE.emptyTrash()">清空回收站</button>
      </div>
    </div>
  </div>

function monthDays(info, m, isLeap, leapMonth) {
  if (isLeap) {
    return ((info >> 20) & 1) ? 30 : 29;
  }
  return ((info >> (3 + m)) & 1) ? 30 : 29;
}

// 日期规范化（跨月跨年）
function normalizeDate(y, m, d) {
  var daysInMonth = [0,31,28,31,30,31,30,31,31,30,31,30,31];
  if ((y % 4 === 0 && y % 100 !== 0) || y % 400 === 0) daysInMonth[2] = 29;
  while (d > daysInMonth[m]) {
    d -= daysInMonth[m];
    m++;
    if (m > 12) { m = 1; y++; }
    if ((y % 4 === 0 && y % 100 !== 0) || y % 400 === 0) daysInMonth[2] = 29;
    else daysInMonth[2] = 28;
  }
  return { y: y, m: m, d: d };
}

// 农历转公历（查表法）
function lunarToSolar(ly, lm, ld, isLeap) {
  var idx = ly - 1600;
  if (idx < 0 || idx >= LUNAR_INFO.length) return null;
  var info = LUNAR_INFO[idx];
  var leapMonth = info & 0xF;
  var ny = LUNAR_NEW_YEAR[idx];
  var solarY = ly, solarM = ny[0], solarD = ny[1];
  if (isLeap && leapMonth !== lm) isLeap = false;
  for (var m = 1; m < lm; m++) {
    solarD += monthDays(info, m, false, leapMonth);
    if (m === leapMonth) { solarD += monthDays(info, m, true, leapMonth); }
  }
  if (isLeap) {
    solarD += monthDays(info, lm, false, leapMonth);
  }
  solarD += ld - 1;
  return normalizeDate(solarY, solarM, solarD);
}

// 计算一年中的第几天
function dayOfYear(y, m, d) {
  const daysInMonth = [0, 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  if ((y % 4 === 0 && y % 100 !== 0) || y % 400 === 0) daysInMonth[2] = 29;
  let doy = d;
  for (let i = 1; i < m; i++) doy += daysInMonth[i];
  return doy;
}

// 均时差（Equation of Time）：返回分钟数，正值=真太阳超前于平太阳
// Spencer, 1971 公式
function equationOfTime(y, m, d) {
  const doy = dayOfYear(y, m, d);
  const B = (doy - 1) * 2 * Math.PI / 365;
  const eot = 229.18 * (0.000075 + 0.001868 * Math.cos(B) - 0.032077 * Math.sin(B)
                      - 0.014615 * Math.cos(2*B) - 0.040849 * Math.sin(2*B));
  return eot;
}

function trueSolarTime(y, m, d, h, mi, lng) {
  // 经度修正：每度差4分钟，北京时间基准东经120°
  const lngOffset = (lng - 120) * 4;
  // 均时差（Equation of Time）：太阳真位置与平太阳的偏差
  const eot = equationOfTime(y, m, d);
  const offsetMin = lngOffset + eot;
  const totalMin = h * 60 + mi + offsetMin;
  // 处理跨日
  let adjMin = totalMin;
  let adjD = d, adjM = m, adjY = y;
  while (adjMin < 0) { adjMin += 1440; adjD -= 1; }
  while (adjMin >= 1440) { adjMin -= 1440; adjD += 1; }
  // 处理月份边界
  const daysInMonth = new Date(adjY, adjM, 0).getDate();
  if (adjD < 1) { adjM -= 1; if (adjM < 1) { adjM = 12; adjY -= 1; } adjD = new Date(adjY, adjM, 0).getDate(); }
  else if (adjD > daysInMonth) { adjD -= daysInMonth; adjM += 1; if (adjM > 12) { adjM = 1; adjY += 1; } }
  const adjH = Math.floor(adjMin / 60);
  const adjMi = Math.round(adjMin % 60);
  return {
    y: adjY, m: adjM, d: adjD, h: adjH, mi: adjMi,
    offsetMin: offsetMin,
    orig: { y, m, d, h, mi }

function getSolarTerm(y, n) {

// ============ 月柱 ============
function monthPillar(y, m, d, h, mi, yearGan) {
  // 根据出生日期确定在哪个月（基于节气）
  const birth = new Date(y, m - 1, d, h || 0, mi || 0);
  for (let i = 0; i < 12; i++) {
    const termIdx = MONTH_TERM[i];
    const stY = (termIdx === 0 && i === 11) ? y + 1 : y; // 小寒在次年1月
    const st = getSolarTerm(stY, termIdx); // 本月起始节气
    const stDate = new Date(st.getFullYear(), st.getMonth(), st.getDate());
    
    // 下月起始节气
    const nextI = (i + 1) % 12;
    const nextTerm = MONTH_TERM[nextI];
    let nextY = y;
    if (nextTerm <= termIdx) nextY = y + 1;
    const nextSt = getSolarTerm(nextY, nextTerm);
    const nextDate = new Date(nextSt.getFullYear(), nextSt.getMonth(), nextSt.getDate());
    
    if (birth >= stDate && birth < nextDate) {
      const zhi = DZ[(i + 2) % 12]; // 寅月=寅, 卯月=卯...
      const ganStart = WU_HU_DUN[yearGan];
      const gan = TG[(TG.indexOf(ganStart) + i) % 10];
      return { gan, zhi, monthIdx: i };
    }
  }
  // fallback: 丑月
  const zhi = '丑', ganStart = WU_HU_DUN[yearGan];
  return { gan: TG[(TG.indexOf(ganStart) + 11) % 10], zhi, monthIdx: 11 };
}

  const tyMap = { '甲':'丑未','戊':'丑未','庚':'丑未','乙':'子申','己':'子申','丙':'亥酉','丁':'亥酉','辛':'午寅','壬':'巳卯','癸':'巳卯' };
  const ty = tyMap[riGan] || '';
  if (ty.includes(riZhi)) a.push('天乙贵');
  if (ty.includes(nianZhi)) a.push('天乙贵');
  if (ty.includes(yueZhi)) a.push('天乙贵');

  // 文昌
  const wcMap = { '甲':'巳','乙':'午','丙':'申','丁':'酉','戊':'申','己':'酉','庚':'亥','辛':'子','壬':'寅','癸':'卯' };
  if (wcMap[riGan] === riZhi) a.push('文昌');

  // 禄神
  const luMap = { '甲':'寅','乙':'卯','丙':'巳','丁':'午','戊':'巳','己':'午','庚':'申','辛':'酉','壬':'亥','癸':'子' };
  if (luMap[riGan] === riZhi) a.push('禄神');

  // 驿马
  const ymMap = { '寅午戌':'申','巳酉丑':'亥','申子辰':'寅','亥卯未':'巳' };

    if (k.includes(nianZhi) && v === riZhi) a.push('驿马');
  }

  // 桃花
  const thMap = { '寅午戌':'卯','巳酉丑':'午','申子辰':'酉','亥卯未':'子' };
  for (const [k, v] of Object.entries(thMap)) {
    if (k.includes(riZhi) && v === riZhi) a.push('桃花');
  }

  // 华盖
  const hgMap = { '寅午戌':'戌','巳酉丑':'丑','申子辰':'辰','亥卯未':'未' };
  for (const [k, v] of Object.entries(hgMap)) {
    if (k.includes(riZhi) && v === riZhi) a.push('华盖');

  if (gyMap[riGan] === riZhi) a.push('国印贵');

  return a.length > 0 ? a.slice(0, 3).join('<br>') : '';
}

// ============ 胎元 ============
function taiYuan(yueGan, yueZhi) {
  const gIdx = (TG.indexOf(yueGan) + 1) % 10;
  const zIdx = (DZ.indexOf(yueZhi) + 3) % 12;
  return { gan: TG[gIdx], zhi: DZ[zIdx] };
}

// 地支序号：寅=1, 卯=2, ..., 子=11, 丑=12
function dzNum(zhi) { return ((DZ.indexOf(zhi) + 10) % 12) + 1; }
// 序号→地支
function numZhi(n) { return DZ[(n + 1) % 12]; }

// ============ 命宫 ============
// 命宫地支: (14 - 月支数 - 时支数)，寅=1...丑=12
function mingGong(yueZhi, shiZhi, nianGan) {
  let n = 14 - dzNum(yueZhi) - dzNum(shiZhi);
  if (n <= 0) n += 12;
  if (n > 12) n -= 12;
  const zhi = numZhi(n);
  const ms = WU_HU_DUN[nianGan];
  const gan = TG[(TG.indexOf(ms) + (n - 1)) % 10];
  return { gan, zhi };
}

// ============ 身宫 ============
// 身宫地支: 时支对冲（时支 + 6），天干按五虎遁
function shenGong(yueZhi, shiZhi, nianGan) {
  // 身宫 = (月序数 + 时辰序数) % 12  (0→12)
  // 月序数: dzNum (寅=1..丑=12), 时辰序数: DZ.indexOf+1 (子=1..亥=12)
  let n = (dzNum(yueZhi) + DZ.indexOf(shiZhi) + 1) % 12;
  if (n === 0) n = 12;
  const zhi = numZhi(n);
  const ms = WU_HU_DUN[nianGan];
  const gan = TG[(TG.indexOf(ms) + (n - 1)) % 10];
  return { gan, zhi };
}

// ============ 大运 & 起运 ============
function qiYunDays(birth, monthZhi, shun) {
  // 精确到小时的出生到上/下一个节气的天数
  // 使用 Date.UTC 对齐 getSolarTerm 的 "BJT as UTC" 约定
  const y = birth.getFullYear(), mo = birth.getMonth() + 1, d = birth.getDate();
  const birthMs = Date.UTC(y, mo - 1, d, birth.getHours(), birth.getMinutes());

  // 找到出生月对应的节气索引
  const monthIdx = (DZ.indexOf(monthZhi) + 10) % 12; // 寅月=0
  const termIdx = MONTH_TERM[monthIdx];

  if (shun) {
    const nextI = (monthIdx + 1) % 12;
    const nextTerm = MONTH_TERM[nextI];
    let nextY = y;
    if (nextTerm <= termIdx) nextY = y + 1;
    const st = getSolarTerm(nextY, nextTerm);
    return (st.getTime() - birthMs) / 86400000;
  } else {
    const st = getSolarTerm(y, termIdx);
    return (birthMs - st.getTime()) / 86400000;
  }
}

function computeDaYun(gender, nianGan, yueGan, yueZhi, birth) {
  const yang = '甲丙戊庚壬'.includes(nianGan);
  const male = gender === '男';
  const shun = (male && yang) || (!male && !yang);

  const days = qiYunDays(birth, yueZhi, shun);
  const totalMonths = days / 3 * 12; // 3天=1年=12个月
  const qyYears = Math.floor(totalMonths / 12);
  const qyMonths = Math.floor(totalMonths % 12);
  const fractionalMonth = totalMonths - Math.floor(totalMonths);
  const fractionalDays = fractionalMonth * 30;
  const qyDays = Math.floor(fractionalDays);
  let qyHours = Math.round((fractionalDays - qyDays) * 24);
  const qyDaysFinal = qyDays;

  const yGIdx = TG.indexOf(yueGan);
  const yZIdx = DZ.indexOf(yueZhi);

  const daYun = [];
  for (let i = 0; i < 10; i++) {
    const off = shun ? i + 1 : -(i + 1);
    let gIdx = (yGIdx + off) % 10;
    let zIdx = (yZIdx + off) % 12;
    if (gIdx < 0) gIdx += 10;
    if (zIdx < 0) zIdx += 12;
    const startAge = Math.round(totalMonths / 12) + 1 + i * 10;
    const startYear = birth.getFullYear() + startAge - 1;
    daYun.push({ gan: TG[gIdx], zhi: DZ[zIdx], startAge, startYear });
  }

  return { daYun, qiYun: { years: qyYears, months: qyMonths, days: qyDaysFinal, hours: qyHours, totalMonths }, shun };
}

// ============ 流年干支 ============
function liuNianJZ(y) {
  const idx = (y - 4) % 60;
  return TG[idx % 10] + DZ[idx % 12];
}

// ============ 人元司令 ============
// 每月节后第几天开始，由哪个天干司令
// 格式：[天数累计, 天干] — 例如 [[9,'辛'],[12,'丁'],[30,'戊']] 表示辛司令1-9日，丁10-12日，戊13-30日
const REN_YUAN = {
  '寅':[[7,'戊'],[14,'丙'],[30,'甲']],
  '卯':[[10,'甲'],[30,'乙']],
  '辰':[[9,'乙'],[12,'癸'],[30,'戊']],
  '巳':[[5,'戊'],[14,'庚'],[30,'丙']],
  '午':[[10,'丙'],[19,'己'],[30,'丁']],
  '未':[[9,'丁'],[12,'乙'],[30,'己']],
  '申':[[7,'戊'],[14,'壬'],[30,'庚']],
  '酉':[[10,'庚'],[30,'辛']],
  '戌':[[9,'辛'],[12,'丁'],[30,'戊']],
  '亥':[[7,'戊'],[12,'甲'],[30,'壬']],
  '子':[[10,'壬'],[30,'癸']],
  '丑':[[9,'癸'],[12,'辛'],[30,'己']]
};

function renYuanSiLing(y, m, d) {
  // 遍历月节气找到当前月份，算节后第几天
  const birth = new Date(y, m-1, d);
  for (let mi = 0; mi < 12; mi++) {
    const termIdx = MONTH_TERM[mi];
    let stY = y;
    if (termIdx === 0 && mi === 11) {
      // 丑月（小寒=termIdx 0）：1月出生→小寒在同一年 y；其他月份→小寒在 y+1
      stY = (m === 1) ? y : y + 1;
    }
    const st = getSolarTerm(stY, termIdx);
    const stDate = new Date(st.getUTCFullYear(), st.getUTCMonth(), st.getUTCDate());
    const nextMi = (mi + 1) % 12;
    const nextTerm = MONTH_TERM[nextMi];
    let nextY = y;
    if (nextTerm <= termIdx) nextY = y + 1;
    const nextSt = getSolarTerm(nextY, nextTerm);
    const nextDate = new Date(nextSt.getUTCFullYear(), nextSt.getUTCMonth(), nextSt.getUTCDate());
    if (birth >= stDate && birth < nextDate) {
      const daysAfter = Math.floor((birth - stDate) / 86400000);
      const monthZhi = DZ[(mi + 2) % 12]; // 寅月=寅...
      const termName = S_TERM_NAME[termIdx];
      const ry = REN_YUAN[monthZhi];
      if (!ry) return '';
      for (const [maxDay, gan] of ry) {
        if (daysAfter <= maxDay) return '人元司令：' + gan + '（' + termName + '后 ' + daysAfter + ' 日）';
      }
      return '人元司令：' + ry[ry.length-1][1] + '（' + termName + '后 ' + daysAfter + ' 日）';
    }
  }
  return '';
}

// ============ 主计算函数 ============
function paipan(name, gender, y, m, d, h, mi) {
  // 1. 年柱（考虑立春）
  const lc2 = getSolarTerm(y, 2); // 立春
  const lc2Date = new Date(lc2.getFullYear(), lc2.getMonth(), lc2.getDate());
  const birth = new Date(y, m - 1, d, h, mi);
  const effYear = birth < lc2Date ? y - 1 : y;
  const nian = yearPillar(effYear);

  // 2. 月柱
  const yue = monthPillar(y, m, d, h, mi, nian.gan);

  // 3. 日柱
  const ri = dayPillar(y, m, d);

  // 4. 时柱
  const shi = hourPillar(ri.gan, h);

  // 5. 胎元
  const tai = taiYuan(yue.gan, yue.zhi);

  // 6. 命宫
  const ming = mingGong(yue.zhi, shi.zhi, nian.gan);

  // 7. 身宫
  const shen = shenGong(yue.zhi, shi.zhi, nian.gan);

  // 8. 大运
  const { daYun, qiYun, shun } = computeDaYun(gender, nian.gan, yue.gan, yue.zhi, birth);
  qiYun.shun = shun;  // 附加顺/逆排标记

  // 9. 生肖
  const shengXiao = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
  const sx = shengXiao[DZ.indexOf(nian.zhi)];

  return { name, gender, y, m, d, h, mi,
    nian, yue, ri, shi, tai, ming, shen,
    shengXiao: sx, daYun, qiYun, sanyuanBar: null };
}

  return y + '年' + m + '月' + d + '日';

function pad(n) { return n < 10 ? '0' + n : '' + n; }

  return '<span class="meta-tag">' + yinYang + '年' + gender + ' · ' + shunNi + '</span>';
}

// ===== v0.9.0 预置数据初始化 =====
function initPresetArchives() {
  var existing = getArchives();
  // 检测是否已存在预置数据（而非检测是否为空），避免用户已有旧档案时预置数据不写入
  var hasPreset = existing.some(function(a) { return a.isPreset === true; });
  if (!hasPreset) {
    var now = new Date().toISOString();
    var presets = PRESET_ARCHIVES.map(function(a, i) {
      return {
        id: Date.now() + i,
        nickname: a.nickname, name: a.name, gender: a.gender,
        year: a.year, month: a.month, day: a.day,
        hour: a.hour, min: a.min,
        prov: a.prov, city: a.city, dist: a.dist,
        useSolar: a.useSolar,
        calendarType: a.calendarType,
        isLeap: a.isLeap, lunarMonth: a.lunarMonth,
        bazi: null, sanyuan: null, extras: null,
        gongWeiType: null,
        createdAt: now, updatedAt: now,
        isPreset: true
      };
    });
    // 追加预置数据到现有档案（不替换用户自建档案）
    var merged = existing.concat(presets);
    saveArchivesRaw(merged);
  }
}

// ===== 隐私模式（v0.19.0）=====
// 默认开启：无键或 '1' → 开启；'0' → 关闭
function getPrivacyMode() {
  return localStorage.getItem(PRIVACY_KEY) !== '0';
}
function setPrivacyMode(on) {
  localStorage.setItem(PRIVACY_KEY, on ? '1' : '0');
}
// 统一显示名：隐私关闭维持现状（小名 / 正名）；隐私开启降级链 艺名 → 小名 → 匿名
function getDisplayName(a) {
  if (!a) return '';
  if (!getPrivacyMode()) {
    return (a.nickname || '') ? (a.nickname + ' / ' + a.name) : a.name;
  }
  return (a.yiming && a.yiming.trim()) ? a.yiming
    : (a.nickname && a.nickname.trim()) ? a.nickname
    : '匿名';
}
// 切换开关：更新两处按钮状态 + 重渲染档案面板（若开）+ 重排当前标题（若 output 有数据）
function togglePrivacy() {
  var on = !getPrivacyMode();
  setPrivacyMode(on);
  // 更新两处按钮
  var b1 = document.getElementById('btnPrivacy');
  var b2 = document.getElementById('btnPrivacy2');
  var label = on ? '🔒 隐私' : '🔓 隐私';
  [b1, b2].forEach(function(b) {
    if (!b) return;
    b.textContent = label;
    if (on) b.classList.add('privacy-on'); else b.classList.remove('privacy-on');
  });
  // 重渲染档案面板（若开）
  refreshArchiveModalIfOpen();
  // 重排当前标题（若 output 有数据）
  if (window.RENDER && document.getElementById('output') && document.getElementById('output').innerHTML.indexOf('person-info') >= 0) {
    window.RENDER.doPaipan();
  }
}

function isBirthFieldChanged(oldData, newData) {
  var keys = ['year','month','day','hour','min','gender','APP.calendarType','isLeap','lunarMonth','useSolar'];
  if (newData.useSolar) keys.push('prov', 'city', 'dist');
  for (var i = 0; i < keys.length; i++) {
    if (oldData[keys[i]] !== newData[keys[i]]) return true;
  }
  return false;
}

function saveEdit() {
  var edited = getEditFormData();
  // 校验
  var valid = true;
  if (!edited.name || edited.name.trim() === '') {
    document.getElementById('editName').classList.add('edit-error');
    valid = false;
  }
  if (/[<>&\"]/.test(edited.name)) {
    document.getElementById('editName').classList.add('edit-error');
    alert('姓名包含非法字符（< > & "）');
    valid = false;
  }
  if (!edited.year || edited.year < 1600 || edited.year > 2100) {
    document.getElementById('editYear').classList.add('edit-error');
    valid = false;
  }
  if (!edited.month || edited.month < 1 || edited.month > 12) {
    var mel = document.getElementById('editMonth') || document.getElementById('editMonthSelect');
    if (mel) mel.classList.add('edit-error');
    valid = false;
  }
  if (!edited.day || edited.day < 1 || edited.day > 31) {
    document.getElementById('editDay').classList.add('edit-error');
    valid = false;
  }
  if (edited.hour < 0 || edited.hour > 23 || edited.hour === undefined) {
    document.getElementById('editHour').classList.add('edit-error');
    valid = false;
  }
  if (edited.min < 0 || edited.min > 59) {
    document.getElementById('editMin').classList.add('edit-error');
    valid = false;
  }
  if (!valid) {
    if (!document.getElementById('editName').classList.contains('edit-error')) {
      alert('请检查红色标注的字段');
    }
    return;
  }

  // 从 localStorage 重新读取，避免并发覆盖
  var archives = getArchives();
  var old = archives[_editIdx];
  if (!old) { alert('档案已被删除'); closeEditPanel(); return; }

  // 出生字段变更 → 清除排盘缓存
  if (isBirthFieldChanged(old, edited)) {
    edited.bazi = null;
    edited.sanyuan = null;
    edited.extras = null;
  } else {
    edited.bazi = old.bazi;
    edited.sanyuan = old.sanyuan;
    edited.extras = old.extras;
    edited.gongWeiType = old.gongWeiType;
  }

  // 同名同性别冲突检查（排除自身）
  var conflictIdx = -1;
  for (var c = 0; c < archives.length; c++) {
    if (c === _editIdx) continue;
    if (archives[c].name === edited.name && archives[c].gender === edited.gender) {
      conflictIdx = c;
      break;
    }
  }
  if (conflictIdx >= 0) {
    if (!confirm('「' + getDisplayName(edited) + '」已存在，覆盖更新？')) return;
    // 删除冲突项，保留当前编辑项
    archives.splice(conflictIdx, 1);
    if (conflictIdx < _editIdx) _editIdx--;
  }

  edited.updatedAt = new Date().toISOString();
  if (old.isPreset) edited.isPreset = false;
  else edited.isPreset = old.isPreset;

  // 合并到原对象
  archives[_editIdx] = Object.assign({}, old, edited);
  saveArchives(archives);
  // 直接关闭弹窗（不经过 closeEditPanel，避免"未保存修改"确认）
  document.getElementById('editOverlay').classList.remove('show');
  _editOriginal = null;
  _editIdx = -1;
  refreshArchiveModalIfOpen();
}

// ---- 回收站 ----
function showTrash() {
  renderTrash();
  document.getElementById('trashOverlay').classList.add('show');
}

function hideTrash() {
  document.getElementById('trashOverlay').classList.remove('show');
}

function renderTrash() {
  const list = document.getElementById('trashList');
  const trash = getTrash();
  if (!trash.length) {
    list.innerHTML = '<div style="color:var(--c-gray);text-align:center;padding:20px;">回收站为空</div>';
    return;
  }
  list.innerHTML = trash.map((a, i) => {
    const solar = a.useSolar ? '☀' : '';
    var delTime = a.deletedAt ? new Date(a.deletedAt).toLocaleString('zh-CN', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).replace(/\//g,'-') : '';
    return `<div style="display:flex;flex-direction:column;padding:8px 8px;border-bottom:1px solid rgba(128,128,128,.15);">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span>${getDisplayName(a)} ${a.gender === '男' ? '♂' : '♀'} ${a.year}/${a.month}/${a.day} ${a.hour}:${String(a.min||0).padStart(2,'0')} ${solar}</span>
        <div style="display:flex;gap:6px;">
          <button class="archive-row-edit" onclick="ARCHIVE.restoreFromTrash(${i})" title="恢复">↩️ 恢复</button>
          <button class="archive-row-del" onclick="ARCHIVE.permanentDelete(${i})" title="彻底删除">🗑️ 彻底删除</button>
        </div>
      </div>
      ${delTime ? '<div style="font-size:11px;color:var(--c-gray);margin-top:2px;">删除于: ' + delTime + '</div>' : ''}
    </div>`;
  }).join('');
}

function restoreFromTrash(idx) {
  const trash = getTrash();
  if (!trash[idx]) return;
  const item = trash[idx];
  const { deletedAt, ...arch } = item;
  // 恢复后预置标记置为false（PRD E1）
  const restored = Object.assign({}, arch, { isPreset: false, updatedAt: new Date().toISOString() });
  const archives = getArchives();
  const existIdx = archives.findIndex(a => a.name === restored.name && a.gender === restored.gender);
  if (existIdx >= 0) {
    if (!confirm('「' + getDisplayName(restored) + '」已存在，覆盖恢复？')) return;
    archives[existIdx] = restored;
  } else {
    archives.push(restored);
  }
  saveArchives(archives);
  trash.splice(idx, 1);
  saveTrash(trash);
  refreshArchiveModalIfOpen();
  renderTrash();
}

// v0.12.0 彻底删除单条
function permanentDelete(idx) {
  const trash = getTrash();
  if (!trash[idx]) return;
  if (!confirm('确定彻底删除「' + getDisplayName(trash[idx]) + '」？此操作不可恢复。')) return;
  trash.splice(idx, 1);
  saveTrash(trash);
  renderTrash();
}

function emptyTrash() {
  const trash = getTrash();

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function openArchivePanel() {
  renderArchiveModal();
  document.getElementById('archiveOverlay').classList.add('show');
  document.getElementById('archive-search-modal').value = '';
  setTimeout(function() { document.getElementById('archive-search-modal').focus(); }, 100);
}

  document.getElementById('archiveOverlay').classList.remove('show');

function renderArchiveModal() {
  var listEl = document.getElementById('archive-modal-list');
  var archives = getArchives();
  if (!listEl) return;

  if (archives.length === 0) {
    listEl.innerHTML = '<div class="archive-modal-empty">暂无档案，排盘后自动保存</div>';
    return;
  }

  // Sort by updatedAt desc
  archives.sort(function(a, b) {
    return (b.updatedAt || '').localeCompare(a.updatedAt || '');
  });
  saveArchives(archives);

  var html = '';
  for (var i = 0; i < archives.length; i++) {
    var a = archives[i];
    var genderIcon = a.gender === '男' ? '♂' : '♀';

      + '<div class="archive-row-info">'
      + '<span class="archive-row-name">' + escHtml(displayName) + '</span>'
      + '<span class="archive-row-gender ' + genderCls + '">' + genderIcon + '</span>'
      + '<span class="archive-row-date">' + escHtml(dateStr) + '</span>'

function filterArchives(keyword) {
  var k = (keyword || '').trim().toLowerCase();
  var archives = getArchives();
  var listEl = document.getElementById('archive-modal-list');
  if (!listEl) return;

  if (!k) {
    renderArchiveModal();
    return;
  }

  var filtered = [];
  for (var i = 0; i < archives.length; i++) {
    var a = archives[i];
    var match = (a.nickname || '').toLowerCase().indexOf(k) >= 0
      || (a.yiming || '').toLowerCase().indexOf(k) >= 0
      || (a.name || '').toLowerCase().indexOf(k) >= 0;
    if (match) filtered.push({arch: a, idx: i});
  }

  if (filtered.length === 0) {
    listEl.innerHTML = '<div class="archive-modal-empty">未找到匹配档案</div>';
    return;
  }

  var html = '';
  for (var j = 0; j < filtered.length; j++) {
    var a = filtered[j].arch;
    var idx = filtered[j].idx;
    var genderIcon = a.gender === '男' ? '♂' : '♀';
    var genderCls = a.gender === '男' ? 'male' : 'female';
    var displayName = getDisplayName(a);
    var dateStr = a.year + '年';
    html += '<div class="archive-modal-row">'
      + '<div class="archive-row-info">'
      + '<span class="archive-row-name">' + escHtml(displayName) + '</span>'
      + '<span class="archive-row-gender ' + genderCls + '">' + genderIcon + '</span>'
      + '<span class="archive-row-date">' + escHtml(dateStr) + '</span>'
      + '</div>'
      + '<div class="archive-row-actions">'
      + '<button class="archive-row-edit" onclick="ARCHIVE.openEditPanel(' + idx + ')">✏️ 修改</button>'
      + '<button class="archive-row-del" onclick="ARCHIVE.moveToTrash(' + idx + ')">🗑️ 删除</button>'
      + '<button class="archive-row-btn" onclick="ARCHIVE.loadFromArchive(' + idx + ')">排盘</button>'
      + '</div>'
      + '</div>';
  }
  listEl.innerHTML = html;
}

let gongWeiGroups = [];
let gongWeiTrash = [];

// ===== localStorage 读写 =====
function loadGroups() {
  let raw = localStorage.getItem('bz_gongwei_groups');
  if (!raw) return initGongWeiGroups();
  try { let g = JSON.parse(raw); if (!Array.isArray(g) || g.length === 0) return initGongWeiGroups(); return g; }
  catch(e) { return initGongWeiGroups(); }
}
function loadTrash() { let raw = localStorage.getItem('bz_gongwei_trash'); return raw ? JSON.parse(raw) : []; }
function loadSelected() { let raw = localStorage.getItem('bz_gongwei_selected'); return raw ? JSON.parse(raw) : []; }
function persistGroups() { localStorage.setItem('bz_gongwei_groups', JSON.stringify(gongWeiGroups)); }
function persistTrash() { localStorage.setItem('bz_gongwei_trash', JSON.stringify(gongWeiTrash)); }
function persistSelected() { localStorage.setItem('bz_gongwei_selected', JSON.stringify(selectedGongWei)); }
// ===== v0.20.0 常用宫位数据层 =====
function loadFav() { var raw = localStorage.getItem('bz_gongwei_fav'); return raw ? JSON.parse(raw) : []; }
function persistFav(arr) { localStorage.setItem('bz_gongwei_fav', JSON.stringify(arr)); }
function isFav(name) { var fav = loadFav(); for (var i = 0; i < fav.length; i++) { if (fav[i] === name) return true; } return false; }
function getFavGroups() { var fav = loadFav(); var result = []; for (var i = 0; i < fav.length; i++) { var g = findGroupByName(fav[i]); if (g) result.push(g); } return result; }
function nowISO() { return new Date().toISOString(); }
function generateGwId() { return 'gw_' + Date.now().toString(36); }
function findGroupByName(name) {
  var n = name.replace(/宫位$/, '').toLowerCase();
  for (var i = 0; i < gongWeiGroups.length; i++) {
    if (gongWeiGroups[i].name.replace(/宫位$/, '').toLowerCase() === n) return gongWeiGroups[i];
  }
  return null;
}
function getGroupColor(name, isPreset) {
  if (isPreset && GONGWEI_COLORS[name]) return GONGWEI_COLORS[name];
  return '#8b7e6a';
}

// ===== 初始化（首次/数据损坏时） =====
function initGongWeiGroups() {
  var presetNames = Object.keys(GONGWEI_MAP);
  var now = nowISO();
  var groups = presetNames.map(function(name, i) {
    return {
      id: 'gw_preset_' + String(i + 1).padStart(2, '0'),
      name: name, labels: GONGWEI_MAP[name],
      isPreset: true, color: GONGWEI_COLORS[name] || '#8b7e6a',
      createdAt: now, updatedAt: now
    };
  });
  gongWeiGroups = groups; persistGroups(); persistTrash([]); persistSelected([]);
  return groups;
}

// ===== CRUD =====
function addGroup(name, labels) {
  if (!name || name.trim().length === 0) return { ok: false, error: '组名不能为空' };
  if (name.length > 6) return { ok: false, error: '组名不能超过6个字' };
  if (findGroupByName(name)) return { ok: false, error: '该名称已存在' };
  for (var i = 0; i < 7; i++) {
    if (labels[i] && labels[i].length > 12) return { ok: false, error: '标签不能超过12个字' };
  }
  var now = nowISO();
  var group = {
    id: generateGwId(), name: name.trim(),
    labels: labels.map(function(l) { return l.trim(); }),
    isPreset: false, color: '#8b7e6a',
    createdAt: now, updatedAt: now
  };
  gongWeiGroups.push(group); persistGroups();
  return { ok: true, group: group };
}

function updateGroup(id, newName, newLabels) {
  var idx = -1;
  for (var i = 0; i < gongWeiGroups.length; i++) { if (gongWeiGroups[i].id === id) { idx = i; break; } }
  if (idx === -1) return { ok: false, error: '宫位组不存在' };
  var group = gongWeiGroups[idx];
  if (!newName || newName.trim().length === 0) return { ok: false, error: '组名不能为空' };
  if (newName.length > 6) return { ok: false, error: '组名不能超过6个字' };
  var conflict = findGroupByName(newName);
  if (conflict && conflict.id !== id) return { ok: false, error: '该名称已存在' };
  for (var i = 0; i < 7; i++) {
    if (newLabels[i] && newLabels[i].length > 12) return { ok: false, error: '标签不能超过12个字' };
  }
  var oldName = group.name;
  group.name = newName.trim();
  group.labels = newLabels.map(function(l) { return l.trim(); });
  group.isPreset = false;
  group.color = getGroupColor(group.name, false);
  group.updatedAt = nowISO();
  if (oldName !== group.name) {
    var si = selectedGongWei.indexOf(oldName);
    if (si !== -1) selectedGongWei[si] = group.name;
    // v0.20.0 同步常用宫位名称
    var fav = loadFav();
    var fi = -1;
    for (var j = 0; j < fav.length; j++) { if (fav[j] === oldName) { fi = j; break; } }
    if (fi >= 0) { fav[fi] = group.name; persistFav(fav); }
  }
  persistGroups(); persistSelected();
  return { ok: true, group: group };
}

function deleteGroup(id) {
  var idx = -1;
  for (var i = 0; i < gongWeiGroups.length; i++) { if (gongWeiGroups[i].id === id) { idx = i; break; } }
  if (idx === -1) return { ok: false, error: '宫位组不存在' };
  var removed = gongWeiGroups.splice(idx, 1)[0];
  gongWeiTrash.push({ id: removed.id, group: removed, deletedAt: nowISO() });
  selectedGongWei = selectedGongWei.filter(function(n) { return n !== removed.name; });
  // v0.20.0 同步常用宫位：删除组时从 fav 中移除
  var fav = loadFav();
  var cleanedFav = [];
  for (var i = 0; i < fav.length; i++) { if (fav[i] !== removed.name) cleanedFav.push(fav[i]); }
  if (cleanedFav.length !== fav.length) persistFav(cleanedFav);
  persistGroups(); persistTrash(); persistSelected();
  return { ok: true };
}

function restoreFromTrash(id) {
  var idx = -1;
  for (var i = 0; i < gongWeiTrash.length; i++) { if (gongWeiTrash[i].id === id) { idx = i; break; } }
  if (idx === -1) return { ok: false, error: '回收站中不存在' };
  var item = gongWeiTrash.splice(idx, 1)[0];
  if (findGroupByName(item.group.name)) {
    item.group.name = item.group.name + '(恢复)';
    item.group.updatedAt = nowISO();
  }
  gongWeiGroups.push(item.group);
  persistGroups(); persistTrash();
  return { ok: true, group: item.group };
}

function clearTrash() { gongWeiTrash = []; persistTrash(); return { ok: true }; }

function moveGroup(fromIdx, toIdx) {
  if (fromIdx < 0 || fromIdx >= gongWeiGroups.length || toIdx < 0 || toIdx >= gongWeiGroups.length || fromIdx === toIdx) return { ok: false };
  var item = gongWeiGroups.splice(fromIdx, 1)[0];
  gongWeiGroups.splice(toIdx, 0, item);
  persistGroups();
  return { ok: true };
}
function moveUp(idx) { if (idx <= 0) return { ok: false }; return moveGroup(idx, idx - 1); }
function moveDown(idx) { if (idx >= gongWeiGroups.length - 1) return { ok: false }; return moveGroup(idx, idx + 1); }

// ===== 恢复默认 =====
function resetToDefaults() {
  var presetNames = Object.keys(GONGWEI_MAP);
  var now = nowISO();
  presetNames.forEach(function(name, i) {
    var presetId = 'gw_preset_' + String(i + 1).padStart(2, '0');
    var ti = -1;
    for (var j = 0; j < gongWeiTrash.length; j++) { if (gongWeiTrash[j].id === presetId) { ti = j; break; } }
    if (ti !== -1) {
      var item = gongWeiTrash.splice(ti, 1)[0];
      item.group.name = name; item.group.labels = GONGWEI_MAP[name].slice();
      item.group.isPreset = true; item.group.color = GONGWEI_COLORS[name] || '#8b7e6a';
      item.group.updatedAt = now;
      gongWeiGroups.push(item.group);
      return;
    }
    var gi = -1;
    for (var k = 0; k < gongWeiGroups.length; k++) { if (gongWeiGroups[k].id === presetId) { gi = k; break; } }
    if (gi !== -1) {
      gongWeiGroups[gi].name = name; gongWeiGroups[gi].labels = GONGWEI_MAP[name].slice();
      gongWeiGroups[gi].isPreset = true; gongWeiGroups[gi].color = GONGWEI_COLORS[name] || '#8b7e6a';
      gongWeiGroups[gi].updatedAt = now;
      return;
    }
    gongWeiGroups.push({
      id: presetId, name: name, labels: GONGWEI_MAP[name].slice(),
      isPreset: true, color: GONGWEI_COLORS[name] || '#8b7e6a',
      createdAt: now, updatedAt: now
    });
  });
  persistGroups(); persistTrash();
  // v0.20.0 恢复默认后，将恢复的预置组加入常用（若尚未在常用中）
  var fav = loadFav();
  var changed = false;
  for (var i = 0; i < gongWeiGroups.length; i++) {
    var name = gongWeiGroups[i].name;
    if (fav.indexOf(name) < 0) { fav.push(name); changed = true; }
  }
  if (changed) persistFav(fav);
  return { ok: true };
}

// area: 'main' | 'sanyuan'
// colCount: 5 | 7（普通5列 / 含大运流年7列）
function buildGongWeiTagRows(area, colCount) {
  if (!selectedGongWei.length) return [];
  colCount = colCount || 5;
  var rows = [];
  var cols = area === 'main' ? ['nian','yue','ri','shi'] : ['tai','ming','shen'];
  var hasExt = colCount >= 7; // 是否有大运/流年扩展列

  var favGroups = getFavGroups();
  for (var i = 0; i < favGroups.length; i++) {
    var gwName = favGroups[i].name;
    if (selectedGongWei.indexOf(gwName) < 0) continue;
    var group = favGroups[i];
    var labels = group.labels;
    var color = group.color || '#8b7e6a';
    var cls = area === 'main' ? 'gz-tags' : 'gz-tags-sy';
    var html = '<tr class="' + cls + '" data-gw-type="' + gwName + '">';
    // rl 列：显示宫位名称，左边框色
    html += '<td class="rl" style="border-left:3px solid ' + color + ';padding-left:5px;">' + gwName + '</td>';
    // area为main时有rl列，area为sanyuan时rl后还需一个空td
    if (area === 'sanyuan') { html += '<td></td>'; }
    for (var j = 0; j < cols.length; j++) {
      var gw = cols[j];
      var idx = GW_INDEX[gw];
      html += '<td data-gw="' + gw + '">' + (labels[idx] || '') + '</td>';
    }
    if (hasExt) {
      html += '<td class="sep"></td><td class="col-ln"></td>';
    }
    html += '</tr>';
    rows.push(html);
  }
  return rows;
}

  var oldTags = document.querySelectorAll('.gz-tags, .gz-tags-sy');
  for (var i = 0; i < oldTags.length; i++) {
    oldTags[i].parentNode && oldTags[i].parentNode.removeChild(oldTags[i]);
  }
  if (!selectedGongWei.length) {
    updateGzTriggerText();
    return;
  }

  // 2. 遍历所有 .chart 表格，在每个表格的每个 tr.hd 之前插入标签行
  var tables = document.querySelectorAll('table.chart');
  for (var t = 0; t < tables.length; t++) {
    var table = tables[t];
    var hdRows = table.querySelectorAll('tr.hd');
    for (var h = 0; h < hdRows.length; h++) {
      var hdRow = hdRows[h];

      // 判断该表格是四柱区还是三垣区
      // 四柱区 hd 的结构: <th class="rl">盘式</th><th>年柱</th>...
      // 三垣区 hd 的结构: <th class="rl">三垣</th>...
      var isSanyuan = false;
      var hdThs = hdRow.querySelectorAll('th');
      if (hdThs.length > 0 && hdThs[0].textContent === '三垣') {
        isSanyuan = true;
      }

      // 计算列数
      var colCount = hdThs.length;

      // 生成标签行
      var area = isSanyuan ? 'sanyuan' : 'main';
      var tagRows = buildGongWeiTagRows(area, colCount);
      if (!tagRows.length) continue;

      // 在 hd 行之前插入
      hdRow.insertAdjacentHTML('beforebegin', tagRows.join(''));
    }
  }

  // 3. 更新面板按钮文字
  updateGzTriggerText();
  // 4. 同步 checkbox 状态
  syncGzCheckboxes();
}

// 更新面板按钮文字
function updateGzTriggerText() {
  var trigger = document.getElementById('gz-trigger');
  if (!trigger) return;
  var count = selectedGongWei.length;
  var countSpan = trigger.querySelector('.gz-count');
  var summarySpan = trigger.querySelector('.gz-summary');
  if (countSpan) {
    countSpan.textContent = count > 0 ? '(' + count + ')' : '';
  }
  if (summarySpan) {
    if (count === 0) {
      summarySpan.textContent = '';
    } else if (count <= 3) {
      summarySpan.textContent = selectedGongWei.join('·');
    } else {
      summarySpan.textContent = selectedGongWei.slice(0, 2).join('·') + ' +' + (count - 2);
    }
  }
}

// 同步 popover checkbox 状态
function syncGzCheckboxes() {
  var cbs = document.querySelectorAll('#gz-popover .gz-cb-item input[type="checkbox"]');
  for (var i = 0; i < cbs.length; i++) {
    var val = cbs[i].value;
    cbs[i].checked = selectedGongWei.indexOf(val) >= 0;
    var label = cbs[i].parentElement;
    if (cbs[i].checked) {
      label.classList.add('checked');
    } else {
      label.classList.remove('checked');
    }
  }
}

function toggleGongWei(name, checked) {
  var idx = selectedGongWei.indexOf(name);
  if (checked && idx < 0) {
    selectedGongWei.push(name);
  } else if (!checked && idx >= 0) {
    selectedGongWei.splice(idx, 1);
  }
  persistSelected();
  updateGongWeiTags();
}

function selectAllGongWei() {
  var favGroups = getFavGroups();
  selectedGongWei = [];
  for (var i = 0; i < favGroups.length; i++) { selectedGongWei.push(favGroups[i].name); }
  persistSelected();
  updateGongWeiTags();
  closeGzPopover();
}

function clearAllGongWei() {
  selectedGongWei = [];
  persistSelected();
  updateGongWeiTags();
  closeGzPopover();
}

function toggleGzPopover(e) {
  if (e) e.stopPropagation();
  var popover = document.getElementById('gz-popover');
  if (!popover) return;
  // 每次打开前同步 checkbox（数据可能已在设置面板中变化）
  syncGzCheckboxes();

}

function closeGzPopover() {
  var popover = document.getElementById('gz-popover');
  if (popover) popover.classList.remove('open');
}

// ===== v0.20.0 常用宫位操作 =====
function toggleFav(name) {
  var fav = loadFav();
  var idx = -1;
  for (var i = 0; i < fav.length; i++) { if (fav[i] === name) { idx = i; break; } }
  if (idx >= 0) {
    // 取消常用：从 fav 移除 + 级联清理 selected
    fav.splice(idx, 1);
    var si = selectedGongWei.indexOf(name);
    if (si >= 0) selectedGongWei.splice(si, 1);
  } else {
    // 加入常用：追加到末尾
    fav.push(name);
  }
  persistFav(fav);
  persistSelected();
  if (gzSettingsView === 'all') renderGzSettingsAll();
  else if (gzSettingsView === 'fav') renderGzSettingsFav();
  updateGongWeiTags();
}

function removeFromFav(name) {
  var fav = loadFav();
  var idx = -1;
  for (var i = 0; i < fav.length; i++) { if (fav[i] === name) { idx = i; break; } }
  if (idx >= 0) fav.splice(idx, 1);
  // 级联清理 selected
  var si = selectedGongWei.indexOf(name);
  if (si >= 0) selectedGongWei.splice(si, 1);
  persistFav(fav);
  persistSelected();
  renderGzSettingsFav();
  updateGongWeiTags();
}

function moveFavUp(idx) {
  if (idx <= 0) return;
  var fav = loadFav();
  var item = fav.splice(idx, 1)[0];
  fav.splice(idx - 1, 0, item);
  persistFav(fav);
  renderGzSettingsFav();
  updateGongWeiTags();
}

function moveFavDown(idx) {
  var fav = loadFav();
  if (idx >= fav.length - 1) return;
  var item = fav.splice(idx, 1)[0];
  fav.splice(idx + 1, 0, item);
  persistFav(fav);
  renderGzSettingsFav();
  updateGongWeiTags();
}

function moveFav(fromIdx, toIdx) {
  var fav = loadFav();
  if (fromIdx < 0 || fromIdx >= fav.length || toIdx < 0 || toIdx >= fav.length || fromIdx === toIdx) return;
  var item = fav.splice(fromIdx, 1)[0];
  fav.splice(toIdx, 0, item);
  persistFav(fav);
  renderGzSettingsFav();
  updateGongWeiTags();
}

function resetFavOrder() {
  var fav = loadFav();
  // 按 gongWeiGroups 顺序重排 fav
  var ordered = [];
  for (var i = 0; i < gongWeiGroups.length; i++) {
    var name = gongWeiGroups[i].name;
    if (fav.indexOf(name) >= 0) ordered.push(name);
  }
  persistFav(ordered);
  renderGzSettingsFav();
  updateGongWeiTags();
}

// v0.20.0 常用宫位拖拽排序
function favDragStart(e, idx) {
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', String(idx));
  e.dataTransfer.setData('type', 'fav');
  e.target.classList.add('dragging');
}
function favDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  var item = e.target.closest('.gz-set-item');
  if (item) item.classList.add('drag-over');
}
function favDragLeave(e) {
  var item = e.target.closest('.gz-set-item');
  if (item) item.classList.remove('drag-over');
}
function favDrop(e, toIdx) {
  e.preventDefault();
  var fromIdx = parseInt(e.dataTransfer.getData('text/plain'));
  var type = e.dataTransfer.getData('type');
  if (type !== 'fav' || isNaN(fromIdx) || fromIdx === toIdx) return;
  moveFav(fromIdx, toIdx);
}
function favDragEnd(e) {
  e.target.classList.remove('dragging');
  var items = document.querySelectorAll('.gz-set-item');
  for (var i = 0; i < items.length; i++) items[i].classList.remove('drag-over');
}

function renderGzSettingsList() {

  if (gzSettingsView === 'all') renderGzSettingsAll();
  else if (gzSettingsView === 'fav') renderGzSettingsFav();
}

// ===== v0.13.0 编辑弹窗 =====
function openGzEdit(id) {
  gzEditingId = id || null;
  var titleEl = document.getElementById('gzEditTitle');
  var nameEl = document.getElementById('gzEditName');
  var errEl = document.getElementById('gzEditNameErr');
  errEl.style.display = 'none';
  errEl.textContent = '';

  if (id) {
    var group = null;
    for (var i = 0; i < gongWeiGroups.length; i++) {
      if (gongWeiGroups[i].id === id) { group = gongWeiGroups[i]; break; }
    }
    if (!group) return;
    titleEl.textContent = '编辑「' + group.name + '宫位」';
    nameEl.value = group.name;
    for (var j = 0; j < 7; j++) {
      document.getElementById('gzEditL' + j).value = group.labels[j] || '';
    }
  } else {
    titleEl.textContent = '新增宫位组';
    nameEl.value = '';
    for (var k = 0; k < 7; k++) {
      document.getElementById('gzEditL' + k).value = '';
    }
  }
  checkGzEditValid();
  document.getElementById('gzEditOverlay').classList.add('show');
  setTimeout(function() { nameEl.focus(); }, 100);
}

function closeGzEdit() {
  document.getElementById('gzEditOverlay').classList.remove('show');
  gzEditingId = null;
}

function checkCloseGzEdit() {
  // 简单策略：直接关闭（未保存的内容丢失提示由 product 保持一致）
  closeGzEdit();
}

function checkGzEditValid() {
  var btn = document.getElementById('gzEditSaveBtn');
  var name = document.getElementById('gzEditName').value.trim();
  btn.disabled = name.length === 0;
}

// 监听输入变化以启用/禁用保存按钮
(function() {
  var inputs = [document.getElementById('gzEditName')];
  for (var i = 0; i < 7; i++) inputs.push(document.getElementById('gzEditL' + i));
  for (var j = 0; j < inputs.length; j++) {
    inputs[j].addEventListener('input', checkGzEditValid);
  }
})();

function saveGzEdit() {
  var name = document.getElementById('gzEditName').value.trim();
  var labels = [];
  for (var i = 0; i < 7; i++) {
    labels.push(document.getElementById('gzEditL' + i).value.trim());
  }

  var result;
  if (gzEditingId) {
    result = updateGroup(gzEditingId, name, labels);
  } else {
    result = addGroup(name, labels);
  }

  if (!result.ok) {
    var errEl = document.getElementById('gzEditNameErr');
    errEl.textContent = result.error;
    errEl.style.display = 'block';
    return;
  }

  closeGzEdit();
  if (gzSettingsView === 'all') renderGzSettingsAll();
  else if (gzSettingsView === 'fav') renderGzSettingsFav();
  updateGongWeiTags();
}

function renderGzTrashList() {
  var list = document.getElementById('gzTrashList');
  if (gongWeiTrash.length === 0) {
    list.innerHTML = '<div class="gz-trash-empty">回收站为空</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < gongWeiTrash.length; i++) {
    var t = gongWeiTrash[i];
    var g = t.group;
    var preview = g.labels.join('·');
    if (preview.length > 40) preview = preview.substr(0, 40) + '…';
    var dt = new Date(t.deletedAt);
    var timeStr = dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-'
      + String(dt.getDate()).padStart(2,'0') + ' ' + String(dt.getHours()).padStart(2,'0')
      + ':' + String(dt.getMinutes()).padStart(2,'0');

    html += '<div class="gz-trash-item">'
      + '<div class="gz-trash-info">'
      + '<div class="gz-trash-name">' + g.name + '宫位</div>'
      + '<div class="gz-trash-preview">' + preview + '</div>'
      + '<div class="gz-trash-time">删除于 ' + timeStr + '</div>'
      + '</div>'
      + '<div class="gz-trash-actions">'
      + '<button onclick="GONGWEI.restoreFromTrash(\'' + t.id + '\');GONGWEI.renderGzTrashList();GONGWEI.renderGzSettingsAll();GONGWEI.updateGongWeiTags();">恢复</button>'
      + '</div></div>';
  }
  list.innerHTML = html;
}
